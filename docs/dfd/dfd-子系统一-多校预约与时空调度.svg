  <style>
    .title { font: bold 20px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0d1b2a; }
    .sub { font: 14px "Microsoft YaHei", sans-serif; fill: #415a77; }
    .ent { fill: #e0e1dd; stroke: #1b263b; stroke-width: 2; }
    .proc0 { fill: #d4a373; stroke: #1b263b; stroke-width: 2; }
    .proc { fill: #a3b18a; stroke: #1b263b; stroke-width: 1.5; }
    .store { fill: #f5f5f4; stroke: #1b263b; stroke-width: 1.5; fill-opacity: 1; }
    .flow { fill: none; stroke: #1b263b; stroke-width: 1.8; marker-end: url(#arr); }
    .ft { font: 12px "Microsoft YaHei", sans-serif; fill: #0d1b2a; font-weight: 600; }
    .boxt { font: 13px "Microsoft YaHei", sans-serif; fill: #0d1b2a; text-anchor: middle; }
    .sect { font: bold 16px "Microsoft YaHei", sans-serif; fill: #1b263b; }
    .panelTop { fill: #fffaf0; stroke: #d9d4c8; stroke-width: 1; }
    .panelBottom { fill: #f8fbff; stroke: #d4deea; stroke-width: 1; }
    .divider { stroke: #9fb3c8; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
