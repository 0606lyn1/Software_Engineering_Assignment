<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 980" width="1320" height="980">
  <title>Subsystem 1 Full Use Case Diagram</title>
  <style>
    .title { font: bold 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1a1a2e; }
    .sub { font: 13px "Microsoft YaHei", sans-serif; fill: #4a5568; }
    .sysbox { fill: #f7fafc; stroke: #2d3748; stroke-width: 2; stroke-dasharray: 8 4; }
    .actorbox { fill: #edf2f7; stroke: #2b6cb0; stroke-width: 1.8; }
    .actort { font: 13px "Microsoft YaHei", sans-serif; fill: #1a202c; text-anchor: middle; }
    .extbox { fill: #fffaf0; stroke: #c05621; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .extt { font: 12px "Microsoft YaHei", sans-serif; fill: #744210; text-anchor: middle; }
    .uc { fill: #ffffff; stroke: #2f855a; stroke-width: 1.6; }
    .ucsub { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.4; }
    .uct { font: 12px "Microsoft YaHei", sans-serif; fill: #1a202c; text-anchor: middle; }
    .ucid { font: 11px "Microsoft YaHei", sans-serif; fill: #4a5568; text-anchor: middle; }
    .line { stroke: #2d3748; stroke-width: 1.4; fill: none; marker-end: url(#mArr); }
    .lineaux { stroke: #718096; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; marker-end: url(#mArrGray); }
    .lineInc { stroke: #7c3aed; stroke-width: 1.35; stroke-dasharray: 5 4; fill: none; marker-end: url(#mArrInc); }
    .lineExt { stroke: #c2410c; stroke-width: 1.35; stroke-dasharray: 5 4; fill: none; marker-end: url(#mArrExt); }
    .note { font: 11px "Microsoft YaHei", sans-serif; fill: #4a5568; }
    .small { font: 10px "Microsoft YaHei", sans-serif; fill: #4a5568; text-anchor: middle; }
    .rel { font: bold 11px "Microsoft YaHei", sans-serif; fill: #1d4ed8; text-anchor: middle; paint-order: stroke fill; stroke: #fafafa; stroke-width: 3px; }
    .relData { font: 9px "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; paint-order: stroke fill; stroke: #fafafa; stroke-width: 2px; }
    .stInc { font: 10px "Microsoft YaHei", sans-serif; fill: #6d28d9; text-anchor: middle; font-weight: bold; paint-order: stroke fill; stroke: #fafafa; stroke-width: 2px; }
    .stExt { font: 10px "Microsoft YaHei", sans-serif; fill: #c2410c; text-anchor: middle; font-weight: bold; paint-order: stroke fill; stroke: #fafafa; stroke-width: 2px; }
    .relLegend { font: 11px "Microsoft YaHei", sans-serif; fill: #334155; text-anchor: middle; }
  </style>
  <defs>
    <marker id="mArr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2d3748"/></marker>
    <marker id="mArrGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#718096"/></marker>
    <marker id="mArrInc" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#7c3aed"/></marker>
    <marker id="mArrExt" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#c2410c"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#fafafa"/>
  <text x="660" y="38" text-anchor="middle" class="title">子系统一：多校体育场地预约与时空调度 — 用例图（完整版）</text>
  <text x="660" y="62" text-anchor="middle" class="sub">关联 · 依赖 · 包含«include» · 扩展«extend» · UC-A～G 及子用例</text>

  <!-- actors -->
  <rect x="48" y="130" width="108" height="52" rx="6" class="actorbox"/>
  <text x="102" y="162" class="actort">学生</text>
  <rect x="48" y="230" width="108" height="52" rx="6" class="actorbox"/>
  <text x="102" y="262" class="actort">教师</text>
  <rect x="48" y="330" width="128" height="56" rx="6" class="actorbox"/>
  <text x="112" y="358" class="actort">场地管理员</text>
  <text x="112" y="376" class="small">可选</text>

  <!-- system boundary -->
  <rect x="200" y="96" width="1020" height="840" rx="12" class="sysbox"/>
  <text x="710" y="126" text-anchor="middle" class="title" style="font-size:15px;">多校体育场地预约与时空调度系统</text>

  <!-- main use cases (cx=500) -->
  <ellipse cx="500" cy="220" rx="168" ry="38" class="uc"/>
  <text x="500" y="214" class="ucid">UC-A</text>
  <text x="500" y="232" class="uct">教师学期占场</text>

  <ellipse cx="500" cy="330" rx="168" ry="38" class="uc"/>
  <text x="500" y="324" class="ucid">UC-B</text>
  <text x="500" y="342" class="uct">学生课外预约</text>

  <ellipse cx="500" cy="440" rx="168" ry="38" class="uc"/>
  <text x="500" y="434" class="ucid">UC-C</text>
  <text x="500" y="452" class="uct">临时闭馆</text>

  <ellipse cx="500" cy="550" rx="188" ry="40" class="uc"/>
  <text x="500" y="542" class="ucid">UC-D</text>
  <text x="500" y="560" class="uct">首页就近空闲推荐</text>

  <ellipse cx="500" cy="660" rx="168" ry="38" class="uc"/>
  <text x="500" y="654" class="ucid">UC-E</text>
  <text x="500" y="672" class="uct">导出对账 CSV</text>

  <ellipse cx="500" cy="770" rx="200" ry="42" class="uc"/>
  <text x="500" y="758" class="ucid">UC-F</text>
  <text x="500" y="776" class="uct">使用情况管理与统计</text>
  <text x="500" y="792" class="small">甘特列表、占用率、筛选</text>

  <ellipse cx="500" cy="890" rx="188" ry="38" class="uc"/>
  <text x="500" y="884" class="ucid">UC-G</text>
  <text x="500" y="902" class="uct">配置提醒与隐私偏好</text>

  <!-- sub use cases (included / extending) -->
  <ellipse cx="940" cy="220" rx="130" ry="36" class="ucsub"/>
  <text x="940" y="214" class="ucid">UC-A1</text>
  <text x="940" y="232" class="uct">教学占用冲突校验</text>

  <ellipse cx="940" cy="330" rx="130" ry="36" class="ucsub"/>
  <text x="940" y="324" class="ucid">UC-B1</text>
  <text x="940" y="342" class="uct">时间片冲突检测</text>

  <ellipse cx="940" cy="460" rx="130" ry="40" class="ucsub"/>
  <text x="940" y="452" class="ucid">UC-B2</text>
  <text x="940" y="470" class="uct">核销与爽约认定</text>
  <text x="940" y="486" class="small">扩展·可选接入</text>

  <ellipse cx="940" cy="890" rx="130" ry="36" class="ucsub"/>
  <text x="940" y="884" class="ucid">UC-G1</text>
  <text x="940" y="902" class="uct">清除行为数据</text>

  <!-- «include» base → included -->
  <path d="M 668 220 L 810 220" class="lineInc"/>
  <text x="739" y="208" class="stInc">«include»</text>

  <path d="M 668 330 L 810 330" class="lineInc"/>
  <text x="739" y="318" class="stInc">«include»</text>

  <!-- «extend» extension → base (箭指向 UC-B) -->
  <path d="M 810 460 L 680 360" class="lineExt"/>
  <text x="720" y="400" class="stExt">«extend»</text>

  <path d="M 810 890 L 688 890" class="lineExt"/>
  <text x="740" y="878" class="stExt">«extend»</text>

  <!-- actor associations（教师—UC-A；学生不接 UC-A） -->
  <path d="M 156 256 L 332 220" class="line"/>
  <path d="M 156 156 L 332 330" class="line"/>
  <path d="M 156 156 L 332 550" class="line"/>
  <path d="M 176 358 L 352 440" class="line"/>
  <path d="M 176 358 L 352 660" class="line"/>
  <path d="M 176 358 L 352 770" class="line"/>
  <path d="M 156 256 L 352 770" class="line"/>
  <path d="M 156 156 L 352 890" class="line"/>

  <!-- external systems -->
  <rect x="1140" y="160" width="120" height="48" rx="6" class="extbox"/>
  <text x="1200" y="188" class="extt">子系统二</text>
  <rect x="1140" y="240" width="120" height="48" rx="6" class="extbox"/>
  <text x="1200" y="268" class="extt">子系统三</text>
  <rect x="1140" y="320" width="120" height="44" rx="6" class="extbox"/>
  <text x="1200" y="348" class="extt">统一身份认证</text>
  <rect x="1140" y="400" width="120" height="48" rx="6" class="extbox"/>
  <text x="1200" y="428" class="extt">地图服务</text>
  <text x="1200" y="444" class="small">可选</text>

  <!-- dependencies to external (from main UC right side 668) -->
  <path d="M 668 330 L 1140 188" class="lineaux"/>
  <path d="M 668 550 L 1140 428" class="lineaux"/>
  <path d="M 668 890 L 1140 268" class="lineaux"/>
  <path d="M 156 156 L 1140 344" class="lineaux"/>
  <path d="M 156 256 L 1140 344" class="lineaux"/>
  <path d="M 176 358 L 1140 344" class="lineaux"/>

  <!-- «关联»：与上方 path 条数一致（8 条） -->
  <text x="228" y="218" class="rel">«关联»</text>
  <text x="228" y="258" class="rel">«关联»</text>
  <text x="228" y="348" class="rel">«关联»</text>
  <text x="248" y="398" class="rel">«关联»</text>
  <text x="248" y="548" class="rel">«关联»</text>
  <text x="248" y="658" class="rel">«关联»</text>
  <text x="238" y="518" class="rel">«关联»</text>
  <text x="238" y="838" class="rel">«关联»</text>

  <!-- «依赖» -->
  <text x="880" y="248" class="rel">«依赖»</text>
  <text x="880" y="262" class="relData">读取可约状态</text>
  <text x="880" y="488" class="rel">«依赖»</text>
  <text x="880" y="502" class="relData">距离与排序</text>
  <text x="880" y="568" class="rel">«依赖»</text>
  <text x="880" y="582" class="relData">只读查询</text>
  <text x="620" y="280" class="rel">«依赖»</text>
  <text x="620" y="294" class="relData">登录上下文</text>
  <text x="620" y="310" class="rel">«依赖»</text>
  <text x="620" y="324" class="relData">登录上下文</text>
  <text x="630" y="350" class="rel">«依赖»</text>
  <text x="630" y="364" class="relData">登录上下文</text>

  <text x="660" y="952" text-anchor="middle" class="relLegend">图例：实线+«关联»；灰虚线+«依赖»；紫虚线+«include»（必须执行子步骤）；橙虚线+«extend»（条件扩展，箭头从扩展用例指向基础用例）。</text>
  <text x="660" y="972" text-anchor="middle" class="note">来源：《需求分析-子系统一-多校预约与时空调度》§13、FR-3～FR-9</text>
</svg>
