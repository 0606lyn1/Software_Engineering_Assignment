  <text x="56" y="1112" class="panelt">FR 追溯：O1→FR-O1 · O2→FR-O2 · O3→FR-O3 · O4→FR-O4 · O5→FR-O5 · O6→FR-O6 · O7→FR-O7 · O8→FR-O8 · O9→FR-O9 · O10→FR-O10</text>
