  <text x="690" y="1076" text-anchor="middle" class="relLegend">图例：实线«关联» · 绿线空心三角«泛化» · 灰虚线«依赖» · 紫虚线«include» · 橙虚线«extend»（扩展→基础） · 浅橙椭圆可选（UC-O6、UC-O10）</text>
