<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1180" width="1380" height="1180">
  <title>Subsystem 2 Full Use Case Diagram</title>
  <style>
    .title { font: bold 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1a1a2e; }
    .sub { font: 13px "Microsoft YaHei", sans-serif; fill: #4a5568; }
    .sysbox { fill: #f7fafc; stroke: #2d3748; stroke-width: 2; stroke-dasharray: 8 4; }
    .actorbox { fill: #edf2f7; stroke: #2b6cb0; stroke-width: 1.8; }
    .actort { font: 13px "Microsoft YaHei", sans-serif; fill: #1a202c; text-anchor: middle; }
    .extbox { fill: #fffaf0; stroke: #c05621; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .extt { font: 12px "Microsoft YaHei", sans-serif; fill: #744210; text-anchor: middle; }
    .uc { fill: #ffffff; stroke: #2f855a; stroke-width: 1.6; }
    .ucsub { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.4; }
    .ucopt { fill: #fffbeb; stroke: #b45309; stroke-width: 1.35; stroke-dasharray: 4 3; }
    .uct { font: 12px "Microsoft YaHei", sans-serif; fill: #1a202c; text-anchor: middle; }
    .ucid { font: 11px "Microsoft YaHei", sans-serif; fill: #4a5568; text-anchor: middle; }
    .line { stroke: #2d3748; stroke-width: 1.4; fill: none; marker-end: url(#mArr); }
    .lineaux { stroke: #718096; stroke-width: 1.2; stroke-dasharray: 6 4; fill: none; marker-end: url(#mArrGray); }
    .lineInc { stroke: #7c3aed; stroke-width: 1.35; stroke-dasharray: 5 4; fill: none; marker-end: url(#mArrInc); }
    .lineExt { stroke: #c2410c; stroke-width: 1.35; stroke-dasharray: 5 4; fill: none; marker-end: url(#mArrExt); }
    .lineGen { stroke: #047857; stroke-width: 1.5; fill: none; }
    .note { font: 11px "Microsoft YaHei", sans-serif; fill: #4a5568; }
    .small { font: 10px "Microsoft YaHei", sans-serif; fill: #4a5568; text-anchor: middle; }
    .rel { font: bold 11px "Microsoft YaHei", sans-serif; fill: #1d4ed8; text-anchor: middle; paint-order: stroke fill; stroke: #fafafa; stroke-width: 3px; }
    .relData { font: 9px "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; paint-order: stroke fill; stroke: #fafafa; stroke-width: 2px; }
    .stInc { font: 10px "Microsoft YaHei", sans-serif; fill: #6d28d9; text-anchor: middle; font-weight: bold; paint-order: stroke fill; stroke: #fafafa; stroke-width: 2px; }
    .stExt { font: 10px "Microsoft YaHei", sans-serif; fill: #c2410c; text-anchor: middle; font-weight: bold; paint-order: stroke fill; stroke: #fafafa; stroke-width: 2px; }
    .stGen { font: 10px "Microsoft YaHei", sans-serif; fill: #047857; text-anchor: middle; font-weight: bold; paint-order: stroke fill; stroke: #fafafa; stroke-width: 2px; }
    .relLegend { font: 11px "Microsoft YaHei", sans-serif; fill: #334155; text-anchor: middle; }
    .panel { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .panelt { font: 11px "Microsoft YaHei", sans-serif; fill: #334155; }
  </style>
  <defs>
    <marker id="mArr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2d3748"/></marker>
    <marker id="mArrGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#718096"/></marker>
    <marker id="mArrInc" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#7c3aed"/></marker>
    <marker id="mArrExt" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#c2410c"/></marker>
