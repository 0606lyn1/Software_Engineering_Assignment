  <rect x="40" y="1760" width="1020" height="240" rx="8" class="noteBox"/>
  <text x="60" y="1795" class="sect">符号与 FR / 边界流追溯（补全说明）</text>
  <text x="60" y="1825" class="noteTxt">加工：1.0→FR-O1,O2 · 2.0→FR-O3 · 3.0→FR-O4,O5,O6 · 4.0→FR-O7 · 5.0→FR-O8 · 6.0→FR-O9（输出）及与物联协同 FR-O10。</text>
  <text x="60" y="1850" class="noteTxt">存储：D1 清洁台账 · D2 责任人 · D3 评论举报 · D4 灯光策略与日志 · D5 用具与缺件。6.0 聚合各库快照生成 open_for_booking、reason_code 等。</text>
  <text x="60" y="1875" class="noteTxt">顶层边界流：F1～F4 人机输入 · F5 子系统一预约联动入 · F6 可约状态出 · F7 运维摘要至子系统三 · F8 网关 · F9 统一身份认证上下文。</text>
  <text x="60" y="1900" class="noteTxt">0 层补全：左侧补充「场地负责人、管理员」至相应加工；右侧区分「子系统一、子系统三、网关、统一身份认证」；F7 由 6.0 指向子系统三（非网关）。无硬件时 F8 可走人工占位。</text>
  <text x="60" y="1935" class="sub">来源：《需求分析-子系统二-场地运维与公众监督》· 与 usecase-子系统二 一致追溯</text>
