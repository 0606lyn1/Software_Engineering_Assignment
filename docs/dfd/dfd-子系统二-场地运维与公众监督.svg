    .panelTop { fill: #f3f8ff; stroke: #c9dbf0; stroke-width: 1; }
    .panelBottom { fill: #f8fcff; stroke: #d4e7f7; stroke-width: 1; }
    .divider { stroke: #97b7d9; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .noteBox { fill: #e0f2fe; stroke: #1e3a5f; stroke-width: 1; }
    .noteTxt { font: 11px "Microsoft YaHei", sans-serif; fill: #0f172a; }
  </style>
