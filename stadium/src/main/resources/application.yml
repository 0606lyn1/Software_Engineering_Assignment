server:
  port: 8080

spring:
  application:
    name: tiyu-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tiyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 86400

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
