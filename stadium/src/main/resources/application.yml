server:
  port: 8080

spring:
  application:
    name: tiyu-backend
  datasource:
    url: jdbc:mysql://localhost:3306/tiyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: tiyu-demo-secret-key-change-in-production-1234567890
  expiration-seconds: 86400
