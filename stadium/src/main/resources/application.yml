server:
  port: 8080

spring:
  application:
    name: tiyu-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tiyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    # 本地开发默认值，生产环境必须用 DB_PASSWORD 环境变量覆盖。
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  # 本地开发默认值，生产环境必须用 JWT_SECRET 环境变量覆盖。HS256 要求密钥不短于 32 字节。
  secret: ${JWT_SECRET:LocalDevSecretKeyForHS256AtLeast32Bytes!}
  expiration-seconds: 86400

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
