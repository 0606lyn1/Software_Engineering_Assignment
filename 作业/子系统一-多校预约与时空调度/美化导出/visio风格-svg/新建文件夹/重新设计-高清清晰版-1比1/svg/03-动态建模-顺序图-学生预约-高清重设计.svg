<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="2048" height="2048" role="img" aria-label="UML顺序图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFF"/><stop offset="1" stop-color="#EDF4FB"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#D7E2F0" stroke-width="1" opacity=".35"/></pattern>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15345E" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2F3A4A"/></marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2F61D5"/></marker>
    <marker id="arrowRet" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#6B7280"/></marker>
    <style><![CDATA[
      text { font-family: "Microsoft YaHei", "SimHei", "Segoe UI", Arial, sans-serif; fill: #17233C; dominant-baseline: middle; }
      .title { font-size: 42px; font-weight: 800; text-anchor: middle; }
      .sub { font-size: 22px; fill: #5D6B82; text-anchor: middle; }
      .box { fill: #fff; stroke-width: 4; filter: url(#shadow); }
      .hdr { fill: #fff; font-size: 24px; font-weight: 800; text-anchor: middle; }
      .txt { font-size: 22px; } .small { font-size: 18px; fill: #5D6B82; }
      .line { fill:none; stroke:#2F3A4A; stroke-width:4; marker-end:url(#arrow); stroke-linecap:round; stroke-linejoin:round; }
      .msg { fill:none; stroke:#2F61D5; stroke-width:4; marker-end:url(#arrowBlue); stroke-linecap:round; }
      .ret { fill:none; stroke:#6B7280; stroke-width:3; stroke-dasharray:12 8; marker-end:url(#arrowRet); stroke-linecap:round; }
      .life { stroke-width:3; stroke-dasharray:12 10; opacity:.85; }
    ]]></style>
  </defs>
  <rect width="1600" height="1600" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="1600" fill="url(#grid)" opacity=".22"/>
  <rect x="80" y="90" width="1440" height="1390" rx="28" fill="#FFFFFF" stroke="#D8E3F2" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="150" class="title">UML顺序图</text>
<text x="800" y="205" class="sub">学生预约场地完整交互流程</text>
<rect class="box" x="135.0" y="260" width="150" height="70" rx="12" stroke="#2F61D5"/>
<rect x="135.0" y="260" width="150" height="48" rx="12" fill="#2F61D5"/><rect x="135.0" y="288" width="150" height="22" fill="#2F61D5"/>
<text x="210.0" y="285" class="hdr">学生</text>
<line x1="210" y1="330" x2="210" y2="1360" stroke="#2F61D5" class="life"/>
<rect x="201" y="370" width="18" height="1120" rx="8" fill="#2F61D5" opacity=".18"/>
<rect class="box" x="370.0" y="260" width="220" height="70" rx="12" stroke="#0B9F6B"/>
<rect x="370.0" y="260" width="220" height="48" rx="12" fill="#0B9F6B"/><rect x="370.0" y="288" width="220" height="22" fill="#0B9F6B"/>
<text x="480.0" y="285" class="hdr">Reservation.vue</text>
<line x1="480" y1="330" x2="480" y2="1360" stroke="#0B9F6B" class="life"/>
<rect x="471" y="370" width="18" height="1120" rx="8" fill="#0B9F6B" opacity=".18"/>
<rect class="box" x="630.0" y="260" width="260" height="70" rx="12" stroke="#E88B00"/>
<rect x="630.0" y="260" width="260" height="48" rx="12" fill="#E88B00"/><rect x="630.0" y="288" width="260" height="22" fill="#E88B00"/>
<text x="760.0" y="285" class="hdr">ReservationController</text>
<line x1="760" y1="330" x2="760" y2="1360" stroke="#E88B00" class="life"/>
<rect x="751" y="370" width="18" height="1120" rx="8" fill="#E88B00" opacity=".18"/>
<rect class="box" x="915.0" y="260" width="290" height="70" rx="12" stroke="#7357D8"/>
<rect x="915.0" y="260" width="290" height="48" rx="12" fill="#7357D8"/><rect x="915.0" y="288" width="290" height="22" fill="#7357D8"/>
<text x="1060.0" y="285" class="hdr">ReservationServiceImpl</text>
<line x1="1060" y1="330" x2="1060" y2="1360" stroke="#7357D8" class="life"/>
<rect x="1051" y="370" width="18" height="1120" rx="8" fill="#7357D8" opacity=".18"/>
<rect class="box" x="1225.0" y="260" width="190" height="70" rx="12" stroke="#D83B83"/>
<rect x="1225.0" y="260" width="190" height="48" rx="12" fill="#D83B83"/><rect x="1225.0" y="288" width="190" height="22" fill="#D83B83"/>
<text x="1320.0" y="285" class="hdr">MySQL</text>
<text x="1320" y="312" text-anchor="middle" font-size="16" fill="#EEF6FF">Mapper</text>
<line x1="1320" y1="330" x2="1320" y2="1360" stroke="#D83B83" class="life"/>
<rect x="1311" y="370" width="18" height="1120" rx="8" fill="#D83B83" opacity=".18"/>
<path class="msg" d="M210 430 L480 430" stroke="#2F61D5"/><text x="345.0" y="402" text-anchor="middle" font-size="20" fill="#2F61D5">1 选择场馆和日期</text>
<path class="msg" d="M480 540 L760 540" stroke="#0B9F6B"/><text x="620.0" y="512" text-anchor="middle" font-size="20" fill="#0B9F6B">2 GET /api/reservations/schedule</text>
<path class="ret" d="M760 650 L480 650" stroke="#637083"/><text x="620.0" y="622" text-anchor="middle" font-size="20" fill="#637083">3 返回可用性网格</text>
<path class="msg" d="M210 760 L480 760" stroke="#2F61D5"/><text x="345.0" y="732" text-anchor="middle" font-size="20" fill="#2F61D5">4 选择时段并确认</text>
<path class="msg" d="M480 870 L760 870" stroke="#0B9F6B"/><text x="620.0" y="842" text-anchor="middle" font-size="20" fill="#0B9F6B">5 POST /api/reservations</text>
<path class="msg" d="M760 980 L1060 980" stroke="#E88B00"/><text x="910.0" y="952" text-anchor="middle" font-size="20" fill="#E88B00">6 createReservation(req,userId)</text>
<path class="msg" d="M1060 1110 L1320 1110" stroke="#7357D8"/><text x="1190.0" y="1082" text-anchor="middle" font-size="20" fill="#7357D8">7 SELECT 冲突预约</text>
<path class="ret" d="M1320 1220 L1060 1220" stroke="#637083"/><text x="1190.0" y="1192" text-anchor="middle" font-size="20" fill="#637083">8 无冲突</text>
<path class="msg" d="M1060 1310 L1320 1310" stroke="#7357D8"/><text x="1190.0" y="1282" text-anchor="middle" font-size="20" fill="#7357D8">9 INSERT 新预约</text>
<path class="ret" d="M1320 1400 L480 1400" stroke="#637083"/><text x="900.0" y="1372" text-anchor="middle" font-size="20" fill="#637083">10 success + JSON</text>
<rect x="890" y="1005" width="370" height="120" rx="16" fill="#F4F0FF" stroke="#7357D8" stroke-width="3"/><text x="1075" y="1045" text-anchor="middle" font-size="20" font-weight="800" fill="#7357D8">Service 校验</text><text x="1075" y="1090" text-anchor="middle" class="small">时间合法、可用性、同场馆冲突</text>

</svg>
