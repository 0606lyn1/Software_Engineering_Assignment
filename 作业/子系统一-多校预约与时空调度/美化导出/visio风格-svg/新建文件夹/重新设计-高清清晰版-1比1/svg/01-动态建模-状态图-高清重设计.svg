<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="2048" height="2048" role="img" aria-label="UML状态图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFF"/><stop offset="1" stop-color="#EDF4FB"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#D7E2F0" stroke-width="1" opacity=".35"/></pattern>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15345E" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2F3A4A"/></marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2F61D5"/></marker>
    <marker id="arrowRet" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#6B7280"/></marker>
    <style><![CDATA[
      text { font-family: "Microsoft YaHei", "SimHei", "Segoe UI", Arial, sans-serif; fill: #17233C; dominant-baseline: middle; }
      .title { font-size: 42px; font-weight: 800; text-anchor: middle; }
      .sub { font-size: 22px; fill: #5D6B82; text-anchor: middle; }
      .box { fill: #fff; stroke-width: 4; filter: url(#shadow); }
      .hdr { fill: #fff; font-size: 24px; font-weight: 800; text-anchor: middle; }
      .txt { font-size: 22px; } .small { font-size: 18px; fill: #5D6B82; }
      .line { fill:none; stroke:#2F3A4A; stroke-width:4; marker-end:url(#arrow); stroke-linecap:round; stroke-linejoin:round; }
      .msg { fill:none; stroke:#2F61D5; stroke-width:4; marker-end:url(#arrowBlue); stroke-linecap:round; }
      .ret { fill:none; stroke:#6B7280; stroke-width:3; stroke-dasharray:12 8; marker-end:url(#arrowRet); stroke-linecap:round; }
      .life { stroke-width:3; stroke-dasharray:12 10; opacity:.85; }
    ]]></style>
  </defs>
  <rect width="1600" height="1600" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="1600" fill="url(#grid)" opacity=".22"/>
  <rect x="80" y="90" width="1440" height="1390" rx="28" fill="#FFFFFF" stroke="#D8E3F2" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="150" class="title">UML状态图</text>

  <text x="800" y="205" class="sub">Reservation 对象生命周期</text>
  <circle cx="190" cy="450" r="24" fill="#17233C"/>
  <circle cx="190" cy="450" r="11" fill="#fff"/>
<rect class="box" x="300" y="360" width="260" height="150" rx="24" fill="#fff" stroke="#E88B00"/>
<text x="430.0" y="421.0" text-anchor="middle" font-size="28" font-weight="800" fill="#E88B00">PENDING</text>
<text x="430.0" y="463.0" text-anchor="middle" class="small">待确认</text>
<rect class="box" x="670" y="360" width="270" height="150" rx="24" fill="#fff" stroke="#0B9F6B"/>
<text x="805.0" y="421.0" text-anchor="middle" font-size="28" font-weight="800" fill="#0B9F6B">CONFIRMED</text>
<text x="805.0" y="463.0" text-anchor="middle" class="small">已确认</text>
<rect class="box" x="1060" y="360" width="260" height="150" rx="24" fill="#fff" stroke="#2F61D5"/>
<text x="1190.0" y="421.0" text-anchor="middle" font-size="28" font-weight="800" fill="#2F61D5">COMPLETED</text>
<text x="1190.0" y="463.0" text-anchor="middle" class="small">已完成</text>
<rect class="box" x="670" y="720" width="270" height="150" rx="24" fill="#fff" stroke="#D64545"/>
<text x="805.0" y="781.0" text-anchor="middle" font-size="28" font-weight="800" fill="#D64545">CANCELLED</text>
<text x="805.0" y="823.0" text-anchor="middle" class="small">已取消</text>

  <path class="line" d="M215 450 L300 435"/><text x="255" y="410" class="small">提交预约</text>
  <path class="line" d="M560 435 L670 435"/><text x="615" y="392" class="small" text-anchor="middle">系统确认 / 审核通过</text>
  <path class="line" d="M940 435 L1060 435"/><text x="1000" y="392" class="small" text-anchor="middle">到达结束时间</text>
  <path class="line" d="M430 510 L705 720"/><text x="520" y="635" class="small">取消 / 超时</text>
  <path class="line" d="M805 510 L805 720"/><text x="870" y="620" class="small">场馆锁定触发</text>
  <path d="M925 375 C1000 250 610 250 685 375" class="line" stroke-dasharray="14 10"/><text x="805" y="285" class="small" text-anchor="middle">延长预约</text>
  <circle cx="1190" cy="650" r="28" fill="none" stroke="#17233C" stroke-width="5"/><circle cx="1190" cy="650" r="15" fill="#17233C"/><path class="line" d="M1190 510 L1190 620"/>
  <circle cx="805" cy="1040" r="28" fill="none" stroke="#17233C" stroke-width="5"/><circle cx="805" cy="1040" r="15" fill="#17233C"/><path class="line" d="M805 870 L805 1010"/>
  <rect x="220" y="1180" width="1160" height="150" rx="18" fill="#F8FAFC" stroke="#D8E3F2" stroke-width="3"/>
  <text x="255" y="1220" class="txt" font-weight="800">规则</text>
  <text x="255" y="1270" class="small">PENDING 可由用户提前取消；CONFIRMED 可因管理员锁定而取消；COMPLETED 与 CANCELLED 均为终态。</text>

</svg>
