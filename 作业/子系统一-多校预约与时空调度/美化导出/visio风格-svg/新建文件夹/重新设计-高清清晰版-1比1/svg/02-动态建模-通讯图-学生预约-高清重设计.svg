<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="2048" height="2048" role="img" aria-label="UML通讯图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFF"/><stop offset="1" stop-color="#EDF4FB"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#D7E2F0" stroke-width="1" opacity=".35"/></pattern>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15345E" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2F3A4A"/></marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2F61D5"/></marker>
    <marker id="arrowRet" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#6B7280"/></marker>
    <style><![CDATA[
      text { font-family: "Microsoft YaHei", "SimHei", "Segoe UI", Arial, sans-serif; fill: #17233C; dominant-baseline: middle; }
      .title { font-size: 42px; font-weight: 800; text-anchor: middle; }
      .sub { font-size: 22px; fill: #5D6B82; text-anchor: middle; }
      .box { fill: #fff; stroke-width: 4; filter: url(#shadow); }
      .hdr { fill: #fff; font-size: 24px; font-weight: 800; text-anchor: middle; }
      .txt { font-size: 22px; } .small { font-size: 18px; fill: #5D6B82; }
      .line { fill:none; stroke:#2F3A4A; stroke-width:4; marker-end:url(#arrow); stroke-linecap:round; stroke-linejoin:round; }
      .msg { fill:none; stroke:#2F61D5; stroke-width:4; marker-end:url(#arrowBlue); stroke-linecap:round; }
      .ret { fill:none; stroke:#6B7280; stroke-width:3; stroke-dasharray:12 8; marker-end:url(#arrowRet); stroke-linecap:round; }
      .life { stroke-width:3; stroke-dasharray:12 10; opacity:.85; }
    ]]></style>
  </defs>
  <rect width="1600" height="1600" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="1600" fill="url(#grid)" opacity=".22"/>
  <rect x="80" y="90" width="1440" height="1390" rx="28" fill="#FFFFFF" stroke="#D8E3F2" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="150" class="title">UML通讯图</text>
<text x="800" y="205" class="sub">学生预约场地：对象协作与编号消息</text>
<rect class="box" x="720" y="260" width="180" height="95" rx="24" fill="#fff" stroke="#2F61D5"/>
<text x="810.0" y="293.5" text-anchor="middle" font-size="28" font-weight="800" fill="#2F61D5">学生</text>
<text x="810.0" y="335.5" text-anchor="middle" class="small">:Student</text>
<rect class="box" x="700" y="450" width="220" height="95" rx="24" fill="#fff" stroke="#0B9F6B"/>
<text x="810.0" y="483.5" text-anchor="middle" font-size="28" font-weight="800" fill="#0B9F6B">Reservation.vue</text>
<text x="810.0" y="525.5" text-anchor="middle" class="small">:VueComponent</text>
<rect class="box" x="660" y="650" width="300" height="95" rx="24" fill="#fff" stroke="#E88B00"/>
<text x="810.0" y="683.5" text-anchor="middle" font-size="28" font-weight="800" fill="#E88B00">ReservationController</text>
<text x="810.0" y="725.5" text-anchor="middle" class="small">:Controller</text>
<rect class="box" x="260" y="880" width="330" height="95" rx="24" fill="#fff" stroke="#7357D8"/>
<text x="425.0" y="913.5" text-anchor="middle" font-size="28" font-weight="800" fill="#7357D8">ReservationServiceImpl</text>
<text x="425.0" y="955.5" text-anchor="middle" class="small">:Service</text>
<rect class="box" x="700" y="880" width="260" height="95" rx="24" fill="#fff" stroke="#0796B5"/>
<text x="830.0" y="913.5" text-anchor="middle" font-size="28" font-weight="800" fill="#0796B5">ReservationMapper</text>
<text x="830.0" y="955.5" text-anchor="middle" class="small">:Mapper</text>
<rect class="box" x="1090" y="880" width="190" height="95" rx="24" fill="#fff" stroke="#D83B83"/>
<text x="1185.0" y="913.5" text-anchor="middle" font-size="28" font-weight="800" fill="#D83B83">MySQL</text>
<text x="1185.0" y="955.5" text-anchor="middle" class="small">:Database</text>
<rect class="box" x="250" y="1130" width="260" height="95" rx="24" fill="#fff" stroke="#7DAA16"/>
<text x="380.0" y="1163.5" text-anchor="middle" font-size="28" font-weight="800" fill="#7DAA16">VenueOpsService</text>
<text x="380.0" y="1205.5" text-anchor="middle" class="small">:Service</text>
<rect class="box" x="1050" y="1160" width="280" height="95" rx="24" fill="#fff" stroke="#D64545"/>
<text x="1190.0" y="1193.5" text-anchor="middle" font-size="28" font-weight="800" fill="#D64545">NotificationService</text>
<text x="1190.0" y="1235.5" text-anchor="middle" class="small">:Service</text>

  <path class="line" d="M810 355 L810 450"/><path class="line" d="M810 545 L810 650"/><path class="line" d="M700 745 L470 880"/><path class="line" d="M590 927 L700 927"/><path class="line" d="M960 927 L1090 927"/><path class="line" d="M410 975 L380 1130"/><path class="line" d="M910 975 L1080 1160"/>
  <g font-size="20" font-weight="800" text-anchor="middle">
    <text x="880" y="405" fill="#2F61D5">1 选择场馆+日期</text><text x="905" y="600" fill="#0B9F6B">2 GET schedule</text>
    <text x="610" y="815" fill="#E88B00">3 POST create</text><text x="620" y="940" fill="#7357D8">4 createReservation()</text>
    <text x="1040" y="900" fill="#0796B5">5 SELECT 冲突</text><text x="1040" y="960" fill="#637083">6 无冲突</text>
    <text x="1040" y="1030" fill="#0796B5">7 INSERT 预约</text><text x="500" y="1110" fill="#7DAA16">8 评估可用性</text>
    <text x="1020" y="1185" fill="#D64545">9 推送通知</text>
  </g>

</svg>
