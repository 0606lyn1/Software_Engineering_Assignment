<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="2048" height="2048" role="img" aria-label="UML构件图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFF"/><stop offset="1" stop-color="#EDF4FB"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#D7E2F0" stroke-width="1" opacity=".35"/></pattern>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15345E" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2F3A4A"/></marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2F61D5"/></marker>
    <marker id="arrowRet" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#6B7280"/></marker>
    <style><![CDATA[
      text { font-family: "Microsoft YaHei", "SimHei", "Segoe UI", Arial, sans-serif; fill: #17233C; dominant-baseline: middle; }
      .title { font-size: 42px; font-weight: 800; text-anchor: middle; }
      .sub { font-size: 22px; fill: #5D6B82; text-anchor: middle; }
      .box { fill: #fff; stroke-width: 4; filter: url(#shadow); }
      .hdr { fill: #fff; font-size: 24px; font-weight: 800; text-anchor: middle; }
      .txt { font-size: 22px; } .small { font-size: 18px; fill: #5D6B82; }
      .line { fill:none; stroke:#2F3A4A; stroke-width:4; marker-end:url(#arrow); stroke-linecap:round; stroke-linejoin:round; }
      .msg { fill:none; stroke:#2F61D5; stroke-width:4; marker-end:url(#arrowBlue); stroke-linecap:round; }
      .ret { fill:none; stroke:#6B7280; stroke-width:3; stroke-dasharray:12 8; marker-end:url(#arrowRet); stroke-linecap:round; }
      .life { stroke-width:3; stroke-dasharray:12 10; opacity:.85; }
    ]]></style>
  </defs>
  <rect width="1600" height="1600" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="1600" fill="url(#grid)" opacity=".22"/>
  <rect x="80" y="90" width="1440" height="1390" rx="28" fill="#FFFFFF" stroke="#D8E3F2" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="150" class="title">UML构件图</text>
<text x="800" y="205" class="sub">系统构件组成与接口依赖</text>
<rect class="box" x="180" y="360" width="330" height="230" rx="18" stroke="#2F61D5"/>
<rect x="180" y="360" width="330" height="48" rx="18" fill="#2F61D5"/><rect x="180" y="388" width="330" height="22" fill="#2F61D5"/>
<text x="345.0" y="385" class="hdr">«component» WebApp</text>
<text x="208" y="448" class="small">Vue 3 + Vite</text>
<text x="208" y="484" class="small">Pinia / Router</text>
<text x="208" y="520" class="small">Axios HTTP Client</text>
<rect class="box" x="650" y="320" width="360" height="280" rx="18" stroke="#0B9F6B"/>
<rect x="650" y="320" width="360" height="48" rx="18" fill="#0B9F6B"/><rect x="650" y="348" width="360" height="22" fill="#0B9F6B"/>
<text x="830.0" y="345" class="hdr">«component» API Server</text>
<text x="678" y="408" class="small">Spring Boot 3.4</text>
<text x="678" y="444" class="small">Controller / Service</text>
<text x="678" y="480" class="small">RESTful API</text>
<rect class="box" x="180" y="820" width="330" height="220" rx="18" stroke="#E88B00"/>
<rect x="180" y="820" width="330" height="48" rx="18" fill="#E88B00"/><rect x="180" y="848" width="330" height="22" fill="#E88B00"/>
<text x="345.0" y="845" class="hdr">«component» Database</text>
<text x="208" y="908" class="small">MySQL 8.4</text>
<text x="208" y="944" class="small">MyBatis-Plus</text>
<text x="208" y="980" class="small">事务与乐观锁</text>
<rect class="box" x="660" y="840" width="330" height="200" rx="18" stroke="#7357D8"/>
<rect x="660" y="840" width="330" height="48" rx="18" fill="#7357D8"/><rect x="660" y="868" width="330" height="22" fill="#7357D8"/>
<text x="825.0" y="865" class="hdr">«component» Auth</text>
<text x="688" y="928" class="small">Spring Security</text>
<text x="688" y="964" class="small">JWT Filter</text>
<text x="688" y="1000" class="small">权限校验</text>
<rect class="box" x="1080" y="840" width="330" height="220" rx="18" stroke="#D83B83"/>
<rect x="1080" y="840" width="330" height="48" rx="18" fill="#D83B83"/><rect x="1080" y="868" width="330" height="22" fill="#D83B83"/>
<text x="1245.0" y="865" class="hdr">«component» DeepSeek API</text>
<text x="1108" y="928" class="small">推荐算法引擎</text>
<text x="1108" y="964" class="small">用户行为分析</text>
<text x="1108" y="1000" class="small">个性化推荐</text>
<rect class="box" x="1080" y="360" width="330" height="220" rx="18" stroke="#0796B5"/>
<rect x="1080" y="360" width="330" height="48" rx="18" fill="#0796B5"/><rect x="1080" y="388" width="330" height="22" fill="#0796B5"/>
<text x="1245.0" y="385" class="hdr">«component» Scheduler</text>
<text x="1108" y="448" class="small">定时任务</text>
<text x="1108" y="484" class="small">状态流转</text>
<text x="1108" y="520" class="small">超时处理</text>

  <path class="line" d="M510 475 L650 460"/><text x="580" y="430" class="small" text-anchor="middle">HTTP/REST</text>
  <path class="line" d="M760 600 L400 820"/><text x="540" y="720" class="small">JDBC/SQL</text>
  <path class="ret" d="M825 840 L830 600"/><text x="890" y="725" class="small">认证拦截</text>
  <path class="ret" d="M1010 470 L1080 470"/><text x="1045" y="430" class="small" text-anchor="middle">定时调用</text>
  <path class="ret" d="M1010 520 L1080 890"/><text x="1105" y="700" class="small">推荐数据交换</text>
  <circle cx="575" cy="475" r="17" fill="#2F61D5" stroke="#fff" stroke-width="5"/><circle cx="590" cy="770" r="17" fill="#E88B00" stroke="#fff" stroke-width="5"/><path d="M635 840 l-26 22 l26 22 z" fill="#7357D8"/>
  <rect x="250" y="1220" width="1100" height="90" rx="16" fill="#F8FAFC" stroke="#D8E3F2" stroke-width="3"/>
  <text x="800" y="1265" class="small" text-anchor="middle">圆形接口表示提供接口；三角插口表示所需接口；实线为直接调用，虚线为外部或横切依赖。</text>

</svg>
