    <text x="42" y="420" class="slot">id = 5001</text>
    <text x="42" y="440" class="slot">user_id = 1001  (→ zhangSan)</text>
    <text x="42" y="460" class="slot">venue_id = 2001  (→ basketballCourt)</text>
    <text x="42" y="480" class="slot">start_time = "2026-05-10 15:00:00"</text>
