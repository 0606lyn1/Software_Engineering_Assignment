<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1156 886" width="1156" height="886">
  <defs id="codex-visio-style">
    <filter id="codexVisioShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#1f3b73" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="codexPageGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <pattern id="codexGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d9e3f0" stroke-width="0.8" opacity="0.38"/>
    </pattern>
    <style><![CDATA[
      svg {
        background: #edf2f8;
      }
      text {
        font-family: "Microsoft YaHei", "Microsoft JhengHei", "SimHei", "Segoe UI", Arial, sans-serif !important;
        paint-order: stroke fill;
        stroke: rgba(255,255,255,0.72);
        stroke-width: 1.2px;
        letter-spacing: 0.05px;
      }
      .codex-text-overlay text {
        filter: none !important;
        paint-order: stroke fill !important;
        stroke: #ffffff !important;
        stroke-width: 3.2px !important;
        stroke-linejoin: round !important;
      }
      .codex-text-overlay .swimlane,
      .codex-text-overlay .action,
      .codex-text-overlay .lifeline,
      .codex-text-overlay text[fill="#fff"],
      .codex-text-overlay text[fill="#ffffff"],
      .codex-text-overlay text[fill="white"] {
        stroke: rgba(18, 32, 54, 0.55) !important;
        stroke-width: 0.85px !important;
      }
      .title {
        fill: #17345d !important;
        font-weight: 700 !important;
      }
      rect:not(.codex-page-bg):not(.codex-grid-bg),
      ellipse,
      circle,
      polygon {
        filter: url(#codexVisioShadow);
        stroke-linejoin: round;
      }
      path,
      line,
      polyline {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      marker path {
        filter: none;
      }
    ]]></style>
  </defs>
  <rect class="codex-page-bg" x="0" y="0" width="1156" height="886" rx="14" fill="url(#codexPageGradient)"/>
  <rect class="codex-grid-bg" x="0" y="0" width="1156" height="886" fill="url(#codexGrid)" opacity="0.12"/>

  <g transform="translate(80 80)">

  <defs>
    <style>
      text { font-family: 'Microsoft YaHei', 'SimHei', sans-serif; }
      .title { font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .obj-name { font-size: 14px; font-weight: bold; fill: #fff; }
      .obj-type { font-size: 10px; fill: #c0d0ff; }
      .slot { font-size: 11px; fill: #333; }
      .link { font-size: 10px; fill: #666; }
    </style>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="650" fill="#fafbff" rx="8"/>

  <text x="450" y="38" text-anchor="middle" class="title">UML对象图 — "张三预约2026-05-10下午3-4点篮球场"</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#666">场景：用户张三在2026年5月10日预约了篮球场下午3:00-4:00时段</text>

  <!-- Object: zhangSan : User -->
  <rect x="30" y="85" width="250" height="200" rx="8" fill="#fff" stroke="#4a6cf7" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="30" y="85" width="250" height="32" rx="8" fill="#4a6cf7"/>
  <rect x="30" y="103" width="250" height="14" fill="#4a6cf7"/>
  <text x="155" y="107" text-anchor="middle" class="obj-name">zhangSan : User</text>
  <line x1="30" y1="135" x2="280" y2="135" stroke="#ddd"/>
  <text x="42" y="155" class="slot">id = 1001</text>
  <text x="42" y="175" class="slot">username = "zhangsan"</text>
  <text x="42" y="195" class="slot">email = "zhangsan@scu.edu.cn"</text>
  <text x="42" y="215" class="slot">role = "STUDENT"</text>
  <text x="42" y="235" class="slot">tenant_id = "scu"</text>
  <text x="42" y="255" class="slot">password = "$2a$10$...BCryptHash"</text>

  <!-- Object: basketballCourt : Venue -->
  <rect x="350" y="85" width="250" height="200" rx="8" fill="#fff" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="350" y="85" width="250" height="32" rx="8" fill="#10b981"/>
  <rect x="350" y="103" width="250" height="14" fill="#10b981"/>
  <text x="475" y="107" text-anchor="middle" class="obj-name">basketballCourt : Venue</text>
  <line x1="350" y1="135" x2="600" y2="135" stroke="#ddd"/>
  <text x="362" y="155" class="slot">id = 2001</text>
  <text x="362" y="175" class="slot">name = "第一篮球场"</text>
  <text x="362" y="195" class="slot">type_id = 1</text>
  <text x="362" y="215" class="slot">price = "20.00"</text>
  <text x="362" y="235" class="slot">description = "标准篮球场地"</text>
  <text x="362" y="255" class="slot">tenant_id = "scu"</text>

  <!-- Object: reservation : Reservation -->
  <rect x="30" y="350" width="310" height="240" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <rect x="30" y="350" width="310" height="32" rx="8" fill="#f59e0b"/>
  <rect x="30" y="368" width="310" height="14" fill="#f59e0b"/>
  <text x="185" y="372" text-anchor="middle" class="obj-name">reservation1 : Reservation</text>
  <line x1="30" y1="400" x2="340" y2="400" stroke="#ddd"/>
  <text x="42" y="420" class="slot">id = 5001</text>
  <text x="42" y="440" class="slot">user_id = 1001  (→ zhangSan)</text>
  <text x="42" y="460" class="slot">venue_id = 2001  (→ basketballCourt)</text>
  <text x="42" y="480" class="slot">start_time = "2026-05-10 15:00:00"</text>
  <text x="42" y="500" class="slot">end_time = "2026-05-10 16:00:00"</text>
  <text x="42" y="520" class="slot">status = "BOOKED"</text>
  <text x="42" y="540" class="slot">version = 0</text>
  <text x="42" y="560" class="slot">created_at = "2026-05-08 09:23:45"</text>

  <!-- Object: venueType : VenueType -->
  <rect x="400" y="360" width="210" height="140" rx="8" fill="#fff" stroke="#84cc16" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="400" y="360" width="210" height="32" rx="8" fill="#84cc16"/>
  <rect x="400" y="378" width="210" height="14" fill="#84cc16"/>
  <text x="505" y="382" text-anchor="middle" class="obj-name">basketball : VenueType</text>
  <line x1="400" y1="410" x2="610" y2="410" stroke="#ddd"/>
  <text x="412" y="430" class="slot">id = 1</text>
  <text x="412" y="450" class="slot">name = "篮球场"</text>
  <text x="412" y="470" class="slot">icon = "basketball"</text>

  <!-- Object: request : ReservationCreateRequest -->
  <rect x="660" y="360" width="220" height="130" rx="8" fill="#fafafa" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="660" y="360" width="220" height="28" rx="8" fill="#8b5cf6"/>
  <rect x="660" y="376" width="220" height="12" fill="#8b5cf6"/>
  <text x="770" y="380" text-anchor="middle" class="obj-name">req : ReservationCreateRequest</text>
  <line x1="660" y1="405" x2="880" y2="405" stroke="#ddd"/>
  <text x="672" y="423" class="slot">venueId = 2001</text>
  <text x="672" y="441" class="slot">startTime = "2026-05-10T15:00"</text>
  <text x="672" y="459" class="slot">endTime = "2026-05-10T16:00"</text>

  <!-- Links -->
  <!-- User → Reservation -->
  <line x1="280" y1="185" x2="340" y2="430" stroke="#4a6cf7" stroke-width="1.8"/>
  <text x="295" y="360" class="link" fill="#4a6cf7">userId</text>

  <!-- Venue → Reservation -->
  <line x1="350" y1="185" x2="340" y2="460" stroke="#10b981" stroke-width="1.8"/>
  <text x="320" y="380" class="link" fill="#10b981">venueId</text>

  <!-- VenueType → Venue -->
  <line x1="610" y1="195" x2="610" y2="410" stroke="#84cc16" stroke-width="1.8"/>
  <text x="620" y="300" class="link" fill="#84cc16">type_id</text>

  <!-- Req → Reservation (trace) -->
  <line x1="660" y1="425" x2="340" y2="480" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="455" class="link" fill="#888">&lt;&lt;trace&gt;&gt; DTO→实体</text>

  <!-- Notes -->
  <rect x="30" y="610" width="840" height="30" rx="6" fill="#f0f0f0"/>
  <text x="50" y="630" font-size="11" fill="#888">对象图说明：展示具体场景下的对象实例及属性值。对象名格式为 instanceName : ClassName（带下划线）。link表示对象间的关联引用。</text>

