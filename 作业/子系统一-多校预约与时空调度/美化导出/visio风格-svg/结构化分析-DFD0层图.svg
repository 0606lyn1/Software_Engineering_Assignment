<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1256 936" width="1256" height="936">
  <defs id="codex-visio-style">
    <filter id="codexVisioShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#1f3b73" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="codexPageGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <pattern id="codexGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d9e3f0" stroke-width="0.8" opacity="0.38"/>
    </pattern>
    <style><![CDATA[
      svg {
        background: #edf2f8;
      }
      text {
        font-family: "Microsoft YaHei", "Microsoft JhengHei", "SimHei", "Segoe UI", Arial, sans-serif !important;
        paint-order: stroke fill;
        stroke: rgba(255,255,255,0.72);
        stroke-width: 1.2px;
        letter-spacing: 0.05px;
      }
      .codex-text-overlay text {
        filter: none !important;
        paint-order: stroke fill !important;
        stroke: #ffffff !important;
        stroke-width: 3.2px !important;
        stroke-linejoin: round !important;
      }
      .codex-text-overlay .swimlane,
      .codex-text-overlay .action,
      .codex-text-overlay .lifeline,
      .codex-text-overlay text[fill="#fff"],
      .codex-text-overlay text[fill="#ffffff"],
      .codex-text-overlay text[fill="white"] {
        stroke: rgba(18, 32, 54, 0.55) !important;
        stroke-width: 0.85px !important;
      }
      .title {
        fill: #17345d !important;
        font-weight: 700 !important;
      }
      rect:not(.codex-page-bg):not(.codex-grid-bg),
      ellipse,
      circle,
      polygon {
        filter: url(#codexVisioShadow);
        stroke-linejoin: round;
      }
      path,
      line,
      polyline {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      marker path {
        filter: none;
      }
    ]]></style>
  </defs>
  <rect class="codex-page-bg" x="0" y="0" width="1256" height="936" rx="14" fill="url(#codexPageGradient)"/>
  <rect class="codex-grid-bg" x="0" y="0" width="1256" height="936" fill="url(#codexGrid)" opacity="0.12"/>

  <g transform="translate(80 80)">

  <defs>
    <style>
      text { font-family: 'Microsoft YaHei', 'SimHei', sans-serif; }
      .title { font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .procname { font-size: 15px; font-weight: bold; fill: #fff; }
      .procnum { font-size: 12px; fill: #ccc; }
      .dsname { font-size: 12px; font-weight: bold; fill: #333; }
      .flowname { font-size: 11px; font-weight: bold; fill: #444; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#fafbff" rx="8"/>

  <text x="500" y="38" text-anchor="middle" class="title">DFD 0层图 — 体育场馆预约系统功能级数据流</text>

  <!-- External Entity: 学生 -->
  <rect x="30" y="70" width="140" height="55" rx="8" fill="#ebf0ff" stroke="#4a6cf7" stroke-width="2"/>
  <text x="100" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">学生</text>
  <text x="100" y="118" text-anchor="middle" font-size="11" fill="#666">Student</text>

  <!-- External Entity: 教师 -->
  <rect x="30" y="200" width="140" height="55" rx="8" fill="#fff0f5" stroke="#f5576c" stroke-width="2"/>
  <text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">教师</text>
  <text x="100" y="248" text-anchor="middle" font-size="11" fill="#666">Teacher</text>

  <!-- External Entity: 管理员 -->
  <rect x="30" y="330" width="140" height="55" rx="8" fill="#e6f7ff" stroke="#4facfe" stroke-width="2"/>
  <text x="100" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">管理员</text>
  <text x="100" y="378" text-anchor="middle" font-size="11" fill="#666">Admin</text>

  <!-- ========== Process 1: 预约处理 ========== -->
  <rect x="320" y="60" width="200" height="100" rx="14" fill="url(#p1g)" filter="url(#shadow)"/>
  <defs>
    <linearGradient id="p1g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="p2g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="p3g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>
  <text x="420" y="100" text-anchor="middle" class="procname">P1 预约处理</text>
  <text x="420" y="122" text-anchor="middle" class="procnum">处理预约提交、状态变更、</text>
  <text x="420" y="138" text-anchor="middle" class="procnum">冲突检测、定时释放</text>

  <!-- ========== Process 2: 信息查询 ========== -->
  <rect x="320" y="200" width="200" height="100" rx="14" fill="url(#p2g)" filter="url(#shadow)"/>
  <text x="420" y="240" text-anchor="middle" class="procname">P2 信息查询</text>
  <text x="420" y="262" text-anchor="middle" class="procnum">场馆浏览、时段查询、</text>
  <text x="420" y="278" text-anchor="middle" class="procnum">推荐计算、时间线展示</text>

  <!-- ========== Process 3: 系统管理 ========== -->
  <rect x="320" y="340" width="200" height="100" rx="14" fill="url(#p3g)" filter="url(#shadow)"/>
  <text x="420" y="380" text-anchor="middle" class="procname">P3 系统管理</text>
  <text x="420" y="402" text-anchor="middle" class="procnum">场馆维护、锁定管理、</text>
  <text x="420" y="418" text-anchor="middle" class="procnum">租户配置、权限控制</text>

  <!-- Flows: Student → P1 -->
  <line x1="170" y1="95" x2="320" y2="90" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="80" text-anchor="middle" class="flowname" fill="#6366f1">预约请求</text>
  <line x1="320" y1="130" x2="170" y2="120" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="140" text-anchor="middle" class="flowname" fill="#6366f1">预约结果</text>

  <!-- Flows: Student → P2 -->
  <line x1="170" y1="110" x2="320" y2="220" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="170" text-anchor="middle" class="flowname" fill="#10b981">查询请求</text>
  <line x1="320" y1="250" x2="170" y2="115" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="195" text-anchor="middle" class="flowname" fill="#10b981">场馆/推荐列表</text>

  <!-- Flows: Teacher → P1 -->
  <line x1="170" y1="225" x2="320" y2="150" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="182" text-anchor="middle" class="flowname" fill="#6366f1">占场规则提交</text>

  <!-- Flows: Teacher → P2 -->
  <line x1="170" y1="240" x2="320" y2="270" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="260" text-anchor="middle" class="flowname" fill="#10b981">统计查询</text>

  <!-- Flows: Admin → P3 -->
  <line x1="170" y1="355" x2="320" y2="370" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="358" text-anchor="middle" class="flowname" fill="#f59e0b">管理指令</text>
  <line x1="320" y1="400" x2="170" y2="375" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="398" text-anchor="middle" class="flowname" fill="#f59e0b">管理视图</text>

  <!-- Data Stores -->
  <!-- D1 用户表 -->
  <rect x="620" y="70" width="55" height="75" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="620" y="70" width="55" height="18" rx="2" fill="#666" stroke="#333" stroke-width="1"/>
  <text x="648" y="84" text-anchor="middle" font-size="10" fill="#fff">D1</text>
  <text x="648" y="117" text-anchor="middle" class="dsname">用户表</text>

  <!-- D2 场馆表 -->
  <rect x="710" y="70" width="55" height="75" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="710" y="70" width="55" height="18" rx="2" fill="#666" stroke="#333" stroke-width="1"/>
  <text x="738" y="84" text-anchor="middle" font-size="10" fill="#fff">D2</text>
  <text x="738" y="117" text-anchor="middle" class="dsname">场馆表</text>

  <!-- D3 预约表 -->
  <rect x="620" y="195" width="55" height="75" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="620" y="195" width="55" height="18" rx="2" fill="#666" stroke="#333" stroke-width="1"/>
  <text x="648" y="209" text-anchor="middle" font-size="10" fill="#fff">D3</text>
  <text x="648" y="242" text-anchor="middle" class="dsname">预约表</text>

  <!-- D4 占场规则表 -->
  <rect x="710" y="195" width="55" height="75" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="710" y="195" width="55" height="18" rx="2" fill="#666" stroke="#333" stroke-width="1"/>
  <text x="738" y="209" text-anchor="middle" font-size="10" fill="#fff">D4</text>
  <text x="738" y="242" text-anchor="middle" class="dsname">占场规则表</text>

  <!-- D5 锁定记录表 -->
  <rect x="800" y="70" width="55" height="75" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="800" y="70" width="55" height="18" rx="2" fill="#666" stroke="#333" stroke-width="1"/>
  <text x="828" y="84" text-anchor="middle" font-size="10" fill="#fff">D5</text>
  <text x="828" y="117" text-anchor="middle" class="dsname">锁定记录</text>

  <!-- D6 评论表 -->
  <rect x="800" y="195" width="55" height="75" rx="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="800" y="195" width="55" height="18" rx="2" fill="#666" stroke="#333" stroke-width="1"/>
  <text x="828" y="209" text-anchor="middle" font-size="10" fill="#fff">D6</text>
  <text x="828" y="242" text-anchor="middle" class="dsname">评论表</text>

  <!-- Flows: P1 → D3 -->
  <line x1="520" y1="100" x2="620" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="165" class="flowname" font-size="10">读写</text>

  <!-- Flows: P1 → D4 -->
  <line x1="520" y1="140" x2="710" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="185" class="flowname" font-size="10">读</text>

  <!-- Flows: P2 → D2 D3 -->
  <line x1="520" y1="240" x2="710" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="178" class="flowname" font-size="10">读</text>
  <line x1="520" y1="270" x2="620" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="250" class="flowname" font-size="10">读</text>

  <!-- Flows: P3 → D5 D1 D2 -->
  <line x1="520" y1="375" x2="800" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="655" y="250" class="flowname" font-size="10">读写</text>
  <line x1="520" y1="410" x2="620" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="265" class="flowname" font-size="10">读写</text>

  <!-- Inter-process flows -->
  <line x1="425" y1="160" x2="425" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="435" y="185" class="flowname" font-size="10" fill="#666">可用性数据</text>

  <line x1="415" y1="340" x2="415" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="425" y="325" class="flowname" font-size="10" fill="#666">配置数据</text>

  <!-- Legend -->
  <rect x="320" y="490" width="560" height="50" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="340" y="512" font-size="13" font-weight="bold" fill="#555">图例：</text>
  <line x1="400" y1="508" x2="440" y2="508" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="448" y="514" font-size="12" fill="#555">数据流</text>
  <line x1="520" y1="508" x2="560" y2="508" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="568" y="514" font-size="12" fill="#555">进程间数据流</text>
  <rect x="660" y="500" width="22" height="16" rx="2" fill="none" stroke="#555" stroke-width="1"/>
  <text x="690" y="514" font-size="12" fill="#555">数据存储</text>
  <rect x="770" y="500" width="22" height="16" rx="5" fill="url(#p1g)"/>
  <text x="800" y="514" font-size="12" fill="#555">处理进程</text>

  </g>
  <g class="codex-text-overlay" transform="translate(80 80)">
    <text x="500" y="38" text-anchor="middle" class="title">DFD 0层图 — 体育场馆预约系统功能级数据流</text>
    <text x="100" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">学生</text>
    <text x="100" y="118" text-anchor="middle" font-size="11" fill="#666">Student</text>
    <text x="100" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">教师</text>
    <text x="100" y="248" text-anchor="middle" font-size="11" fill="#666">Teacher</text>
    <text x="100" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">管理员</text>
    <text x="100" y="378" text-anchor="middle" font-size="11" fill="#666">Admin</text>
    <text x="420" y="100" text-anchor="middle" class="procname">P1 预约处理</text>
    <text x="420" y="122" text-anchor="middle" class="procnum">处理预约提交、状态变更、</text>
    <text x="420" y="138" text-anchor="middle" class="procnum">冲突检测、定时释放</text>
    <text x="420" y="240" text-anchor="middle" class="procname">P2 信息查询</text>
    <text x="420" y="262" text-anchor="middle" class="procnum">场馆浏览、时段查询、</text>
    <text x="420" y="278" text-anchor="middle" class="procnum">推荐计算、时间线展示</text>
    <text x="420" y="380" text-anchor="middle" class="procname">P3 系统管理</text>
    <text x="420" y="402" text-anchor="middle" class="procnum">场馆维护、锁定管理、</text>
    <text x="420" y="418" text-anchor="middle" class="procnum">租户配置、权限控制</text>
    <text x="240" y="80" text-anchor="middle" class="flowname" fill="#6366f1">预约请求</text>
    <text x="240" y="140" text-anchor="middle" class="flowname" fill="#6366f1">预约结果</text>
    <text x="240" y="170" text-anchor="middle" class="flowname" fill="#10b981">查询请求</text>
    <text x="240" y="195" text-anchor="middle" class="flowname" fill="#10b981">场馆/推荐列表</text>
    <text x="240" y="182" text-anchor="middle" class="flowname" fill="#6366f1">占场规则提交</text>
    <text x="240" y="260" text-anchor="middle" class="flowname" fill="#10b981">统计查询</text>
    <text x="240" y="358" text-anchor="middle" class="flowname" fill="#f59e0b">管理指令</text>
    <text x="240" y="398" text-anchor="middle" class="flowname" fill="#f59e0b">管理视图</text>
    <text x="648" y="84" text-anchor="middle" font-size="10" fill="#fff">D1</text>
    <text x="648" y="117" text-anchor="middle" class="dsname">用户表</text>
    <text x="738" y="84" text-anchor="middle" font-size="10" fill="#fff">D2</text>
    <text x="738" y="117" text-anchor="middle" class="dsname">场馆表</text>
    <text x="648" y="209" text-anchor="middle" font-size="10" fill="#fff">D3</text>
    <text x="648" y="242" text-anchor="middle" class="dsname">预约表</text>
    <text x="738" y="209" text-anchor="middle" font-size="10" fill="#fff">D4</text>
    <text x="738" y="242" text-anchor="middle" class="dsname">占场规则表</text>
    <text x="828" y="84" text-anchor="middle" font-size="10" fill="#fff">D5</text>
    <text x="828" y="117" text-anchor="middle" class="dsname">锁定记录</text>
    <text x="828" y="209" text-anchor="middle" font-size="10" fill="#fff">D6</text>
    <text x="828" y="242" text-anchor="middle" class="dsname">评论表</text>
    <text x="560" y="165" class="flowname" font-size="10">读写</text>
    <text x="610" y="185" class="flowname" font-size="10">读</text>
    <text x="610" y="178" class="flowname" font-size="10">读</text>
    <text x="560" y="250" class="flowname" font-size="10">读</text>
    <text x="655" y="250" class="flowname" font-size="10">读写</text>
    <text x="560" y="265" class="flowname" font-size="10">读写</text>
    <text x="435" y="185" class="flowname" font-size="10" fill="#666">可用性数据</text>
    <text x="425" y="325" class="flowname" font-size="10" fill="#666">配置数据</text>
    <text x="340" y="512" font-size="13" font-weight="bold" fill="#555">图例：</text>
    <text x="448" y="514" font-size="12" fill="#555">数据流</text>
    <text x="568" y="514" font-size="12" fill="#555">进程间数据流</text>
    <text x="690" y="514" font-size="12" fill="#555">数据存储</text>
