<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1256 1000" width="1256" height="1000">
  <defs id="codex-visio-style">
    <filter id="codexVisioShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#1f3b73" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="codexPageGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <pattern id="codexGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d9e3f0" stroke-width="0.8" opacity="0.38"/>
    </pattern>
    <style><![CDATA[
      svg {
        background: #edf2f8;
      }
      text {
        font-family: "Microsoft YaHei", "Microsoft JhengHei", "SimHei", "Segoe UI", Arial, sans-serif !important;
        paint-order: stroke fill;
        stroke: rgba(255,255,255,0.72);
        stroke-width: 1.2px;
        letter-spacing: 0.05px;
      }
      .codex-text-overlay text {
        filter: none !important;
        paint-order: stroke fill !important;
        stroke: #ffffff !important;
        stroke-width: 3.2px !important;
        stroke-linejoin: round !important;
      }
      .codex-text-overlay .swimlane,
      .codex-text-overlay .action,
      .codex-text-overlay .lifeline,
      .codex-text-overlay text[fill="#fff"],
      .codex-text-overlay text[fill="#ffffff"],
      .codex-text-overlay text[fill="white"] {
        stroke: rgba(18, 32, 54, 0.55) !important;
        stroke-width: 0.85px !important;
      }
      .title {
        fill: #17345d !important;
        font-weight: 700 !important;
      }
      rect:not(.codex-page-bg):not(.codex-grid-bg),
      ellipse,
      circle,
      polygon {
        filter: url(#codexVisioShadow);
        stroke-linejoin: round;
      }
      path,
      line,
      polyline {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      marker path {
        filter: none;
      }
    ]]></style>
  </defs>
  <rect class="codex-page-bg" x="0" y="0" width="1256" height="1000" rx="14" fill="url(#codexPageGradient)"/>
  <rect class="codex-grid-bg" x="0" y="0" width="1256" height="1000" fill="url(#codexGrid)" opacity="0.12"/>

  <g transform="translate(80 80)">

  <defs>
    <style>
      text { font-family: 'Microsoft YaHei', 'SimHei', sans-serif; }
      .title { font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .actor { font-size: 14px; font-weight: bold; fill: #333; }
      .usecase { font-size: 13px; fill: #333; }
      .rel { font-size: 11px; fill: #666; }
      .ext-rel { font-size: 11px; fill: #6b7280; }
    </style>
    <marker id="arrowExt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowInc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowAssoc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#fafbff" rx="8"/>

  <text x="500" y="38" text-anchor="middle" class="title">用例图 — 多校体育场地预约与时空调度子系统</text>

  <!-- Actors -->
  <!-- Student -->
  <circle cx="50" cy="150" r="18" fill="none" stroke="#4a6cf7" stroke-width="2"/>
  <circle cx="50" cy="142" r="9" fill="#4a6cf7"/>
  <line x1="50" y1="168" x2="50" y2="210" stroke="#4a6cf7" stroke-width="2"/>
  <line x1="30" y1="190" x2="70" y2="190" stroke="#4a6cf7" stroke-width="2"/>
  <line x1="50" y1="210" x2="30" y2="235" stroke="#4a6cf7" stroke-width="2"/>
  <line x1="50" y1="210" x2="70" y2="235" stroke="#4a6cf7" stroke-width="2"/>
  <text x="50" y="255" text-anchor="middle" class="actor" fill="#4a6cf7">学生</text>
  <text x="50" y="272" text-anchor="middle" font-size="10" fill="#888">Student</text>

  <!-- Teacher -->
  <circle cx="50" cy="380" r="18" fill="none" stroke="#f5576c" stroke-width="2"/>
  <circle cx="50" cy="372" r="9" fill="#f5576c"/>
  <line x1="50" y1="398" x2="50" y2="440" stroke="#f5576c" stroke-width="2"/>
  <line x1="30" y1="420" x2="70" y2="420" stroke="#f5576c" stroke-width="2"/>
  <line x1="50" y1="440" x2="30" y2="465" stroke="#f5576c" stroke-width="2"/>
  <line x1="50" y1="440" x2="70" y2="465" stroke="#f5576c" stroke-width="2"/>
  <text x="50" y="485" text-anchor="middle" class="actor" fill="#f5576c">教师</text>
  <text x="50" y="502" text-anchor="middle" font-size="10" fill="#888">Teacher</text>

  <!-- Admin -->
  <circle cx="50" cy="600" r="18" fill="none" stroke="#4facfe" stroke-width="2"/>
  <circle cx="50" cy="592" r="9" fill="#4facfe"/>
  <line x1="50" y1="618" x2="50" y2="660" stroke="#4facfe" stroke-width="2"/>
  <line x1="30" y1="640" x2="70" y2="640" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="660" x2="30" y2="685" stroke="#4facfe" stroke-width="2"/>
  <line x1="50" y1="660" x2="70" y2="685" stroke="#4facfe" stroke-width="2"/>
  <text x="50" y="705" text-anchor="middle" class="actor" fill="#4facfe">管理员</text>
  <text x="52" y="722" text-anchor="middle" font-size="10" fill="#888">Admin</text>

  <!-- Time (external actor) -->
  <rect x="20" y="70" width="60" height="36" rx="8" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="50" y="93" text-anchor="middle" font-size="12" fill="#666">时间</text>

  <!-- System Boundary -->
  <rect x="160" y="55" width="810" height="650" rx="12" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="170" y="80" font-size="15" font-weight="bold" fill="#333">多校体育场馆预约与时空调度子系统</text>

  <!-- Use Cases - Left Column -->
  <ellipse cx="320" cy="150" rx="90" ry="28" fill="#fff" stroke="#4a6cf7" stroke-width="1.8"/>
  <text x="320" y="155" text-anchor="middle" class="usecase">浏览场馆列表</text>

  <ellipse cx="320" cy="230" rx="90" ry="28" fill="#fff" stroke="#4a6cf7" stroke-width="1.8"/>
  <text x="320" y="235" text-anchor="middle" class="usecase">查询时段可用性</text>

  <ellipse cx="320" cy="310" rx="90" ry="28" fill="#fff" stroke="#4a6cf7" stroke-width="1.8"/>
  <text x="320" y="315" text-anchor="middle" class="usecase">提交课外预约</text>

  <ellipse cx="320" cy="390" rx="90" ry="28" fill="#fff" stroke="#4a6cf7" stroke-width="1.8"/>
  <text x="320" y="395" text-anchor="middle" class="usecase">查看个人预约</text>

  <ellipse cx="320" cy="470" rx="90" ry="28" fill="#fff" stroke="#4a6cf7" stroke-width="1.8"/>
  <text x="320" y="475" text-anchor="middle" class="usecase">取消预约</text>

  <ellipse cx="320" cy="550" rx="90" ry="28" fill="#fff" stroke="#f5576c" stroke-width="1.8"/>
  <text x="320" y="555" text-anchor="middle" class="usecase">维护教学占场</text>

  <!-- Use Cases - Right Column -->
  <ellipse cx="700" cy="150" rx="95" ry="28" fill="#fff" stroke="#4facfe" stroke-width="1.8"/>
  <text x="700" y="155" text-anchor="middle" class="usecase">管理场馆信息</text>

  <ellipse cx="700" cy="230" rx="95" ry="28" fill="#fff" stroke="#4facfe" stroke-width="1.8"/>
  <text x="700" y="235" text-anchor="middle" class="usecase">查看全系统预约</text>

  <ellipse cx="700" cy="310" rx="95" ry="28" fill="#fff" stroke="#4facfe" stroke-width="1.8"/>
  <text x="700" y="315" text-anchor="middle" class="usecase">锁定时段/闭馆</text>

  <ellipse cx="700" cy="390" rx="95" ry="28" fill="#fff" stroke="#4facfe" stroke-width="1.8"/>
  <text x="700" y="395" text-anchor="middle" class="usecase">用户与权限管理</text>

  <ellipse cx="700" cy="470" rx="95" ry="28" fill="#fff" stroke="#4a6cf7" stroke-width="1.8"/>
  <text x="700" y="475" text-anchor="middle" class="usecase">查看附近推荐</text>

  <ellipse cx="700" cy="550" rx="95" ry="28" fill="#fff" stroke="#4a6cf7" stroke-width="1.8"/>
  <text x="700" y="555" text-anchor="middle" class="usecase">评价已用场馆</text>

  <!-- Associate: Student → Use Cases -->
  <line x1="68" y1="150" x2="230" y2="150" stroke="#4a6cf7" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="155" x2="230" y2="230" stroke="#4a6cf7" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="160" x2="230" y2="310" stroke="#4a6cf7" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="165" x2="230" y2="390" stroke="#4a6cf7" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="170" x2="230" y2="470" stroke="#4a6cf7" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="175" x2="640" y2="470" stroke="#4a6cf7" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="180" x2="640" y2="550" stroke="#4a6cf7" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>

  <!-- Associate: Teacher → Use Cases (via generalization to partial Student) -->
  <line x1="68" y1="400" x2="230" y2="550" stroke="#f5576c" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>

  <!-- Associate: Admin → Use Cases -->
  <line x1="68" y1="610" x2="605" y2="150" stroke="#4facfe" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="612" x2="605" y2="230" stroke="#4facfe" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="615" x2="605" y2="310" stroke="#4facfe" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>
  <line x1="68" y1="618" x2="605" y2="390" stroke="#4facfe" stroke-width="1.8" marker-end="url(#arrowAssoc)"/>

  <!-- Time → 超时自动取消 -->
  <ellipse cx="220" cy="625" rx="78" ry="24" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="220" y="630" text-anchor="middle" font-size="12" fill="#666">超时自动取消</text>
  <line x1="80" y1="88" x2="142" y2="635" stroke="#999" stroke-width="1.5" marker-end="url(#arrowAssoc)" stroke-dasharray="4,2"/>

  <!-- <<include>> from 提交课外预约 to 查询时段可用性 -->
  <line x1="320" y1="338" x2="320" y2="258" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowInc)"/>
  <text x="340" y="295" class="ext-rel" fill="#06b6d4">&lt;&lt;include&gt;&gt;</text>

  <!-- <<include>> from 查看附近推荐 to 浏览场馆列表 -->
  <line x1="605" y1="470" x2="410" y2="155" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowInc)"/>
  <text x="480" y="305" class="ext-rel" fill="#06b6d4">&lt;&lt;include&gt;&gt;</text>

  <!-- <<extend>> from 提交课外预约 to 查看附近推荐 -->
  <line x1="410" y1="310" x2="605" y2="460" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowExt)"/>
  <text x="500" y="378" class="ext-rel" fill="#8b5cf6">&lt;&lt;extend&gt;&gt;</text>

  <!-- <<include>> from 锁定时段 to 查看全系统预约 -->
  <line x1="700" y1="338" x2="700" y2="258" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowInc)"/>
  <text x="720" y="295" class="ext-rel" fill="#06b6d4">&lt;&lt;include&gt;&gt;</text>

  <!-- Legend -->
  <rect x="10" y="738" width="980" height="35" rx="6" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="30" y="760" font-size="11" fill="#666">图例：-----------&lt;&lt;include&gt;&gt; 包含关系  ----------&lt;&lt;extend&gt;&gt; 扩展关系  ---------- 关联关系  ● 参与者  ⬜ 系统边界</text>

  </g>
  <g class="codex-text-overlay" transform="translate(80 80)">
    <text x="500" y="38" text-anchor="middle" class="title">用例图 — 多校体育场地预约与时空调度子系统</text>
    <text x="50" y="255" text-anchor="middle" class="actor" fill="#4a6cf7">学生</text>
    <text x="50" y="272" text-anchor="middle" font-size="10" fill="#888">Student</text>
    <text x="50" y="485" text-anchor="middle" class="actor" fill="#f5576c">教师</text>
    <text x="50" y="502" text-anchor="middle" font-size="10" fill="#888">Teacher</text>
    <text x="50" y="705" text-anchor="middle" class="actor" fill="#4facfe">管理员</text>
    <text x="52" y="722" text-anchor="middle" font-size="10" fill="#888">Admin</text>
    <text x="50" y="93" text-anchor="middle" font-size="12" fill="#666">时间</text>
    <text x="170" y="80" font-size="15" font-weight="bold" fill="#333">多校体育场馆预约与时空调度子系统</text>
    <text x="320" y="155" text-anchor="middle" class="usecase">浏览场馆列表</text>
    <text x="320" y="235" text-anchor="middle" class="usecase">查询时段可用性</text>
    <text x="320" y="315" text-anchor="middle" class="usecase">提交课外预约</text>
    <text x="320" y="395" text-anchor="middle" class="usecase">查看个人预约</text>
    <text x="320" y="475" text-anchor="middle" class="usecase">取消预约</text>
    <text x="320" y="555" text-anchor="middle" class="usecase">维护教学占场</text>
    <text x="700" y="155" text-anchor="middle" class="usecase">管理场馆信息</text>
    <text x="700" y="235" text-anchor="middle" class="usecase">查看全系统预约</text>
    <text x="700" y="315" text-anchor="middle" class="usecase">锁定时段/闭馆</text>
    <text x="700" y="395" text-anchor="middle" class="usecase">用户与权限管理</text>
    <text x="700" y="475" text-anchor="middle" class="usecase">查看附近推荐</text>
    <text x="700" y="555" text-anchor="middle" class="usecase">评价已用场馆</text>
    <text x="220" y="630" text-anchor="middle" font-size="12" fill="#666">超时自动取消</text>
    <text x="340" y="295" class="ext-rel" fill="#06b6d4">&lt;&lt;include&gt;&gt;</text>
    <text x="480" y="305" class="ext-rel" fill="#06b6d4">&lt;&lt;include&gt;&gt;</text>
    <text x="500" y="378" class="ext-rel" fill="#8b5cf6">&lt;&lt;extend&gt;&gt;</text>
    <text x="720" y="295" class="ext-rel" fill="#06b6d4">&lt;&lt;include&gt;&gt;</text>
    <text x="30" y="760" font-size="11" fill="#666">图例：-----------&lt;&lt;include&gt;&gt; 包含关系  ----------&lt;&lt;extend&gt;&gt; 扩展关系  ---------- 关联关系  ● 参与者  ⬜ 系统边界</text>
  </g>
</svg>