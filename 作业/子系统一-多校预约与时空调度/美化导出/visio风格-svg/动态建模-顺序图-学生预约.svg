<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1291 936" width="1291" height="936">
  <defs id="codex-visio-style">
    <filter id="codexVisioShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#1f3b73" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="codexPageGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <pattern id="codexGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d9e3f0" stroke-width="0.8" opacity="0.38"/>
    </pattern>
    <style><![CDATA[
      svg {
        background: #edf2f8;
      }
      text {
        font-family: "Microsoft YaHei", "Microsoft JhengHei", "SimHei", "Segoe UI", Arial, sans-serif !important;
        paint-order: stroke fill;
        stroke: rgba(255,255,255,0.72);
        stroke-width: 1.2px;
        letter-spacing: 0.05px;
      }
      .codex-text-overlay text {
        filter: none !important;
        paint-order: stroke fill !important;
        stroke: #ffffff !important;
        stroke-width: 3.2px !important;
        stroke-linejoin: round !important;
      }
      .codex-text-overlay .swimlane,
      .codex-text-overlay .action,
      .codex-text-overlay .lifeline,
      .codex-text-overlay text[fill="#fff"],
      .codex-text-overlay text[fill="#ffffff"],
      .codex-text-overlay text[fill="white"] {
        stroke: rgba(18, 32, 54, 0.55) !important;
        stroke-width: 0.85px !important;
      }
      .title {
        fill: #17345d !important;
        font-weight: 700 !important;
      }
      rect:not(.codex-page-bg):not(.codex-grid-bg),
      ellipse,
      circle,
      polygon {
        filter: url(#codexVisioShadow);
        stroke-linejoin: round;
      }
      path,
      line,
      polyline {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      marker path {
        filter: none;
      }
    ]]></style>
  </defs>
  <rect class="codex-page-bg" x="0" y="0" width="1291" height="936" rx="14" fill="url(#codexPageGradient)"/>
  <rect class="codex-grid-bg" x="0" y="0" width="1291" height="936" fill="url(#codexGrid)" opacity="0.12"/>

  <g transform="translate(80 80)">

  <defs>
    <style>
      text { font-family: 'Microsoft YaHei', 'SimHei', sans-serif; }
      .title { font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .lifeline { font-size: 13px; font-weight: bold; fill: #333; }
      .msg { font-size: 11px; fill: #333; }
    </style>
    <marker id="arrowMsg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4a6cf7"/>
    </marker>
    <marker id="arrowRet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#fafbff" rx="8"/>
  <text x="500" y="38" text-anchor="middle" class="title">顺序图 — 学生预约场地完整交互流程</text>

  <!-- Lifeline Headers -->
  <rect x="50" y="65" width="100" height="40" rx="6" fill="#4a6cf7" filter="url(#shadow)"/>
  <text x="100" y="90" text-anchor="middle" class="lifeline" fill="#fff">学生</text>

  <rect x="210" y="65" width="120" height="40" rx="6" fill="#10b981" filter="url(#shadow)"/>
  <text x="270" y="90" text-anchor="middle" class="lifeline" fill="#fff">Reservation.vue</text>

  <rect x="390" y="65" width="160" height="40" rx="6" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="470" y="90" text-anchor="middle" class="lifeline" fill="#fff">ReservationController</text>

  <rect x="610" y="65" width="160" height="40" rx="6" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="690" y="90" text-anchor="middle" class="lifeline" fill="#fff">ReservationServiceImpl</text>

  <rect x="830" y="65" width="140" height="40" rx="6" fill="#ec4899" filter="url(#shadow)"/>
  <text x="900" y="75" text-anchor="middle" class="lifeline" fill="#fff">MySQL</text>
  <text x="900" y="93" text-anchor="middle" font-size="10" fill="#e0e0e0">(ReservationMapper)</text>

  <!-- Lifelines -->
  <line x1="100" y1="105" x2="100" y2="670" stroke="#4a6cf7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="270" y1="105" x2="270" y2="670" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="470" y1="105" x2="470" y2="670" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="690" y1="105" x2="690" y2="670" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="900" y1="105" x2="900" y2="670" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Activation bars -->
  <rect x="95" y="120" width="10" height="540" fill="#4a6cf7" opacity="0.25" rx="2"/>
  <rect x="265" y="165" width="10" height="490" fill="#10b981" opacity="0.25" rx="2"/>
  <rect x="465" y="225" width="10" height="380" fill="#f59e0b" opacity="0.25" rx="2"/>
  <rect x="685" y="290" width="10" height="310" fill="#8b5cf6" opacity="0.25" rx="2"/>
  <rect x="895" y="380" width="10" height="160" fill="#ec4899" opacity="0.25" rx="2"/>

  <!-- Messages -->
  <!-- 1. 用户操作：选择场馆和日期 -->
  <line x1="100" y1="135" x2="270" y2="155" stroke="#4a6cf7" stroke-width="2" marker-end="url(#arrowMsg)"/>
  <text x="180" y="152" class="msg" fill="#4a6cf7">1. 选择场馆 + 日期</text>

  <!-- 2. 查询时段可用性 GET /api/venues/{id}/schedule -->
  <line x1="270" y1="175" x2="470" y2="195" stroke="#10b981" stroke-width="2" marker-end="url(#arrowMsg)"/>
  <text x="360" y="192" class="msg" fill="#10b981">2. GET /api/reservations/schedule</text>

  <!-- 3. 返回时段可用性 -->
  <line x1="470" y1="215" x2="270" y2="235" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRet)"/>
  <text x="380" y="232" class="msg" fill="#888">3. 返回可用性网格数据</text>

  <!-- 4. 选择时段 -->
  <line x1="100" y1="250" x2="270" y2="270" stroke="#4a6cf7" stroke-width="2" marker-end="url(#arrowMsg)"/>
  <text x="180" y="267" class="msg" fill="#4a6cf7">4. 选择连续时段(15:00-16:00)</text>

  <!-- 5. 确认并提交 POST /api/reservations -->
  <line x1="100" y1="290" x2="270" y2="310" stroke="#4a6cf7" stroke-width="2" marker-end="url(#arrowMsg)"/>
  <text x="200" y="305" class="msg" fill="#4a6cf7">5. 点击"确认预约"提交</text>

  <line x1="270" y1="330" x2="470" y2="350" stroke="#10b981" stroke-width="2" marker-end="url(#arrowMsg)"/>
  <text x="360" y="347" class="msg" fill="#10b981">6. POST /api/reservations (RCR)</text>

  <!-- 6. Controller → Service -->
  <line x1="470" y1="370" x2="690" y2="390" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowMsg)"/>
  <text x="575" y="387" class="msg" fill="#f59e0b">7. createReservation(req, userId)</text>

  <!-- 7. Validation & Availability -->
  <rect x="695" y="405" width="200" height="50" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="700" y="422" font-size="10" fill="#7c3aed">校验 start&lt;end, end不在过去</text>
  <text x="700" y="438" font-size="10" fill="#7c3aed">evaluateAvailability() → 可用</text>
  <text x="700" y="454" font-size="10" fill="#7c3aed">检测同场馆时段冲突 → 无冲突</text>

  <!-- 8. Query DB: check conflicts -->
  <line x1="690" y1="475" x2="900" y2="495" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowMsg)"/>
  <text x="780" y="492" class="msg" fill="#8b5cf6">8. SELECT * FROM t_reservation WHERE...</text>

  <!-- 9. Return query result -->
  <line x1="900" y1="515" x2="690" y2="535" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRet)"/>
  <text x="800" y="532" class="msg" fill="#888">9. 返回空结果(无冲突)</text>

  <!-- 10. INSERT reservation -->
  <line x1="690" y1="555" x2="900" y2="575" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowMsg)"/>
  <text x="780" y="572" class="msg" fill="#8b5cf6">10. INSERT INTO t_reservation VALUES(...)</text>

  <!-- 11. Return INSERT result -->
  <line x1="900" y1="595" x2="690" y2="615" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRet)"/>
  <text x="800" y="612" class="msg" fill="#888">11. 返回插入成功</text>

  <!-- 12. Return to Controller -->
  <line x1="690" y1="635" x2="470" y2="655" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRet)"/>
  <text x="575" y="652" class="msg" fill="#888">12. ApiResponse.success(reservation)</text>

  <!-- 13. Return JSON to frontend -->
  <line x1="470" y1="670" x2="270" y2="685" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRet)"/>
  <text x="360" y="682" class="msg" fill="#888">13. JSON {code:200, data:{id:5001,...}}</text>

  </g>
  <g class="codex-text-overlay" transform="translate(80 80)">
    <text x="500" y="38" text-anchor="middle" class="title">顺序图 — 学生预约场地完整交互流程</text>
    <text x="100" y="90" text-anchor="middle" class="lifeline" fill="#fff">学生</text>
    <text x="270" y="90" text-anchor="middle" class="lifeline" fill="#fff">Reservation.vue</text>
    <text x="470" y="90" text-anchor="middle" class="lifeline" fill="#fff">ReservationController</text>
    <text x="690" y="90" text-anchor="middle" class="lifeline" fill="#fff">ReservationServiceImpl</text>
    <text x="900" y="75" text-anchor="middle" class="lifeline" fill="#fff">MySQL</text>
    <text x="900" y="93" text-anchor="middle" font-size="10" fill="#e0e0e0">(ReservationMapper)</text>
    <text x="180" y="152" class="msg" fill="#4a6cf7">1. 选择场馆 + 日期</text>
    <text x="360" y="192" class="msg" fill="#10b981">2. GET /api/reservations/schedule</text>
    <text x="380" y="232" class="msg" fill="#888">3. 返回可用性网格数据</text>
    <text x="180" y="267" class="msg" fill="#4a6cf7">4. 选择连续时段(15:00-16:00)</text>
    <text x="200" y="305" class="msg" fill="#4a6cf7">5. 点击"确认预约"提交</text>
    <text x="360" y="347" class="msg" fill="#10b981">6. POST /api/reservations (RCR)</text>
    <text x="575" y="387" class="msg" fill="#f59e0b">7. createReservation(req, userId)</text>
    <text x="700" y="422" font-size="10" fill="#7c3aed">校验 start&lt;end, end不在过去</text>
    <text x="700" y="438" font-size="10" fill="#7c3aed">evaluateAvailability() → 可用</text>
    <text x="700" y="454" font-size="10" fill="#7c3aed">检测同场馆时段冲突 → 无冲突</text>
    <text x="780" y="492" class="msg" fill="#8b5cf6">8. SELECT * FROM t_reservation WHERE...</text>
    <text x="800" y="532" class="msg" fill="#888">9. 返回空结果(无冲突)</text>
    <text x="780" y="572" class="msg" fill="#8b5cf6">10. INSERT INTO t_reservation VALUES(...)</text>
    <text x="800" y="612" class="msg" fill="#888">11. 返回插入成功</text>
    <text x="575" y="652" class="msg" fill="#888">12. ApiResponse.success(reservation)</text>
    <text x="360" y="682" class="msg" fill="#888">13. JSON {code:200, data:{id:5001,...}}</text>
  </g>
</svg>