<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>
      text { font-family: 'Microsoft YaHei', 'SimHei', sans-serif; }
      .title { font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .node-name { font-size: 14px; font-weight: bold; fill: #fff; }
      .artifact { font-size: 11px; fill: #555; }
      .net { font-size: 10px; fill: #888; }
    </style>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="#fafbff" rx="8"/>
  <text x="500" y="38" text-anchor="middle" class="title">UML部署图 — 多校多租户部署架构</text>

  <!-- Node: 用户浏览器 / 学校A -->
  <rect x="20" y="70" width="200" height="130" rx="10" fill="#fff" stroke="#4a6cf7" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="20" y="70" width="200" height="32" rx="10" fill="#4a6cf7"/>
  <rect x="20" y="90" width="200" height="12" fill="#4a6cf7"/>
  <text x="120" y="92" text-anchor="middle" class="node-name">«device» 浏览器 Chrome/Edge</text>
  <text x="40" y="125" class="artifact">学校A-学生/教师/管理员</text>
  <text x="40" y="145" class="artifact">Vue 3 SPA</text>
  <text x="40" y="165" class="artifact">HTTPS (WSS)</text>

  <!-- Node: 用户浏览器 / 学校B -->
  <rect x="20" y="230" width="200" height="130" rx="10" fill="#fff" stroke="#6366f1" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="20" y="230" width="200" height="32" rx="10" fill="#6366f1"/>
  <rect x="20" y="250" width="200" height="12" fill="#6366f1"/>
  <text x="120" y="252" text-anchor="middle" class="node-name">«device» 浏览器 Safari/Firefox</text>
  <text x="40" y="285" class="artifact">学校B-学生/教师/管理员</text>
  <text x="40" y="305" class="artifact">Vue 3 SPA</text>
  <text x="40" y="325" class="artifact">HTTPS (WSS)</text>

  <!-- Node: Nginx Load Balancer -->
  <rect x="280" y="100" width="210" height="180" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="280" y="100" width="210" height="32" rx="10" fill="#f59e0b"/>
  <rect x="280" y="120" width="210" height="12" fill="#f59e0b"/>
  <text x="385" y="122" text-anchor="middle" class="node-name">«server» Nginx v1.26</text>
  <text x="300" y="155" class="artifact">反向代理 + 负载均衡</text>
  <text x="300" y="175" class="artifact">SSL/TLS 终端</text>
  <text x="300" y="195" class="artifact">静态资源缓存</text>
  <text x="300" y="215" class="artifact">速率限制 / DDoS防护</text>
  <text x="300" y="235" class="artifact">WAF 安全规则</text>

  <!-- Node: Spring Boot App Server -->
  <rect x="560" y="70" width="250" height="220" rx="10" fill="#fff" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="560" y="70" width="250" height="32" rx="10" fill="#10b981"/>
  <rect x="560" y="90" width="250" height="12" fill="#10b981"/>
  <text x="685" y="92" text-anchor="middle" class="node-name">«server» Spring Boot App</text>
  <text x="585" y="125" class="artifact">Java 17 JVM</text>
  <text x="585" y="145" class="artifact">Spring Boot 3.4.4</text>
  <text x="585" y="165" class="artifact">JWT Authentication Filter</text>
  <text x="585" y="185" class="artifact">ReservationService</text>
  <text x="585" y="205" class="artifact">VenueService</text>
  <text x="585" y="225" class="artifact">UserService</text>
  <text x="585" y="245" class="artifact">TenantContextInterceptor</text>
  <text x="585" y="265" class="artifact">CPU: 4核 / RAM: 8GB</text>

  <!-- Node: MySQL 学校A -->
  <rect x="560" y="330" width="190" height="150" rx="10" fill="#fff" stroke="#4facfe" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="560" y="330" width="190" height="32" rx="10" fill="#4facfe"/>
  <rect x="560" y="350" width="190" height="12" fill="#4facfe"/>
  <text x="655" y="352" text-anchor="middle" class="node-name">«database» MySQL 学校A</text>
  <text x="580" y="385" class="artifact">MySQL 8.4</text>
  <text x="580" y="405" class="artifact">Database: sc_a_db</text>
  <text x="580" y="425" class="artifact">租户隔离: tenant_id='scu'</text>
  <text x="580" y="445" class="artifact">InnoDB 事务引擎</text>
  <text x="580" y="465" class="artifact">CPU:2核 / RAM:4GB</text>

  <!-- Node: MySQL 学校B -->
  <rect x="790" y="330" width="190" height="150" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="790" y="330" width="190" height="32" rx="10" fill="#8b5cf6"/>
  <rect x="790" y="350" width="190" height="12" fill="#8b5cf6"/>
  <text x="885" y="352" text-anchor="middle" class="node-name">«database» MySQL 学校B</text>
  <text x="810" y="385" class="artifact">MySQL 8.4</text>
  <text x="810" y="405" class="artifact">Database: sc_b_db</text>
  <text x="810" y="425" class="artifact">租户隔离: tenant_id='nju'</text>
  <text x="810" y="445" class="artifact">InnoDB 事务引擎</text>
  <text x="810" y="465" class="artifact">CPU:2核 / RAM:4GB</text>

  <!-- ===== Network Links ===== -->
  <!-- Browser A → Nginx -->
  <line x1="220" y1="135" x2="280" y2="160" stroke="#4a6cf7" stroke-width="2.5"/>
  <text x="240" y="140" class="net" fill="#4a6cf7">HTTPS(443)</text>

  <!-- Browser B → Nginx -->
  <line x1="220" y1="295" x2="280" y2="240" stroke="#6366f1" stroke-width="2.5"/>
  <text x="240" y="280" class="net" fill="#6366f1">HTTPS(443)</text>

  <!-- Nginx → App Server -->
  <line x1="490" y1="190" x2="560" y2="170" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="520" y="175" class="net" fill="#f59e0b">HTTP(8080)</text>

  <!-- App Server → MySQL A -->
  <line x1="655" y1="290" x2="655" y2="330" stroke="#4facfe" stroke-width="2.5"/>
  <text x="665" y="315" class="net" fill="#4facfe">JDBC(3306)</text>

  <!-- App Server → MySQL B -->
  <line x1="720" y1="290" x2="885" y2="330" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="800" y="315" class="net" fill="#8b5cf6">JDBC(3306)</text>

  <!-- ===== DeepSeek External -->
  <rect x="270" y="370" width="200" height="100" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="270" y="370" width="200" height="28" rx="10" fill="#ec4899"/>
  <rect x="270" y="386" width="200" height="12" fill="#ec4899"/>
  <text x="370" y="390" text-anchor="middle" class="node-name" font-size="12">«external» DeepSeek API</text>
  <text x="290" y="425" class="artifact">推荐算法服务</text>
  <text x="290" y="445" class="artifact">HTTPS: api.deepseek.com</text>

  <!-- App Server → DeepSeek -->
  <line x1="660" y1="290" x2="370" y2="370" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="480" y="325" class="net" fill="#ec4899">HTTPS（外部调用）</text>

  <!-- Legend -->
  <rect x="20" y="530" width="960" height="100" rx="8" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="555" font-size="13" font-weight="bold" fill="#333">部署架构说明：</text>
  <text x="40" y="578" font-size="12" fill="#555">• 每个学校对应独立的MySQL数据库实例，通过tenant_id字段实现逻辑隔离，同时支持独立部署实现物理隔离</text>
  <text x="40" y="598" font-size="12" fill="#555">• Nginx作为统一入口，所有浏览器请求通过HTTPS(443)接入，Nginx反向代理至Spring Boot App(8080)</text>
  <text x="40" y="618" font-size="12" fill="#555">• Spring Boot App通过TenantContextInterceptor中间件提取请求中的租户标识，路由至对应的MySQL数据源</text>
</svg>