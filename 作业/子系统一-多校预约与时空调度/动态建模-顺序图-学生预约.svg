<rect x="1263" y="759" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="1355" y="778" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">9. send reminder</text>
<line x1="950" y1="843" x2="680" y2="843" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
