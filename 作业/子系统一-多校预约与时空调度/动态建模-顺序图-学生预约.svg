<text x="815" y="840" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">10. 预约成功</text>
<line x1="680" y1="905" x2="410" y2="905" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<rect x="453" y="883" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="545" y="902" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">11. ApiResponse.success</text>
<line x1="410" y1="967" x2="140" y2="967" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<rect x="183" y="945" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
