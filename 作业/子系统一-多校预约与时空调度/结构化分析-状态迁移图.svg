<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <style>
      text { font-family: 'Microsoft YaHei', 'SimHei', sans-serif; }
      .title { font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .state { font-size: 15px; font-weight: bold; }
      .tran { font-size: 12px; fill: #555; }
      .sub { font-size: 22px; font-weight: bold; fill: #333; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="680" fill="#fafbff" rx="8"/>

  <text x="500" y="38" text-anchor="middle" class="title">状态迁移图 — 预约单与场地状态流转</text>

  <!-- ========== SECTION 1: Reservation States ========== -->
  <text x="500" y="75" text-anchor="middle" class="sub">预约单 (Reservation) 状态迁移</text>

  <!-- Start -->
  <circle cx="70" cy="130" r="12" fill="#333"/>
  <text x="90" y="135" font-size="12" fill="#555">开始</text>

  <!-- PENDING -->
  <rect x="130" y="95" width="150" height="70" rx="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="205" y="130" text-anchor="middle" class="state" fill="#92400e">PENDING</text>
  <text x="205" y="150" text-anchor="middle" font-size="11" fill="#a16207">待确认</text>

  <!-- CONFIRMED -->
  <rect x="370" y="95" width="160" height="70" rx="35" fill="#d1fae5" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
  <text x="450" y="130" text-anchor="middle" class="state" fill="#065f46">CONFIRMED</text>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#047857">已确认</text>

  <!-- COMPLETED -->
  <rect x="620" y="95" width="160" height="70" rx="35" fill="#e0e7ff" stroke="#6366f1" stroke-width="3" filter="url(#shadow)"/>
  <text x="700" y="130" text-anchor="middle" class="state" fill="#3730a3">COMPLETED</text>
  <text x="700" y="150" text-anchor="middle" font-size="11" fill="#4338ca">已完成</text>

  <!-- CANCELLED -->
  <rect x="370" y="260" width="160" height="70" rx="35" fill="#fee2e2" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
  <text x="450" y="295" text-anchor="middle" class="state" fill="#991b1b">CANCELLED</text>
  <text x="450" y="315" text-anchor="middle" font-size="11" fill="#b91c1c">已取消</text>

  <!-- Transitions -->
  <!-- Start → PENDING -->
  <line x1="82" y1="130" x2="130" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="106" y="120" font-size="9" fill="#555">提交预约</text>

  <!-- PENDING → CONFIRMED -->
  <line x1="280" y1="130" x2="370" y2="130" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="310" y="118" class="tran" fill="#10b981">系统确认 /</text>
  <text x="310" y="132" class="tran" fill="#10b981">管理员审核通过</text>

  <!-- CONFIRMED → COMPLETED -->
  <line x1="530" y1="130" x2="620" y2="130" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="565" y="118" class="tran" fill="#6366f1">时间到达</text>
  <text x="565" y="132" class="tran" fill="#6366f1">使用完成</text>

  <!-- PENDING → CANCELLED -->
  <line x1="230" y1="165" x2="390" y2="270" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="290" y="215" class="tran" fill="#ef4444">用户取消 / 超时自动取消</text>

  <!-- CONFIRMED → CANCELLED -->
  <line x1="450" y1="165" x2="450" y2="260" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="460" y="220" class="tran" fill="#ef4444">管理员取消 /</text>
  <text x="460" y="234" class="tran" fill="#ef4444">场馆锁定触发</text>

  <!-- End from COMPLETED -->
  <line x1="780" y1="130" x2="830" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="845" cy="130" r="12" fill="#333"/>
  <circle cx="845" cy="130" r="6" fill="#fff"/>

  <!-- End from CANCELLED -->
  <line x1="530" y1="295" x2="580" y2="295" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="595" cy="295" r="12" fill="#333"/>
  <circle cx="595" cy="295" r="6" fill="#fff"/>

  <!-- Divider -->
  <line x1="40" y1="350" x2="960" y2="350" stroke="#ddd" stroke-width="1" stroke-dasharray="8,4"/>

  <!-- ========== SECTION 2: Venue States ========== -->
  <text x="500" y="385" text-anchor="middle" class="sub">场地 (Venue) 状态迁移</text>

  <!-- Start Venue -->
  <circle cx="70" cy="450" r="12" fill="#333"/>
  <text x="90" y="455" font-size="12" fill="#555">注册</text>

  <!-- AVAILABLE -->
  <rect x="130" y="415" width="170" height="70" rx="35" fill="#d1fae5" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
  <text x="215" y="448" text-anchor="middle" class="state" fill="#065f46">AVAILABLE</text>
  <text x="215" y="468" text-anchor="middle" font-size="11" fill="#047857">可预约</text>

  <!-- MAINTENANCE -->
  <rect x="400" y="415" width="170" height="70" rx="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="485" y="448" text-anchor="middle" class="state" fill="#92400e">MAINTENANCE</text>
  <text x="485" y="468" text-anchor="middle" font-size="11" fill="#a16207">维护中</text>

  <!-- CLOSED -->
  <rect x="670" y="415" width="170" height="70" rx="35" fill="#fee2e2" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
  <text x="755" y="448" text-anchor="middle" class="state" fill="#991b1b">CLOSED</text>
  <text x="755" y="468" text-anchor="middle" font-size="11" fill="#b91c1c">已关闭</text>

  <!-- Start → AVAILABLE -->
  <line x1="82" y1="450" x2="130" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AVAILABLE → MAINTENANCE -->
  <line x1="300" y1="450" x2="400" y2="450" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="335" y="440" class="tran" fill="#f59e0b">管理员锁定/</text>
  <text x="335" y="454" class="tran" fill="#f59e0b">维修时段设置</text>

  <!-- MAINTENANCE → AVAILABLE -->
  <line x1="335" y1="470" x2="335" y2="510" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="335" y1="510" x2="215" y2="485" stroke="#10b981" stroke-width="2.5"/>
  <text x="350" y="498" class="tran" fill="#10b981">维护完成 / 解锁</text>

  <!-- MAINTENANCE → CLOSED -->
  <line x1="570" y1="450" x2="670" y2="450" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="610" y="440" class="tran" fill="#ef4444">永久关闭 /</text>
  <text x="610" y="454" class="tran" fill="#ef4444">场馆拆除</text>

  <!-- AVAILABLE → CLOSED -->
  <line x1="230" y1="485" x2="380" y2="540" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="290" y="525" class="tran" fill="#ef4444" font-size="10">直接关闭(罕见)</text>

  <!-- End from CLOSED -->
  <line x1="840" y1="450" x2="880" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="895" cy="450" r="12" fill="#333"/>
  <circle cx="895" cy="450" r="6" fill="#fff"/>

  <!-- Legend -->
  <rect x="40" y="570" width="920" height="90" rx="8" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="595" font-size="13" font-weight="bold" fill="#333">迁移规则说明：</text>
  <text x="60" y="618" font-size="12" fill="#555">• PENDING → CONFIRMED：预约提交后系统自动确认或管理员审核通过</text>
  <text x="60" y="636" font-size="12" fill="#555">• PENDING → CANCELLED：用户在截止时间前主动取消，或系统超时自动取消</text>
  <text x="460" y="618" font-size="12" fill="#555">• CONFIRMED → COMPLETED：到达结束时间后系统自动标记完成</text>
  <text x="460" y="636" font-size="12" fill="#555">• CONFIRMED → CANCELLED：管理员强制取消或因场馆锁定连带取消</text>
</svg>