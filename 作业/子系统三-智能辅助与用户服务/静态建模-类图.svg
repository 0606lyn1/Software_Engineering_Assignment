<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 11px; fill: #333; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .cls-title { font-size: 12px; font-weight: bold; fill: #fff; }
      .cls-item { font-size: 10px; fill: #333; }
      .arrow { stroke: #555; stroke-width: 1.5; fill: none; }
      .interface-dash { stroke: #888; stroke-width: 1.5; stroke-dasharray: 6,3; fill: none; }
      .dep-arrow { stroke: #888; stroke-width: 1.2; stroke-dasharray: 5,3; fill: none; }
    </style>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="ar-dash" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="inherit" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fff" stroke="#555" stroke-width="1"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" class="title">子系统三 — 智能辅助领域类图</text>

  <!-- === Controller === -->
  <g transform="translate(30,50)">
    <rect x="0" y="0" width="240" height="24" rx="4" fill="#1E88E5" stroke="#1565C0"/>
    <text x="120" y="17" text-anchor="middle" class="cls-title">«Controller» AssistantController</text>
    <rect x="0" y="24" width="240" height="0" fill="#fff" stroke="#1E88E5"/>
    <rect x="0" y="24" width="240" height="44" fill="#fff" stroke="#1E88E5"/>
    <text x="8" y="40" class="cls-item">- assistantService: AssistantService</text>
    <text x="8" y="56" class="cls-item">+ ask(req): ApiResponse&lt;AssistantAnswerResponse&gt;</text>
    <text x="8" y="68" class="cls-item">+ status(): ApiResponse&lt;AssistantStatusResponse&gt;</text>
  </g>

  <!-- === Service Interface === -->
  <g transform="translate(30,210)">
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#7B1FA2" stroke="#6A1B9A"/>
    <text x="110" y="16" text-anchor="middle" class="cls-title">«interface» AssistantService</text>
    <rect x="0" y="22" width="220" height="52" fill="#fff" stroke="#7B1FA2"/>
    <text x="8" y="38" class="cls-item">+ answer(question, username, role): AssistantAnswerResponse</text>
    <text x="8" y="52" class="cls-item">+ getStatus(): AssistantStatusResponse</text>
    <text x="8" y="66" class="cls-item">+ getCallLogs(): List&lt;CallLog&gt;</text>
  </g>

  <!-- === Service Implementation === -->
  <g transform="translate(330,210)">
    <rect x="0" y="0" width="260" height="22" rx="4" fill="#43A047" stroke="#2E7D32"/>
    <text x="130" y="16" text-anchor="middle" class="cls-title">AssistantServiceImpl</text>
    <rect x="0" y="22" width="260" height="90" fill="#fff" stroke="#43A047"/>
    <text x="8" y="38" class="cls-item">- deepSeekApiUrl: String</text>
    <text x="8" y="52" class="cls-item">- deepSeekApiKey: String</text>
    <text x="8" y="66" class="cls-item">- deepSeekEnabled: boolean</text>
    <text x="8" y="80" class="cls-item">- ruleEngine: RuleEngine</text>
    <text x="8" y="94" class="cls-item">- callLogService: CallLogService</text>
    <text x="8" y="108" class="cls-item">+ answer(question, username, role): AssistantAnswerResponse</text>
    <text x="8" y="122" class="cls-item">- callDeepSeek(prompt): String</text>
    <text x="8" y="136" class="cls-item">- fallbackAnswer(question): String</text>
    <text x="8" y="150" class="cls-item">- buildPrompt(q,user,role,ctx): String</text>
  </g>

  <!-- Interface inheritance arrow -->
  <polygon points="250,232 280,232 280,226 300,232 280,238 280,232" fill="#888"/>
  <line x1="250" y1="232" x2="295" y2="232" class="interface-dash"/>

  <!-- === Request DTO === -->
  <g transform="translate(330,50)">
    <rect x="0" y="0" width="200" height="22" rx="4" fill="#FF7043" stroke="#E64A19"/>
    <text x="100" y="16" text-anchor="middle" class="cls-title">AssistantAskRequest</text>
    <rect x="0" y="22" width="200" height="30" fill="#fff" stroke="#FF7043"/>
    <text x="8" y="38" class="cls-item">- question: String @NotBlank</text>
    <text x="8" y="50" class="cls-item">  (max 500 chars)</text>
  </g>

  <!-- === Response DTO: Answer === -->
  <g transform="translate(560,50)">
    <rect x="0" y="0" width="230" height="22" rx="4" fill="#FF7043" stroke="#E64A19"/>
    <text x="115" y="16" text-anchor="middle" class="cls-title">AssistantAnswerResponse</text>
    <rect x="0" y="22" width="230" height="44" fill="#fff" stroke="#FF7043"/>
    <text x="8" y="38" class="cls-item">- answer: String</text>
    <text x="8" y="52" class="cls-item">- suggestions: List&lt;String&gt;</text>
    <text x="8" y="66" class="cls-item">- provider: String ("deepseek"|"fallback")</text>
  </g>

  <!-- === Response DTO: Status === -->
  <g transform="translate(560,150)">
    <rect x="0" y="0" width="230" height="22" rx="4" fill="#FF7043" stroke="#E64A19"/>
    <text x="115" y="16" text-anchor="middle" class="cls-title">AssistantStatusResponse</text>
    <rect x="0" y="22" width="230" height="58" fill="#fff" stroke="#FF7043"/>
    <text x="8" y="38" class="cls-item">- deepseekEnabled: boolean</text>
    <text x="8" y="52" class="cls-item">- apiKeyConfigured: boolean</text>
    <text x="8" y="64" class="cls-item">- mode: String</text>
    <text x="8" y="76" class="cls-item">- lastHttpStatus: Integer</text>
    <text x="8" y="88" class="cls-item">- lastError: String</text>
  </g>

  <!-- === RuleEngine === -->
  <g transform="translate(30,340)">
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#5C6BC0" stroke="#3F51B5"/>
    <text x="110" y="16" text-anchor="middle" class="cls-title">RuleEngine</text>
    <rect x="0" y="22" width="220" height="44" fill="#fff" stroke="#5C6BC0"/>
    <text x="8" y="38" class="cls-item">- keywordRules: Map&lt;String, Rule&gt;</text>
    <text x="8" y="52" class="cls-item">- fallbackAnswer: String</text>
    <text x="8" y="64" class="cls-item">+ match(question): RuleResult</text>
    <text x="8" y="76" class="cls-item">+ loadRules(): void</text>
  </g>

  <!-- === CallLogService === -->
  <g transform="translate(330,340)">
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#78909C" stroke="#546E7A"/>
    <text x="110" y="16" text-anchor="middle" class="cls-title">CallLogService</text>
    <rect x="0" y="22" width="220" height="30" fill="#fff" stroke="#78909C"/>
    <text x="8" y="38" class="cls-item">+ log(question, answer, provider, latency): void</text>
    <text x="8" y="50" class="cls-item">+ getLogs(): List&lt;CallLogEntry&gt;</text>
  </g>

  <!-- === PromptBuilder === -->
  <g transform="translate(560,340)">
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#26A69A" stroke="#00897B"/>
    <text x="110" y="16" text-anchor="middle" class="cls-title">PromptBuilder</text>
    <rect x="0" y="22" width="220" height="30" fill="#fff" stroke="#26A69A"/>
    <text x="8" y="38" class="cls-item">+ buildSystemPrompt(): String</text>
    <text x="8" y="50" class="cls-item">+ withTools(): String</text>
  </g>

  <!-- === ApiResponse === -->
  <g transform="translate(330,420)">
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#FFA726" stroke="#FB8C00"/>
    <text x="110" y="16" text-anchor="middle" class="cls-title">ApiResponse&lt;T&gt;</text>
    <rect x="0" y="22" width="220" height="30" fill="#fff" stroke="#FFA726"/>
    <text x="8" y="38" class="cls-item">- code: int (0=success)</text>
    <text x="8" y="50" class="cls-item">- msg: String</text>
    <text x="8" y="62" class="cls-item">- data: T</text>
  </g>

  <!-- === Tool Functions === -->
  <g transform="translate(30,420)">
    <rect x="0" y="0" width="260" height="22" rx="4" fill="#8D6E63" stroke="#6D4C41"/>
    <text x="130" y="16" text-anchor="middle" class="cls-title">Tool Function Definitions</text>
    <rect x="0" y="22" width="260" height="44" fill="#fff" stroke="#8D6E63"/>
    <text x="8" y="38" class="cls-item">+ get_user_reservations() → List</text>
    <text x="8" y="52" class="cls-item">+ search_venue_availability(type, date) → List</text>
    <text x="8" y="64" class="cls-item">+ get_venue_detail(venueId) → VenueOps</text>
  </g>

  <!-- Dependency arrows -->
  <!-- Controller uses Service -->
  <line x1="270" y1="108" x2="130" y2="210" class="dep-arrow" marker-end="url(#ar-dash)"/>
  <text x="195" y="140" font-size="9" fill="#888">uses</text>

  <!-- ServiceImpl implements ServiceInterface -->
  <!-- Already drawn with interface inheritance -->

  <!-- ServiceImpl uses RuleEngine -->
  <line x1="330" y1="310" x2="140" y2="340" class="dep-arrow" marker-end="url(#ar-dash)"/>
  <text x="230" y="325" font-size="9" fill="#888">uses</text>

  <!-- ServiceImpl uses PromptBuilder -->
  <line x1="460" y1="300" x2="560" y2="340" class="dep-arrow" marker-end="url(#ar-dash)"/>
  <text x="510" y="320" font-size="9" fill="#888">uses</text>

  <!-- ServiceImpl uses CallLogService -->
  <line x1="460" y1="280" x2="440" y2="340" class="dep-arrow" marker-end="url(#ar-dash)"/>

  <!-- Return type arrows -->
  <line x1="380" y1="150" x2="560" y2="80" class="dep-arrow" marker-end="url(#ar-dash)"/>
  <text x="460" y="110" font-size="9" fill="#888">returns</text>

  <line x1="380" y1="150" x2="560" y2="180" class="dep-arrow" marker-end="url(#ar-dash)"/>
  <text x="470" y="168" font-size="9" fill="#888">returns</text>

  <line x1="380" y1="95" x2="350" y2="420" class="dep-arrow" marker-end="url(#ar-dash)"/>
  <text x="320" y="260" font-size="9" fill="#888">wraps in</text>

  <!-- Tool functions used by ServiceImpl -->
  <line x1="400" y1="310" x2="160" y2="420" class="dep-arrow" marker-end="url(#ar-dash)"/>
  <text x="280" y="370" font-size="9" fill="#888">dispatches</text>

  <!-- Legend at bottom -->
  <rect x="100" y="490" width="700" height="60" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="120" y="510" font-size="10" fill="#555">图例:</text>
  <rect x="170" y="500" width="40" height="14" rx="3" fill="#1E88E5"/><text x="215" y="512" font-size="10" fill="#555">Controller</text>
  <rect x="290" y="500" width="40" height="14" rx="3" fill="#7B1FA2"/><text x="335" y="512" font-size="10" fill="#555">«interface»</text>
  <rect x="430" y="500" width="40" height="14" rx="3" fill="#43A047"/><text x="475" y="512" font-size="10" fill="#555">ServiceImpl</text>
  <rect x="570" y="500" width="40" height="14" rx="3" fill="#FF7043"/><text x="615" y="512" font-size="10" fill="#555">DTO</text>
  <rect x="660" y="500" width="30" height="14" rx="3" fill="#5C6BC0"/><text x="695" y="512" font-size="10" fill="#555">Component</text>
  <line x1="120" y1="538" x2="160" y2="538" class="dep-arrow" marker-end="url(#ar-dash)"/><text x="165" y="542" font-size="10" fill="#555">dependency</text>
  <line x1="280" y1="538" x2="320" y2="538" class="interface-dash"/><text x="325" y="542" font-size="10" fill="#555">implements</text>
</svg>
