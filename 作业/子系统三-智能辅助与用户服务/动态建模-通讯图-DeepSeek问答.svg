
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <marker id="ay" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="650" fill="#f8fbfe" rx="8"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - 通讯图（DeepSeek问答场景）</text>

  <!-- Objects -->
  <rect x="50" y="60" width="130" height="50" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="115" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">:User</text>
  <text x="115" y="98" text-anchor="middle" font-size="10" fill="#555">浏览器端</text>

  <rect x="430" y="60" width="140" height="50" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="500" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">:SmartAssistant.vue</text>
  <text x="500" y="98" text-anchor="middle" font-size="10" fill="#555">Vue3组件</text>

  <rect x="430" y="200" width="140" height="50" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="500" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">:AssistantController</text>
  <text x="500" y="238" text-anchor="middle" font-size="10" fill="#555">Spring Boot</text>

  <rect x="430" y="340" width="140" height="50" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="500" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">:AssistantServiceImpl</text>
  <text x="500" y="378" text-anchor="middle" font-size="10" fill="#555">answer()</text>

  <rect x="750" y="200" width="150" height="50" rx="8" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="825" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#C2185B">:DeepSeek API</text>
  <text x="825" y="238" text-anchor="middle" font-size="10" fill="#555">deepseek-chat</text>

  <!-- Messages (numbered) -->
  <!-- 1. User → SmartAssistant -->
  <path d="M170 70 C300 50, 300 90, 430 80" fill="none" stroke="#6C63FF" stroke-width="1.8" marker-end="url(#at)"/>
  <text x="280" y="55" font-size="11" font-weight="bold" fill="#6C63FF">1: 点击Live2D角色</text>

  <!-- 2. SmartAssistant → Controller -->
  <line x1="500" y1="110" x2="500" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="510" y="160" font-size="10" fill="#555">2: POST /api/assistant/ask</text>

  <!-- 3. Controller → Service -->
  <line x1="500" y1="250" x2="500" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="510" y="300" font-size="10" fill="#555">3: answer(question, username, role)</text>

  <!-- 4. Service → Self (buildPrompt) -->
  <path d="M570 350 C600 350, 600 390, 570 390" fill="none" stroke="#FF9800" stroke-width="1.3" marker-end="url(#ay)"/>
  <text x="610" y="375" font-size="9" fill="#E65100">4: buildPrompt(venueFacts, user)</text>

  <!-- 5. Service → DeepSeek -->
  <line x1="570" y1="360" x2="750" y2="220" stroke="#E91E63" stroke-width="2" marker-end="url(#at)"/>
  <text x="630" y="285" font-size="10" fill="#E91E63">5: HTTP POST (deepseek-chat, 25s)</text>

  <!-- 6. DeepSeek → Service (return) -->
  <line x1="750" y1="235" x2="570" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="640" y="310" font-size="10" fill="#555">6: LLM Response JSON</text>

  <!-- 7. Service → Self (parseResponse) -->
  <path d="M430 365 C400 365, 400 405, 430 405" fill="none" stroke="#FF9800" stroke-width="1.3" marker-end="url(#ay)"/>
  <text x="390" y="390" font-size="9" fill="#E65100">7: parseResponse()</text>

  <!-- 8. Service → Controller -->
  <line x1="430" y1="350" x2="430" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="420" y="300" font-size="9" fill="#555">8: AssistantAnswerResponse</text>

  <!-- 9. Controller → SmartAssistant -->
  <line x1="430" y1="210" x2="430" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="420" y="160" font-size="9" fill="#555">9: ApiResponse</text>

  <!-- 10. SmartAssistant → User -->
  <path d="M430 90 C300 110, 300 50, 180 80" fill="none" stroke="#6C63FF" stroke-width="1.8" marker-end="url(#at)"/>
  <text x="280" y="95" font-size="10" fill="#6C63FF">10: 流式渲染回答</text>

  <!-- Legend -->
  <rect x="50" y="450" width="900" height="180" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="70" y="478" font-size="14" font-weight="bold" fill="#333">消息编号与含义：</text>
  <text x="70" y="502" font-size="11" fill="#555">1. 用户点击Live2D角色 → 打开对话面板</text>
  <text x="70" y="522" font-size="11" fill="#555">2. 用户输入问题并提交 → 前端POST请求到 /api/assistant/ask</text>
  <text x="70" y="542" font-size="11" fill="#555">3. AssistantController 收到请求，调用 AssistantService.answer()</text>
  <text x="70" y="562" font-size="11" fill="#555">4. AssistantServiceImpl.buildPrompt() 构建系统提示词（场馆数据+用户上下文）</text>
  <text x="70" y="582" font-size="11" fill="#555">5. HTTP POST 请求到 DeepSeek API (/v1/chat/completions)，model=deepseek-chat，timeout=25s</text>
  <text x="70" y="602" font-size="11" fill="#555">6. DeepSeek API 返回 JSON 响应，包含 choices[0].message.content</text>
  <text x="70" y="622" font-size="11" fill="#555">7-9. parseResponse()解析 → 构建AssistantAnswerResponse → ApiResponse返回到前端</text>
</svg>
