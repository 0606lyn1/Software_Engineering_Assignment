
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720">
  <defs>
    <marker id="at" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="720" fill="#f8fbfe" rx="8"/>
  <text x="500" y="25" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - 顺序图（DeepSeek问答模式）</text>

  <!-- Lifeline headers -->
  <rect x="30" y="50" width="100" height="35" rx="5" fill="#6C63FF"/>
  <text x="80" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">User</text>

  <rect x="210" y="50" width="110" height="35" rx="5" fill="#2196F3"/>
  <text x="265" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">SmartAssistant</text>

  <rect x="400" y="50" width="120" height="35" rx="5" fill="#4CAF50"/>
  <text x="460" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">AsstController</text>

  <rect x="600" y="50" width="120" height="35" rx="5" fill="#FF9800"/>
  <text x="660" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">AsstService</text>

  <rect x="800" y="50" width="120" height="35" rx="5" fill="#E91E63"/>
  <text x="860" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">DeepSeekAPI</text>

  <!-- Lifelines -->
  <line x1="80" y1="85" x2="80" y2="680" stroke="#6C63FF" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="265" y1="85" x2="265" y2="680" stroke="#2196F3" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="460" y1="85" x2="460" y2="680" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="660" y1="85" x2="660" y2="680" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="860" y1="85" x2="860" y2="680" stroke="#E91E63" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Messages -->
  <!-- 1. User clicks Live2D -->
  <line x1="80" y1="110" x2="265" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="120" y="103" font-size="10" fill="#555">1.clickLive2D()</text>

  <!-- 2. Panel opens -->
  <line x1="265" y1="120" x2="80" y2="120" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="160" y="135" font-size="10" fill="#555">1.1.openChatPanel</text>

  <!-- 3. User inputs question -->
  <line x1="80" y1="155" x2="265" y2="155" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="120" y="148" font-size="10" fill="#555">2.inputQuestion(q)</text>

  <!-- Activation bars -->
  <rect x="260" y="155" width="10" height="80" fill="#2196F3" opacity="0.3"/>
  <rect x="260" y="265" width="10" height="15" fill="#2196F3" opacity="0.3"/>

  <!-- 4. POST /api/assistant/ask -->
  <line x1="265" y1="180" x2="460" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="350" y="173" font-size="10" fill="#555">3.POST /ask {question}</text>

  <!-- Controller activation -->
  <rect x="455" y="180" width="10" height="90" fill="#4CAF50" opacity="0.3"/>
  <rect x="455" y="350" width="10" height="20" fill="#4CAF50" opacity="0.3"/>

  <!-- 5. Controller → Service.answer() -->
  <line x1="460" y1="200" x2="660" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="540" y="193" font-size="10" fill="#555">4.answer(q,username,role)</text>

  <!-- Service activation -->
  <rect x="655" y="200" width="10" height="140" fill="#FF9800" opacity="0.3"/>
  <rect x="655" y="370" width="10" height="20" fill="#FF9800" opacity="0.3"/>

  <!-- 6. Check availability -->
  <text x="670" y="217" font-size="9" fill="#555">checkAvailability()→true</text>

  <!-- 7. buildPrompt -->
  <line x1="660" y1="225" x2="860" y2="225" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="720" y="218" font-size="10" fill="#555">5.buildPrompt(venueFacts,user)</text>

  <!-- DeepSeek activation -->
  <rect x="855" y="225" width="10" height="60" fill="#E91E63" opacity="0.3"/>

  <!-- System prompt return -->
  <line x1="860" y1="245" x2="660" y2="245" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="760" y="240" font-size="10" fill="#555">system prompt</text>

  <!-- 8. HTTP POST to DeepSeek -->
  <line x1="660" y1="265" x2="860" y2="265" stroke="#E65100" stroke-width="2" marker-end="url(#at)"/>
  <text x="710" y="258" font-size="10" fill="#E65100">6.HTTP POST deepseek-chat</text>

  <!-- DeepSeek processing -->
  <rect x="855" y="265" width="10" height="50" fill="#E91E63" opacity="0.5"/>
  <text x="870" y="290" font-size="9" fill="#E91E63">处理中...</text>

  <!-- 9. LLM Response -->
  <line x1="860" y1="320" x2="660" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="750" y="313" font-size="10" fill="#555">7.LLM Response (JSON)</text>

  <!-- 10. parseResponse -->
  <text x="670" y="340" font-size="9" fill="#555">parseResponse()→answer text</text>

  <!-- 11. Build AnswerResponse -->
  <line x1="660" y1="355" x2="460" y2="355" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="540" y="348" font-size="10" fill="#555">8.AssistantAnswerResponse</text>

  <!-- 12. Controller wraps in ApiResponse -->
  <line x1="460" y1="380" x2="265" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="350" y="373" font-size="10" fill="#555">9.ApiResponse&lt;Answer&gt;</text>

  <!-- 13. Frontend renders -->
  <rect x="260" y="380" width="10" height="50" fill="#2196F3" opacity="0.3"/>
  <line x1="265" y1="410" x2="80" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="160" y="403" font-size="10" fill="#555">10.流式渲染回答</text>

  <!-- UI State updates -->
  <text x="80" y="435" font-size="10" fill="#6C63FF">用户看到：</text>
  <text x="80" y="450" font-size="10" fill="#555">"东校区篮球场1号场今晚</text>
  <text x="80" y="465" font-size="10" fill="#555"> 18:00-20:00空闲，</text>
  <text x="80" y="480" font-size="10" fill="#555"> [点击预约]"</text>

  <!-- Notes -->
  <rect x="30" y="510" width="940" height="80" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="533" font-size="12" font-weight="bold" fill="#E65100">DeepSeek模式关键属性：</text>
  <text x="50" y="553" font-size="11" fill="#555">• DEEPSEEK_API_KEY 环境变量已配置 → deepseekEnabled=true, provider="deepseek"</text>
  <text x="50" y="573" font-size="11" fill="#555">• HTTP POST 到 https://api.deepseek.com/v1/chat/completions, 超时25s</text>
  <text x="50" y="593" font-size="11" fill="#555">• buildPrompt() 拼接 system prompt (含场馆数据、用户username/role上下文) + user question</text>
</svg>
