
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f8fbfe" rx="8"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - DFD 顶层图（上下文图）</text>

  <!-- Central Process -->
  <circle cx="500" cy="320" r="70" fill="#6C63FF" stroke="#4845D2" stroke-width="3"/>
  <text x="500" y="310" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">智能辅助</text>
  <text x="500" y="332" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">系统</text>
  <text x="500" y="405" text-anchor="middle" font-size="12" fill="#666">P0</text>

  <!-- External Entity: User/Browser -->
  <rect x="50" y="80" width="140" height="55" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">用户(Browser)</text>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#555">SmartAssistant.vue</text>
  <!-- Arrow: User→System -->
  <line x1="190" y1="107" x2="430" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="280" y="175" font-size="11" fill="#555">自然语言提问</text>
  <!-- Arrow: System→User -->
  <line x1="430" y1="360" x2="190" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="280" y="245" font-size="11" fill="#555">回答 + 建议列表</text>

  <!-- External Entity: DeepSeek API -->
  <rect x="810" y="60" width="140" height="55" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="880" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">DeepSeek API</text>
  <text x="880" y="102" text-anchor="middle" font-size="11" fill="#555">deepseek-chat</text>
  <!-- Arrow: System→DeepSeek -->
  <line x1="570" y1="300" x2="810" y2="85" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="700" y="170" font-size="11" fill="#555">System Prompt+问题</text>
  <!-- Arrow: DeepSeek→System -->
  <line x1="810" y1="130" x2="570" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="715" y="230" font-size="11" fill="#555">LLM响应Token流</text>

  <!-- External Entity: Subsystem1 -->
  <rect x="810" y="340" width="140" height="55" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="880" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">子系统一</text>
  <text x="880" y="382" text-anchor="middle" font-size="11" fill="#555">预约管理</text>
  <!-- Arrow: System↔Sub1 -->
  <line x1="570" y1="345" x2="810" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="690" y="340" font-size="11" fill="#555">查询空闲/预约</text>
  <line x1="810" y1="380" x2="570" y2="355" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="690" y="395" font-size="11" fill="#555">空闲结果/记录</text>

  <!-- External Entity: Subsystem2 -->
  <rect x="810" y="430" width="140" height="55" rx="6" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="880" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#C2185B">子系统二</text>
  <text x="880" y="472" text-anchor="middle" font-size="11" fill="#555">场馆管理</text>
  <line x1="570" y1="415" x2="810" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="810" y1="470" x2="570" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="690" y="490" font-size="11" fill="#555">场馆详情查询/返回</text>

  <!-- External Entity: Admin -->
  <rect x="50" y="450" width="140" height="55" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="120" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A1B9A">系统管理员</text>
  <text x="120" y="492" text-anchor="middle" font-size="11" fill="#555">Admin</text>
  <line x1="190" y1="478" x2="430" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="280" y="440" font-size="11" fill="#555">配置参数</text>
  <line x1="430" y1="390" x2="190" y2="500" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="340" y="470" font-size="11" fill="#555">运行状态/日志</text>

  <!-- Legend -->
  <rect x="50" y="550" width="500" height="55" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="70" y="572" font-size="12" font-weight="bold" fill="#333">图例：</text>
  <circle cx="150" cy="568" r="8" fill="#6C63FF"/>
  <text x="168" y="572" font-size="11" fill="#555">数据处理</text>
  <rect x="250" y="560" width="30" height="16" rx="3" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="290" y="572" font-size="11" fill="#555">外部实体</text>
  <line x1="380" y1="568" x2="430" y2="568" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="440" y="572" font-size="11" fill="#555">数据流</text>
</svg>
