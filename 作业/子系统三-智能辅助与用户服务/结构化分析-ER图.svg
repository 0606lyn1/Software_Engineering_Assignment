
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="650" fill="#f8fbfe" rx="8"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - ER图（实体关系图）</text>

  <!-- Entity: SessionRecord -->
  <rect x="40" y="60" width="280" height="200" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="180" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">会话记录 (SessionRecord)</text>
  <line x1="60" y1="95" x2="300" y2="95" stroke="#2196F3" stroke-width="1"/>
  <text x="60" y="115" font-size="12" fill="#333"><tspan font-weight="bold">session_id</tspan> PK VARCHAR(64)</text>
  <text x="60" y="135" font-size="12" fill="#333"><tspan font-weight="bold">user_id</tspan> BIGINT NOT NULL</text>
  <text x="60" y="155" font-size="12" fill="#333"><tspan font-weight="bold">role</tspan> VARCHAR(20) DEFAULT 'STUDENT'</text>
  <text x="60" y="175" font-size="12" fill="#333"><tspan font-weight="bold">question</tspan> TEXT NOT NULL</text>
  <text x="60" y="195" font-size="12" fill="#333"><tspan font-weight="bold">answer</tspan> TEXT NOT NULL</text>
  <text x="60" y="215" font-size="12" fill="#333"><tspan font-weight="bold">provider</tspan> VARCHAR(20)</text>
  <text x="60" y="235" font-size="12" fill="#333"><tspan font-weight="bold">tokens_used</tspan> INT DEFAULT 0</text>
  <text x="60" y="250" font-size="12" fill="#333"><tspan font-weight="bold">created_at</tspan>, <tspan font-weight="bold">expires_at</tspan> DATETIME</text>

  <!-- Entity: ToolCallLog -->
  <rect x="390" y="60" width="270" height="200" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="525" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D32">工具调用记录 (ToolCallLog)</text>
  <line x1="410" y1="95" x2="640" y2="95" stroke="#4CAF50" stroke-width="1"/>
  <text x="410" y="115" font-size="12" fill="#333"><tspan font-weight="bold">call_id</tspan> PK VARCHAR(64)</text>
  <text x="410" y="135" font-size="12" fill="#333"><tspan font-weight="bold">session_id</tspan> FK VARCHAR(64)</text>
  <text x="410" y="155" font-size="12" fill="#333"><tspan font-weight="bold">function_name</tspan> VARCHAR(64)</text>
  <text x="410" y="175" font-size="12" fill="#333"><tspan font-weight="bold">parameters</tspan> TEXT</text>
  <text x="410" y="195" font-size="12" fill="#333"><tspan font-weight="bold">result</tspan> TEXT</text>
  <text x="410" y="215" font-size="12" fill="#333"><tspan font-weight="bold">call_time</tspan> DATETIME</text>
  <text x="410" y="235" font-size="12" fill="#333"><tspan font-weight="bold">duration_ms</tspan> INT</text>

  <!-- Entity: UserFeedback -->
  <rect x="730" y="60" width="240" height="200" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="850" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">用户反馈 (UserFeedback)</text>
  <line x1="750" y1="95" x2="950" y2="95" stroke="#FF9800" stroke-width="1"/>
  <text x="750" y="115" font-size="12" fill="#333"><tspan font-weight="bold">feedback_id</tspan> PK VARCHAR(64)</text>
  <text x="750" y="135" font-size="12" fill="#333"><tspan font-weight="bold">session_id</tspan> FK VARCHAR(64)</text>
  <text x="750" y="155" font-size="12" fill="#333"><tspan font-weight="bold">user_id</tspan> BIGINT NOT NULL</text>
  <text x="750" y="175" font-size="12" fill="#333"><tspan font-weight="bold">rating</tspan> TINYINT 1-5</text>
  <text x="750" y="195" font-size="12" fill="#333"><tspan font-weight="bold">comment</tspan> TEXT</text>
  <text x="750" y="215" font-size="12" fill="#333"><tspan font-weight="bold">created_at</tspan> DATETIME</text>

  <!-- Entity: AssistantConfig -->
  <rect x="350" y="360" width="300" height="150" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="500" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#6A1B9A">配置参数 (AssistantConfig)</text>
  <line x1="370" y1="395" x2="630" y2="395" stroke="#9C27B0" stroke-width="1"/>
  <text x="370" y="415" font-size="12" fill="#333"><tspan font-weight="bold">config_id</tspan> PK INT AUTO_INCREMENT</text>
  <text x="370" y="435" font-size="12" fill="#333"><tspan font-weight="bold">config_key</tspan> VARCHAR(64) UNIQUE</text>
  <text x="370" y="455" font-size="12" fill="#333"><tspan font-weight="bold">config_value</tspan> TEXT</text>
  <text x="370" y="475" font-size="12" fill="#333"><tspan font-weight="bold">updated_at</tspan> DATETIME</text>
  <text x="370" y="495" font-size="12" fill="#333"><tspan font-weight="bold">updated_by</tspan> VARCHAR(32)</text>

  <!-- Relationships -->
  <!-- SessionRecord 1--N ToolCallLog -->
  <line x1="320" y1="150" x2="390" y2="150" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="142" font-size="10" fill="#555">1</text>
  <text x="370" y="142" font-size="10" fill="#555">N</text>
  <text x="355" y="175" font-size="10" fill="#666">调用</text>

  <!-- SessionRecord 1--1 UserFeedback -->
  <line x1="320" y1="130" x2="730" y2="130" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="123" font-size="10" fill="#555">1</text>
  <text x="720" y="123" font-size="10" fill="#555">1</text>
  <text x="530" y="140" font-size="10" fill="#666">获得反馈</text>

  <!-- Note -->
  <rect x="40" y="500" width="910" height="120" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="525" font-size="13" font-weight="bold" fill="#333">关系说明：</text>
  <text x="60" y="548" font-size="12" fill="#555">• 会话记录 → 工具调用记录：一对多关系。一次会话可触发零到多个工具函数调用（如同时查空闲+查场馆详情）。</text>
  <text x="60" y="570" font-size="12" fill="#555">• 会话记录 → 用户反馈：一对一关系。每次对话会话可选择性地收集用户反馈（评分+文字评价）。</text>
  <text x="60" y="592" font-size="12" fill="#555">• 配置参数：独立配置实体，存储降级联系电话、超时时间、关键词黑名单等动态参数，不与会话产生外键关联。</text>
  <text x="60" y="612" font-size="12" fill="#555">• 数据库选型：MySQL 8.4 InnoDB引擎，session_id/call_id/feedback_id使用UUID避免自增ID暴露业务规模。</text>
</svg>
