
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; }
      .title { font-size: 22px; font-weight: bold; fill: #1a1a2e; }
      .rolename { font-size: 16px; font-weight: bold; fill: #fff; }
      .scenario { font-size: 13px; fill: #333; }
      .label { font-size: 12px; fill: #666; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8ecf4"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6C63FF"/><stop offset="100%" stop-color="#4845D2"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#D94444"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F9A825"/><stop offset="100%" stop-color="#C77800"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4CAF50"/><stop offset="100%" stop-color="#2E7D32"/></linearGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#bg)" rx="8"/>
  <text x="500" y="40" text-anchor="middle" class="title">子系统三 — 用户角色与业务场景分析图</text>

  <!-- Role 1: Student -->
  <rect x="20" y="60" width="225" height="560" rx="10" fill="#fff" stroke="#6C63FF" stroke-width="2"/>
  <rect x="20" y="60" width="225" height="42" rx="10" fill="url(#s1)"/>
  <rect x="20" y="88" width="225" height="14" fill="url(#s1)"/>
  <text x="132" y="87" text-anchor="middle" class="rolename">🎓 学生 (Student)</text>
  <line x1="40" y1="115" x2="225" y2="115" stroke="#6C63FF" stroke-width="1" opacity="0.3"/>
  <text x="40" y="140" class="scenario" font-weight="bold">S1: 场地空闲查询</text>
  <text x="50" y="160" class="label">→ "今晚东校区还有篮球场吗"</text>
  <text x="50" y="178" class="label">→ 调工具查空闲时段</text>
  <text x="50" y="196" class="label">→ 返回可选时段+deep-link</text>
  <line x1="40" y1="210" x2="225" y2="210" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="232" class="scenario" font-weight="bold">S2: 预约引导</text>
  <text x="50" y="252" class="label">→ 多轮对话澄清运动类型</text>
  <text x="50" y="270" class="label">→ 逐步生成预约指引</text>
  <text x="50" y="288" class="label">→ 点链接跳转子系统一确认</text>
  <line x1="40" y1="302" x2="225" y2="302" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="324" class="scenario" font-weight="bold">S3: 器材查询</text>
  <text x="50" y="344" class="label">→ "羽毛球拍需要自带吗"</text>
  <text x="50" y="362" class="label">→ get_venue_detail 工具调用</text>
  <text x="50" y="380" class="label">→ 结构化展示器材配置</text>
  <line x1="40" y1="394" x2="225" y2="394" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="416" class="scenario" font-weight="bold">S4: 评论操作指南</text>
  <text x="50" y="436" class="label">→ "如何对场馆进行评论"</text>
  <text x="50" y="454" class="label">→ 返回FAQ+评分规则说明</text>
  <text x="50" y="472" class="label">→ 含字数限制/评分范围提示</text>

  <!-- Role 2: Teacher -->
  <rect x="260" y="60" width="225" height="560" rx="10" fill="#fff" stroke="#FF6B6B" stroke-width="2"/>
  <rect x="260" y="60" width="225" height="42" rx="10" fill="url(#s2)"/>
  <rect x="260" y="88" width="225" height="14" fill="url(#s2)"/>
  <text x="372" y="87" text-anchor="middle" class="rolename">👨‍🏫 教师 (Teacher)</text>
  <line x1="280" y1="115" x2="465" y2="115" stroke="#FF6B6B" stroke-width="1" opacity="0.3"/>
  <text x="280" y="140" class="scenario" font-weight="bold">T1: 课程占场查询</text>
  <text x="290" y="160" class="label">→ "下周一上午篮球课用哪个场"</text>
  <text x="290" y="178" class="label">→ 调子系统一API查课程关联</text>
  <text x="290" y="196" class="label">→ 返回场地+时段信息</text>
  <line x1="280" y1="210" x2="465" y2="210" stroke="#ddd" stroke-width="1"/>
  <text x="280" y="232" class="scenario" font-weight="bold">T2: 班级活动建议</text>
  <text x="290" y="252" class="label">→ "想组织班级羽毛球赛"</text>
  <text x="290" y="270" class="label">→ 分析可用时段+场馆容量</text>
  <text x="290" y="288" class="label">→ 推荐合适场地方案</text>
  <line x1="280" y1="302" x2="465" y2="302" stroke="#ddd" stroke-width="1"/>
  <text x="280" y="324" class="scenario" font-weight="bold">T3: 预约规则咨询</text>
  <text x="290" y="344" class="label">→ "教师最多可提前几天预约"</text>
  <text x="290" y="362" class="label">→ 基于租户配置返回规则</text>
  <text x="290" y="380" class="label">→ 含角色上限说明</text>

  <!-- Role 3: Ops Admin -->
  <rect x="500" y="60" width="240" height="560" rx="10" fill="#fff" stroke="#F9A825" stroke-width="2"/>
  <rect x="500" y="60" width="240" height="42" rx="10" fill="url(#s3)"/>
  <rect x="500" y="88" width="240" height="14" fill="url(#s3)"/>
  <text x="620" y="87" text-anchor="middle" class="rolename">🔧 运维管理员 (Ops)</text>
  <line x1="520" y1="115" x2="720" y2="115" stroke="#F9A825" stroke-width="1" opacity="0.3"/>
  <text x="520" y="140" class="scenario" font-weight="bold">O1: 调用量统计</text>
  <text x="530" y="160" class="label">→ 查看累计调用次数</text>
  <text x="530" y="178" class="label">→ 检查最近调用时间</text>
  <text x="530" y="196" class="label">→ GET /api/assistant/status</text>
  <line x1="520" y1="210" x2="720" y2="210" stroke="#ddd" stroke-width="1"/>
  <text x="520" y="232" class="scenario" font-weight="bold">O2: 失败日志查看</text>
  <text x="530" y="252" class="label">→ 降级时查看lastHttpStatus</text>
  <text x="530" y="270" class="label">→ 排查超时/5xx原因</text>
  <text x="530" y="288" class="label">→ 决定是否切换备用端点</text>
  <line x1="520" y1="302" x2="720" y2="302" stroke="#ddd" stroke-width="1"/>
  <text x="520" y="324" class="scenario" font-weight="bold">O3: Token消耗监控</text>
  <text x="530" y="344" class="label">→ 后台查看Token消耗趋势</text>
  <text x="530" y="362" class="label">→ 评估调用策略</text>
  <text x="530" y="380" class="label">→ 超限预警通知</text>

  <!-- Role 4: System Admin -->
  <rect x="755" y="60" width="230" height="560" rx="10" fill="#fff" stroke="#4CAF50" stroke-width="2"/>
  <rect x="755" y="60" width="230" height="42" rx="10" fill="url(#s4)"/>
  <rect x="755" y="88" width="230" height="14" fill="url(#s4)"/>
  <text x="870" y="87" text-anchor="middle" class="rolename">⚙️ 系统管理员 (Admin)</text>
  <line x1="775" y1="115" x2="965" y2="115" stroke="#4CAF50" stroke-width="1" opacity="0.3"/>
  <text x="775" y="140" class="scenario" font-weight="bold">A1: 降级参数配置</text>
  <text x="785" y="160" class="label">→ yml配置超时时间(25s)</text>
  <text x="785" y="178" class="label">→ 切换备用API端点</text>
  <text x="785" y="196" class="label">→ 更新fallback联系电话</text>
  <line x1="775" y1="210" x2="965" y2="210" stroke="#ddd" stroke-width="1"/>
  <text x="775" y="232" class="scenario" font-weight="bold">A2: 对话安全审核</text>
  <text x="785" y="252" class="label">→ 查看被拒请求日志</text>
  <text x="785" y="270" class="label">→ 违规关键词分类统计</text>
  <text x="785" y="288" class="label">→ 调整过滤策略黑名单</text>
  <line x1="775" y1="302" x2="965" y2="302" stroke="#ddd" stroke-width="1"/>
  <text x="775" y="324" class="scenario" font-weight="bold">A3: API密钥轮换</text>
  <text x="785" y="344" class="label">→ 通过DEEPSEEK_API_KEY</text>
  <text x="785" y="362" class="label">→ 环境变量轮换密钥</text>
  <text x="785" y="380" class="label">→ 确保密钥不泄露</text>
  <line x1="775" y1="394" x2="965" y2="394" stroke="#ddd" stroke-width="1"/>
  <text x="775" y="416" class="scenario" font-weight="bold">A4: 模型版本切换</text>
  <text x="785" y="436" class="label">→ 配置使用deepseek-chat</text>
  <text x="785" y="454" class="label">→ 或试验其他兼容模型</text>
  <text x="785" y="472" class="label">→ 按需更换模型参数</text>

  <!-- Central system box -->
  <rect x="350" y="630" width="300" height="15" rx="7" fill="#1a1a2e" opacity="0.15"/>
</svg>
