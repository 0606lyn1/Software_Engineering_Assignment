
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="680" fill="#f8fbfe" rx="8"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - DFD 0层图</text>

  <!-- P1: 对话处理 -->
  <rect x="65" y="50" width="260" height="80" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="195" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">P1 对话处理引擎</text>
  <text x="195" y="100" text-anchor="middle" font-size="11" fill="#555">接收提问·意图解析·权限校验</text>
  <text x="195" y="116" text-anchor="middle" font-size="11" fill="#555">路由策略·响应组装·流式返回</text>

  <!-- P2: 工具调用 -->
  <rect x="380" y="50" width="260" height="80" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="510" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D32">P2 工具调用编排</text>
  <text x="510" y="100" text-anchor="middle" font-size="11" fill="#555">函数名解析·参数构建</text>
  <text x="510" y="116" text-anchor="middle" font-size="11" fill="#555">子系统API调用·结果聚合</text>

  <!-- P3: 内容安全 -->
  <rect x="65" y="195" width="260" height="80" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="195" y="223" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">P3 内容安全过滤</text>
  <text x="195" y="245" text-anchor="middle" font-size="11" fill="#555">输入预检·输出后检</text>
  <text x="195" y="261" text-anchor="middle" font-size="11" fill="#555">违规记录·审计告警</text>

  <!-- P4: 降级处理 -->
  <rect x="380" y="195" width="260" height="80" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="510" y="223" text-anchor="middle" font-size="15" font-weight="bold" fill="#6A1B9A">P4 降级处理</text>
  <text x="510" y="245" text-anchor="middle" font-size="11" fill="#555">可用性检测·规则引擎FAQ</text>
  <text x="510" y="261" text-anchor="middle" font-size="11" fill="#555">人工联系·健康检查恢复</text>

  <!-- Data Stores -->
  <rect x="65" y="340" width="130" height="12" rx="1" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="65" y="325" width="60" height="15" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="130" y="336" text-anchor="middle" font-size="10" fill="#333">D1|会话记录</text>

  <rect x="220" y="340" width="130" height="12" rx="1" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="220" y="325" width="74" height="15" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="285" y="336" text-anchor="middle" font-size="10" fill="#333">D2|调用日志</text>

  <rect x="380" y="340" width="130" height="12" rx="1" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="380" y="325" width="74" height="15" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="445" y="336" text-anchor="middle" font-size="10" fill="#333">D3|安全审计</text>

  <rect x="535" y="340" width="110" height="12" rx="1" fill="none" stroke="#333" stroke-width="1.5"/>
  <rect x="535" y="325" width="72" height="15" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="595" y="336" text-anchor="middle" font-size="10" fill="#333">D4|系统配置</text>

  <!-- Flows between processes -->
  <line x1="195" y1="130" x2="195" y2="195" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="210" y="168" font-size="11" fill="#555">P1→P3</text>

  <line x1="510" y1="130" x2="510" y2="195" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="525" y="168" font-size="11" fill="#555">P2→P4</text>

  <line x1="325" y1="90" x2="380" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="340" y="80" font-size="10" fill="#555">工具请求</text>

  <line x1="380" y1="110" x2="325" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="340" y="140" font-size="10" fill="#555">工具结果</text>

  <line x1="195" y1="275" x2="195" y2="325" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="510" y1="275" x2="510" y2="325" stroke="#333" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- External entities -->
  <rect x="720" y="60" width="120" height="50" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="780" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">用户(Browser)</text>
  <text x="780" y="98" text-anchor="middle" font-size="10" fill="#555">提问/回答</text>

  <rect x="870" y="60" width="120" height="50" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="930" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">DeepSeek API</text>
  <text x="930" y="98" text-anchor="middle" font-size="10" fill="#555">LLM服务</text>

  <rect x="720" y="250" width="120" height="50" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="780" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">子系统一</text>
  <text x="780" y="288" text-anchor="middle" font-size="10" fill="#555">预约API</text>

  <rect x="870" y="250" width="120" height="50" rx="6" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="930" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#C2185B">子系统二</text>
  <text x="930" y="288" text-anchor="middle" font-size="10" fill="#555">场馆API</text>

  <!-- External connections -->
  <line x1="325" y1="60" x2="720" y2="85" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
  <line x1="720" y1="95" x2="325" y2="115" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
  <line x1="640" y1="90" x2="870" y2="85" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
  <line x1="870" y1="100" x2="640" y2="115" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
  <line x1="640" y1="250" x2="720" y2="275" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>
  <line x1="640" y1="280" x2="870" y2="275" stroke="#333" stroke-width="1" marker-end="url(#ah)"/>

  <!-- 1层DFD inside P1 -->
  <rect x="65" y="400" width="900" height="240" rx="8" fill="#f0f4ff" stroke="#2196F3" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="80" y="425" font-size="14" font-weight="bold" fill="#1565C0">P1 对话处理引擎 1层细化</text>

  <rect x="85" y="440" width="130" height="55" rx="6" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="150" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">P1.1 接收提问</text>
  <text x="150" y="483" text-anchor="middle" font-size="10" fill="#555">校验+记录会话</text>

  <rect x="245" y="440" width="130" height="55" rx="6" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="310" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">P1.2 意图解析</text>
  <text x="310" y="483" text-anchor="middle" font-size="10" fill="#555">关键词/实体提取</text>

  <rect x="405" y="440" width="130" height="55" rx="6" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="470" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">P1.3 权限校验</text>
  <text x="470" y="483" text-anchor="middle" font-size="10" fill="#555">JWT+角色检查</text>

  <rect x="565" y="440" width="140" height="55" rx="6" fill="#FFE0B2" stroke="#FF9800" stroke-width="1.5"/>
  <text x="635" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">P1.4 路由策略</text>
  <text x="635" y="483" text-anchor="middle" font-size="10" fill="#555">Two-tier判断</text>

  <rect x="85" y="540" width="300" height="60" rx="6" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="235" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">P1.5a DeepSeek LLM模式</text>
  <text x="235" y="583" text-anchor="middle" font-size="10" fill="#555">buildPrompt→HTTP调用→parseResponse→构建答案</text>

  <rect x="430" y="540" width="300" height="60" rx="6" fill="#F8BBD0" stroke="#E91E63" stroke-width="1.5"/>
  <text x="580" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#C2185B">P1.5b Fallback模式</text>
  <text x="580" y="583" text-anchor="middle" font-size="10" fill="#555">keywordMatch→静态FAQ匹配→构建答案</text>

  <rect x="775" y="540" width="170" height="60" rx="6" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="860" y="563" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">P1.6 响应组装</text>
  <text x="860" y="583" text-anchor="middle" font-size="10" fill="#555">构建ApiResponse+建议</text>

  <!-- Internal arrows for 1-level -->
  <line x1="215" y1="467" x2="245" y2="467" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="375" y1="467" x2="405" y2="467" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="535" y1="467" x2="565" y2="467" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="635" y1="495" x2="235" y2="540" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="420" y="525" font-size="10" fill="#4CAF50">[有Key且健康]</text>
  <line x1="705" y1="495" x2="580" y2="540" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="660" y="525" font-size="10" fill="#E91E63">[无Key或不健康]</text>
  <line x1="385" y1="570" x2="430" y2="570" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="730" y1="570" x2="775" y2="570" stroke="#333" stroke-width="1.2" marker-end="url(#ah)"/>
</svg>
