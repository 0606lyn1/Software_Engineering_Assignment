
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <marker id="ahb" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="650" fill="#f8fbfe" rx="8"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - 用例图</text>

  <!-- System Boundary Box -->
  <rect x="220" y="45" width="600" height="480" rx="12" fill="none" stroke="#6C63FF" stroke-width="2.5"/>
  <text x="280" y="70" font-size="15" font-weight="bold" fill="#6C63FF">子系统三：智能辅助与多角色用户服务子系统</text>

  <!-- Use Cases -->
  <ellipse cx="380" cy="130" rx="100" ry="32" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="380" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">UC-A1</text>
  <text x="380" y="142" text-anchor="middle" font-size="11" fill="#333">首次预约引导</text>

  <ellipse cx="620" cy="130" rx="100" ry="32" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="620" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">UC-A2</text>
  <text x="620" y="142" text-anchor="middle" font-size="11" fill="#333">器材查询</text>

  <ellipse cx="500" cy="210" rx="110" ry="32" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="500" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">UC-A3</text>
  <text x="500" y="222" text-anchor="middle" font-size="11" fill="#333">服务降级处理</text>

  <ellipse cx="380" cy="290" rx="100" ry="32" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="380" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">UC-A4</text>
  <text x="380" y="302" text-anchor="middle" font-size="11" fill="#333">工具函数调用</text>

  <ellipse cx="620" cy="290" rx="100" ry="32" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="620" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A1B9A">UC-A5</text>
  <text x="620" y="302" text-anchor="middle" font-size="11" fill="#333">权限与隐私保护</text>

  <ellipse cx="500" cy="370" rx="100" ry="32" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="500" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#C2185B">UC-A6</text>
  <text x="500" y="382" text-anchor="middle" font-size="11" fill="#333">内容安全过滤</text>

  <ellipse cx="500" cy="450" rx="120" ry="32" fill="#FFE0B2" stroke="#FF9800" stroke-width="2"/>
  <text x="500" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">UC-A7</text>
  <text x="500" y="462" text-anchor="middle" font-size="11" fill="#333">降级策略配置</text>

  <!-- Actors - Left Side -->
  <line x1="55" y1="120" x2="55" y2="80"/>
  <circle cx="55" cy="62" r="12" fill="#6C63FF"/>
  <rect x="20" y="120" width="70" height="28" rx="6" fill="#6C63FF"/>
  <text x="55" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">学生</text>

  <line x1="155" y1="180" x2="155" y2="140"/>
  <circle cx="155" cy="122" r="12" fill="#FF6B6B"/>
  <rect x="120" y="180" width="70" height="28" rx="6" fill="#FF6B6B"/>
  <text x="155" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">教师</text>

  <line x1="55" y1="280" x2="55" y2="240"/>
  <circle cx="55" cy="222" r="12" fill="#4CAF50"/>
  <rect x="20" y="280" width="70" height="28" rx="6" fill="#4CAF50"/>
  <text x="55" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">管理员</text>

  <!-- External System Actors - Right Side -->
  <rect x="865" y="115" width="110" height="50" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="920" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">&lt;&lt;system&gt;&gt;</text>
  <text x="920" y="153" text-anchor="middle" font-size="12" fill="#E65100">DeepSeek API</text>

  <rect x="865" y="200" width="110" height="50" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="920" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">&lt;&lt;system&gt;&gt;</text>
  <text x="920" y="238" text-anchor="middle" font-size="12" fill="#2E7D32">子系统一</text>

  <rect x="865" y="285" width="110" height="50" rx="6" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="920" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#C2185B">&lt;&lt;system&gt;&gt;</text>
  <text x="920" y="323" text-anchor="middle" font-size="12" fill="#C2185B">子系统二</text>

  <!-- Association Lines -->
  <line x1="90" y1="120" x2="280" y2="130" stroke="#333" stroke-width="1.2"/>
  <line x1="90" y1="130" x2="520" y2="140" stroke="#333" stroke-width="1.2"/>
  <line x1="190" y1="175" x2="280" y2="145" stroke="#333" stroke-width="1.2"/>
  <line x1="190" y1="185" x2="520" y2="150" stroke="#333" stroke-width="1.2"/>
  <line x1="90" y1="280" x2="380" y2="450" stroke="#333" stroke-width="1.2"/>

  <line x1="865" y1="135" x2="720" y2="135" stroke="#E65100" stroke-width="1.2"/>
  <line x1="865" y1="225" x2="720" y2="280" stroke="#2E7D32" stroke-width="1.2"/>
  <line x1="865" y1="310" x2="720" y2="295" stroke="#C2185B" stroke-width="1.2"/>

  <!-- Legend -->
  <rect x="50" y="550" width="700" height="80" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="70" y="575" font-size="13" font-weight="bold" fill="#333">用例汇总：</text>
  <text x="70" y="595" font-size="11" fill="#555">UC-A1 新手首次预约引导 | UC-A2 器材查询 | UC-A3 服务降级处理 | UC-A4 工具函数调用</text>
  <text x="70" y="615" font-size="11" fill="#555">UC-A5 权限与隐私保护 | UC-A6 内容安全过滤 | UC-A7 降级策略配置</text>
</svg>
