
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="900" height="650" fill="#f8fbfe" rx="8"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - 包图</text>

  <!-- com.example.tiyu top-level package -->
  <rect x="50" y="50" width="800" height="570" rx="6" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="70" y="78" font-size="15" font-weight="bold" fill="#333">com.example.tiyu</text>

  <!-- Package: controller -->
  <rect x="80" y="95" width="260" height="155" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <rect x="80" y="95" width="260" height="28" rx="6" fill="#2196F3"/>
  <rect x="80" y="113" width="260" height="10" fill="#2196F3"/>
  <text x="210" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">controller</text>
  <text x="95" y="145" font-size="11" fill="#1565C0">AssistantController</text>
  <text x="95" y="163" font-size="10" fill="#888">← 子系统三核心控制器</text>
  <line x1="95" y1="172" x2="325" y2="172" stroke="#E3F2FD" stroke-width="1"/>
  <text x="95" y="190" font-size="11" fill="#1565C0">VenueController</text>
  <text x="95" y="208" font-size="11" fill="#1565C0">ReservationController</text>
  <text x="95" y="226" font-size="11" fill="#1565C0">CommentController</text>
  <text x="95" y="244" font-size="10" fill="#888">← 子系统一/二控制器</text>

  <!-- Package: service -->
  <rect x="80" y="270" width="260" height="140" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <rect x="80" y="270" width="260" height="28" rx="6" fill="#4CAF50"/>
  <rect x="80" y="288" width="260" height="10" fill="#4CAF50"/>
  <text x="210" y="291" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">service</text>
  <text x="95" y="318" font-size="11" fill="#2E7D32">AssistantService (interface)</text>
  <text x="95" y="336" font-size="10" fill="#888">← 子系统三服务接口</text>
  <line x1="95" y1="345" x2="325" y2="345" stroke="#E8F5E9" stroke-width="1"/>
  <text x="95" y="363" font-size="11" fill="#2E7D32">VenueService (interface)</text>
  <text x="95" y="381" font-size="11" fill="#2E7D32">ReservationService (interface)</text>
  <text x="95" y="399" font-size="10" fill="#888">← 子系统一/二服务</text>

  <!-- Package: service.impl -->
  <rect x="80" y="430" width="260" height="120" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <rect x="80" y="430" width="260" height="28" rx="6" fill="#FF9800"/>
  <rect x="80" y="448" width="260" height="10" fill="#FF9800"/>
  <text x="210" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">service.impl</text>
  <text x="95" y="478" font-size="11" fill="#E65100">AssistantServiceImpl</text>
  <text x="95" y="496" font-size="10" fill="#888">← 子系统三核心实现 (two-tier路由)</text>
  <line x1="95" y1="505" x2="325" y2="505" stroke="#FFF3E0" stroke-width="1"/>
  <text x="95" y="523" font-size="11" fill="#E65100">RuleEngine (Fallback)</text>
  <text x="95" y="541" font-size="11" fill="#E65100">ContentSafetyFilter</text>

  <!-- Package: model.dto -->
  <rect x="390" y="95" width="220" height="130" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <rect x="390" y="95" width="220" height="28" rx="6" fill="#9C27B0"/>
  <rect x="390" y="113" width="220" height="10" fill="#9C27B0"/>
  <text x="500" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">model.dto</text>
  <text x="405" y="142" font-size="11" fill="#6A1B9A">AssistantAskRequest</text>
  <text x="405" y="160" font-size="11" fill="#6A1B9A">AssistantAnswerResponse</text>
  <text x="405" y="178" font-size="11" fill="#6A1B9A">AssistantStatusResponse</text>
  <text x="405" y="196" font-size="11" fill="#6A1B9A">ApiResponse&lt;T&gt;</text>
  <text x="405" y="214" font-size="10" fill="#888">← 子系统三DTO定义</text>

  <!-- Package: model.entity -->
  <rect x="390" y="250" width="220" height="110" rx="6" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <rect x="390" y="250" width="220" height="28" rx="6" fill="#E91E63"/>
  <rect x="390" y="268" width="220" height="10" fill="#E91E63"/>
  <text x="500" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">model.entity</text>
  <text x="405" y="300" font-size="11" fill="#C2185B">SessionRecord</text>
  <text x="405" y="318" font-size="11" fill="#C2185B">ToolCallLog</text>
  <text x="405" y="336" font-size="11" fill="#C2185B">UserFeedback</text>
  <text x="405" y="354" font-size="10" fill="#888">← 子系统三数据实体</text>

  <!-- Package: config -->
  <rect x="390" y="385" width="220" height="80" rx="6" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="2"/>
  <rect x="390" y="385" width="220" height="28" rx="6" fill="#9E9E9E"/>
  <rect x="390" y="403" width="220" height="10" fill="#9E9E9E"/>
  <text x="500" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">config</text>
  <text x="405" y="435" font-size="11" fill="#616161">AssistantConfig</text>
  <text x="405" y="453" font-size="11" fill="#616161">SecurityConfig</text>

  <!-- Package: security (shared across subsystems) -->
  <rect x="660" y="95" width="170" height="100" rx="6" fill="#FFFDE7" stroke="#F9A825" stroke-width="2"/>
  <rect x="660" y="95" width="170" height="28" rx="6" fill="#F9A825"/>
  <rect x="660" y="113" width="170" height="10" fill="#F9A825"/>
  <text x="745" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">security</text>
  <text x="675" y="142" font-size="11" fill="#F57F17">JwtTokenProvider</text>
  <text x="675" y="160" font-size="11" fill="#F57F17">JwtAuthFilter</text>
  <text x="675" y="178" font-size="11" fill="#F57F17">UserDetailsServiceImpl</text>

  <!-- Dependency arrows -->
  <line x1="210" y1="250" x2="210" y2="270" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="220" y="263" font-size="9" fill="#555">import</text>

  <line x1="340" y1="150" x2="390" y2="150" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>

  <line x1="340" y1="400" x2="390" y2="320" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>

  <line x1="340" y1="470" x2="390" y2="420" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>

  <line x1="610" y1="160" x2="660" y2="160" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- Legend with subsystem highlights -->
  <rect x="390" y="490" width="440" height="130" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="410" y="515" font-size="13" font-weight="bold" fill="#333">子系统归属说明：</text>
  <text x="410" y="538" font-size="11" fill="#555">■ controller/AssistantController → 子系统三</text>
  <text x="410" y="558" font-size="11" fill="#555">■ service/AssistantService, service/impl/AssistantServiceImpl → 子系统三</text>
  <text x="410" y="578" font-size="11" fill="#555">■ model.dto/(Assistant*) → 子系统三</text>
  <text x="410" y="598" font-size="11" fill="#555">■ model.entity/(SessionRecord, ToolCallLog, UserFeedback) → 子系统三</text>
  <text x="410" y="618" font-size="11" fill="#555">■ controller/(Venue*,Reservation*) → 子系统一/二    ■ security → 共享模块</text>
</svg>
