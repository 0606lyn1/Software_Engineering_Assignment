
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="650" fill="#f8fbfe" rx="8"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - 部署图</text>

  <!-- Node: Client Browser -->
  <rect x="30" y="55" width="280" height="200" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2.5"/>
  <text x="40" y="80" font-size="15" font-weight="bold" fill="#1565C0">«device» 用户浏览器</text>
  <line x1="30" y1="90" x2="310" y2="90" stroke="#2196F3" stroke-width="1"/>

  <rect x="50" y="105" width="240" height="55" rx="5" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="170" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">「artifact」Vue3 SPA</text>
  <text x="60" y="145" font-size="10" fill="#555">SmartAssistant.vue</text>
  <text x="180" y="145" font-size="10" fill="#555">oh-my-live2d</text>

  <rect x="50" y="170" width="240" height="38" rx="5" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="170" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">«artifact» TypeScript API Client</text>
  <text x="170" y="204" text-anchor="middle" font-size="10" fill="#555">askAssistant() / getAssistantStatus()</text>

  <rect x="50" y="218" width="240" height="28" rx="5" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="170" y="237" text-anchor="middle" font-size="11" fill="#1565C0">Pinia State (assistantStore)</text>

  <!-- Node: Backend Server -->
  <rect x="360" y="55" width="280" height="320" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="370" y="80" font-size="15" font-weight="bold" fill="#2E7D32">«server» 后端应用服务器</text>
  <line x1="360" y1="90" x2="640" y2="90" stroke="#4CAF50" stroke-width="1"/>

  <rect x="380" y="105" width="240" height="45" rx="5" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="500" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">«artifact» Spring Boot 3.4.4</text>
  <text x="500" y="140" text-anchor="middle" font-size="10" fill="#555">AssistantController + AssistantService</text>

  <rect x="380" y="162" width="240" height="45" rx="5" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="500" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">«artifact» AssistantServiceImpl</text>
  <text x="500" y="197" text-anchor="middle" font-size="10" fill="#555">two-tier路由 + Prompt构建 + Fallback</text>

  <rect x="380" y="220" width="240" height="45" rx="5" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="500" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">«artifact» Spring Security + JWT</text>
  <text x="500" y="255" text-anchor="middle" font-size="10" fill="#555">认证拦截 + 权限校验</text>

  <rect x="380" y="278" width="240" height="45" rx="5" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="500" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">«database» MySQL 8.4</text>
  <text x="500" y="313" text-anchor="middle" font-size="10" fill="#555">SessionRecord | ToolCallLog | UserFeedback</text>

  <!-- Node: DeepSeek Cloud API -->
  <rect x="690" y="55" width="280" height="180" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2.5"/>
  <text x="700" y="80" font-size="15" font-weight="bold" fill="#E65100">«cloud» DeepSeek API 云端</text>
  <line x1="690" y1="90" x2="970" y2="90" stroke="#FF9800" stroke-width="1"/>

  <rect x="710" y="105" width="240" height="55" rx="5" fill="#FFE0B2" stroke="#FF9800" stroke-width="1.5"/>
  <text x="830" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">«service» deepseek-chat</text>
  <text x="720" y="145" font-size="10" fill="#555">POST /v1/chat/completions</text>
  <text x="870" y="145" font-size="10" fill="#555">Timeout: 25s</text>

  <rect x="710" y="172" width="240" height="55" rx="5" fill="#FFE0B2" stroke="#FF9800" stroke-width="1.5"/>
  <text x="830" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">«service» 备用API端点</text>
  <text x="720" y="212" font-size="10" fill="#555">自动切换降级</text>

  <!-- Node: Subsystem1 API -->
  <rect x="690" y="270" width="280" height="85" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="700" y="295" font-size="14" font-weight="bold" fill="#2E7D32">«server» 子系统一 API</text>
  <text x="710" y="318" font-size="10" fill="#555">ReservationAPI</text>
  <text x="710" y="332" font-size="10" fill="#555">GET /reservations → 预约查询</text>
  <text x="710" y="346" font-size="10" fill="#555">GET /venues/available → 空闲查询</text>

  <!-- Node: Subsystem2 API -->
  <rect x="690" y="370" width="280" height="85" rx="8" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="700" y="395" font-size="14" font-weight="bold" fill="#C2185B">«server» 子系统二 API</text>
  <text x="710" y="418" font-size="10" fill="#555">VenueAPI</text>
  <text x="710" y="432" font-size="10" fill="#555">GET /venues/{id} → 场馆详情</text>
  <text x="710" y="446" font-size="10" fill="#555">GET /venues/{id}/equipment → 器材配置</text>

  <!-- Communication lines -->
  <!-- Browser → Backend -->
  <line x1="310" y1="160" x2="360" y2="160" stroke="#333" stroke-width="2"/>
  <text x="340" y="152" font-size="10" fill="#555">HTTPS</text>
  <text x="340" y="178" font-size="10" fill="#555">REST</text>

  <!-- Backend → DeepSeek -->
  <line x1="640" y1="150" x2="690" y2="150" stroke="#E65100" stroke-width="2"/>
  <text x="660" y="142" font-size="10" fill="#E65100">HTTPS</text>

  <!-- Backend → Subsystem1 -->
  <line x1="640" y1="180" x2="690" y2="310" stroke="#2E7D32" stroke-width="2"/>
  <text x="660" y="250" font-size="10" fill="#2E7D32">HTTP</text>

  <!-- Backend → Subsystem2 -->
  <line x1="640" y1="200" x2="690" y2="410" stroke="#C2185B" stroke-width="2"/>
  <text x="660" y="320" font-size="10" fill="#C2185B">HTTP</text>

  <!-- Node: Admin Terminal -->
  <rect x="30" y="290" width="280" height="85" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="40" y="315" font-size="14" font-weight="bold" fill="#6A1B9A">«device» 管理员终端</text>
  <rect x="50" y="330" width="240" height="35" rx="5" fill="#E1BEE7" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="170" y="352" text-anchor="middle" font-size="11" fill="#6A1B9A">YAML配置管理 + 环境变量</text>

  <line x1="310" y1="320" x2="360" y2="380" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="330" y="355" font-size="10" fill="#9C27B0">SSH/Config</text>

  <!-- Legend -->
  <rect x="30" y="500" width="940" height="130" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="525" font-size="13" font-weight="bold" fill="#333">部署架构说明：</text>
  <text x="50" y="550" font-size="11" fill="#555">• 用户浏览器：部署Vue3编译后的静态资源（SmartAssistant.vue + oh-my-live2d库），通过HTTPS与后端通信。</text>
  <text x="50" y="570" font-size="11" fill="#555">• 后端应用服务器：部署Spring Boot 3.4.4（内嵌Tomcat），构建为Spring Boot可执行JAR。MySQL 8.4数据库存储会话与工具调用记录。</text>
  <text x="50" y="590" font-size="11" fill="#555">• DeepSeek API：云端SaaS服务，模型deepseek-chat通过HTTPS调用。API Key仅存在于服务器环境变量DEEPSEEK_API_KEY。</text>
  <text x="50" y="610" font-size="11" fill="#555">• 子系统一/二：部署在同一数据中心内部网络，通过HTTP内网调用，降低延迟并保证数据安全。</text>
</svg>
