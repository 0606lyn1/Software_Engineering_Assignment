
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="620" fill="#f8fbfe" rx="8"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - 构件图</text>

  <!-- SmartAssistant Component -->
  <rect x="30" y="55" width="200" height="110" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <rect x="30" y="55" width="200" height="28" rx="6" fill="#2196F3"/>
  <rect x="30" y="73" width="200" height="10" fill="#2196F3"/>
  <text x="130" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">«component»</text>
  <text x="130" y="92" text-anchor="middle" font-size="12" fill="#fff">SmartAssistant</text>
  <text x="45" y="108" font-size="10" fill="#1565C0">SmartAssistant.vue</text>
  <text x="45" y="122" font-size="10" fill="#1565C0">oh-my-live2d (shizuku/hijiki)</text>
  <text x="45" y="136" font-size="10" fill="#1565C0">SmartChatPanel</text>
  <text x="45" y="150" font-size="10" fill="#1565C0">StatusIndicator</text>

  <polygon x="30" y="165" points="no"/>

  <!-- Provided Interface (from SmartAssistant) -->
  <rect x="30" y="195" width="200" height="45" rx="15" fill="#BBDEFB" stroke="#2196F3" stroke-width="1.5"/>
  <text x="130" y="213" text-anchor="middle" font-size="10" fill="#1565C0">«interface» ClickToChat</text>
  <text x="130" y="228" text-anchor="middle" font-size="10" fill="#1565C0">openPanel() | closePanel()</text>

  <!-- Required Interface -->
  <rect x="30" y="255" width="200" height="45" rx="15" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/>
  <text x="130" y="273" text-anchor="middle" font-size="10" fill="#F57F17">«interface» AssistantAPI</text>
  <text x="130" y="288" text-anchor="middle" font-size="10" fill="#F57F17">POST /ask | GET /status</text>

  <!-- AssistantAPI Component -->
  <rect x="350" y="55" width="200" height="110" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <rect x="350" y="55" width="200" height="28" rx="6" fill="#4CAF50"/>
  <rect x="350" y="73" width="200" height="10" fill="#4CAF50"/>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">«component»</text>
  <text x="450" y="92" text-anchor="middle" font-size="12" fill="#fff">AssistantAPI</text>
  <text x="365" y="108" font-size="10" fill="#2E7D32">AssistantController</text>
  <text x="365" y="122" font-size="10" fill="#2E7D32">AssistantServiceImpl</text>
  <text x="365" y="136" font-size="10" fill="#2E7D32">AssistantService (interface)</text>
  <text x="365" y="150" font-size="10" fill="#2E7D32">AssistantAskRequest/Response</text>

  <!-- Provided Interface (AssistantAPI) -->
  <rect x="350" y="195" width="220" height="45" rx="15" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="460" y="213" text-anchor="middle" font-size="10" fill="#2E7D32">«interface» AssistantProvider</text>
  <text x="460" y="228" text-anchor="middle" font-size="10" fill="#2E7D32">answer(question) → ApiResponse</text>

  <!-- DeepSeekProxy Component -->
  <rect x="650" y="55" width="200" height="110" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <rect x="650" y="55" width="200" height="28" rx="6" fill="#FF9800"/>
  <rect x="650" y="73" width="200" height="10" fill="#FF9800"/>
  <text x="750" y="76" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">«component»</text>
  <text x="750" y="92" text-anchor="middle" font-size="12" fill="#fff">DeepSeekProxy</text>
  <text x="665" y="108" font-size="10" fill="#E65100">HTTP Client (RestTemplate)</text>
  <text x="665" y="122" font-size="10" fill="#E65100">PromptBuilder</text>
  <text x="665" y="136" font-size="10" fill="#E65100">ResponseParser</text>
  <text x="665" y="150" font-size="10" fill="#E65100">TimeoutManager (25s)</text>

  <!-- RuleEngine Component -->
  <rect x="350" y="285" width="200" height="90" rx="6" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <rect x="350" y="285" width="200" height="28" rx="6" fill="#9C27B0"/>
  <rect x="350" y="303" width="200" height="10" fill="#9C27B0"/>
  <text x="450" y="308" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">«component»</text>
  <text x="450" y="324" text-anchor="middle" font-size="12" fill="#fff">RuleEngine</text>
  <text x="365" y="340" font-size="10" fill="#6A1B9A">KeywordMatcher</text>
  <text x="365" y="354" font-size="10" fill="#6A1B9A">FAQRepository</text>
  <text x="365" y="368" font-size="10" fill="#6A1B9A">ContentSafetyFilter</text>

  <!-- Subsystem1Gateway Component -->
  <rect x="650" y="260" width="200" height="75" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <rect x="650" y="260" width="200" height="28" rx="6" fill="#4CAF50"/>
  <rect x="650" y="278" width="200" height="10" fill="#4CAF50"/>
  <text x="750" y="283" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">«component»</text>
  <text x="750" y="299" text-anchor="middle" font-size="12" fill="#fff">Subsystem1Gateway</text>
  <text x="665" y="318" font-size="10" fill="#2E7D32">ReservationAPI Client</text>

  <!-- Subsystem2Gateway Component -->
  <rect x="650" y="360" width="200" height="75" rx="6" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <rect x="650" y="360" width="200" height="28" rx="6" fill="#E91E63"/>
  <rect x="650" y="378" width="200" height="10" fill="#E91E63"/>
  <text x="750" y="383" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">«component»</text>
  <text x="750" y="399" text-anchor="middle" font-size="12" fill="#fff">Subsystem2Gateway</text>
  <text x="665" y="418" font-size="10" fill="#C2185B">VenueAPI Client</text>

  <!-- MySQL Database Component -->
  <rect x="30" y="350" width="200" height="75" rx="6" fill="#ECEFF1" stroke="#78909C" stroke-width="2"/>
  <rect x="30" y="350" width="200" height="28" rx="6" fill="#78909C"/>
  <rect x="30" y="368" width="200" height="10" fill="#78909C"/>
  <text x="130" y="373" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">«component»</text>
  <text x="130" y="389" text-anchor="middle" font-size="12" fill="#fff">MySQL DB</text>
  <text x="45" y="408" font-size="10" fill="#546E7A">SessionRecord | ToolCallLog | UserFeedback</text>

  <!-- Connections between components -->
  <!-- SmartAssistant --> AssistantAPI -->
  <line x1="230" y1="150" x2="350" y2="110" stroke="#333" stroke-width="1.5"/>
  <text x="270" y="125" font-size="9" fill="#555">HTTP POST/GET</text>

  <!-- SmartAssistant requires interface consumed by AssistantAPI -->
  <line x1="230" y1="278" x2="350" y2="218" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- AssistantAPI → DeepSeekProxy -->
  <line x1="550" y1="110" x2="650" y2="110" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="102" font-size="9" fill="#555">HTTPS POST</text>

  <!-- AssistantAPI → RuleEngine -->
  <line x1="450" y1="165" x2="450" y2="285" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="230" font-size="9" fill="#555">keywordMatch()</text>

  <!-- AssistantAPI → Subsystem1Gateway -->
  <line x1="550" y1="130" x2="650" y2="290" stroke="#333" stroke-width="1.5"/>

  <!-- AssistantAPI → Subsystem2Gateway -->
  <line x1="550" y1="140" x2="650" y2="390" stroke="#333" stroke-width="1.5"/>

  <!-- AssistantAPI → MySQL -->
  <line x1="350" y1="160" x2="230" y2="380" stroke="#333" stroke-width="1.5"/>

  <!-- Deployment boundary -->
  <rect x="15" y="470" width="970" height="130" rx="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="30" y="495" font-size="13" font-weight="bold" fill="#666">部署边界</text>
  <rect x="30" y="505" width="310" height="25" rx="4" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="185" y="522" text-anchor="middle" font-size="11" fill="#1565C0">浏览器 (用户终端) → SmartAssistant</text>
  <rect x="370" y="505" width="280" height="25" rx="4" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="510" y="522" text-anchor="middle" font-size="11" fill="#2E7D32">后端服务器 → AssistantAPI + RuleEngine + MySQL</text>
  <rect x="670" y="505" width="300" height="25" rx="4" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="820" y="522" text-anchor="middle" font-size="11" fill="#E65100">云端 → DeepSeekProxy + Subsystem1/2 Gateway</text>

  <rect x="30" y="538" width="940" height="55" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="558" font-size="11" fill="#555">构件间协作流程：1.用户点击Live2D→SmartAssistant.openPanel() 2.输入问题→POST /ask→AssistantController</text>
  <text x="50" y="578" font-size="11" fill="#555">3. AssistantServiceImpl.two-tier路由→[DeepSeekProxy HTTP调用]或[RuleEngine.keywordMatch] 4.工具调用→Subsystem1/2Gateway查询</text>
</svg>
