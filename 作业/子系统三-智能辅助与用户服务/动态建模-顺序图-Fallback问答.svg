
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <marker id="aw" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="650" fill="#f8fbfe" rx="8"/>
  <text x="500" y="25" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - 顺序图（Fallback降级模式）</text>

  <!-- Lifeline headers -->
  <rect x="30" y="50" width="100" height="35" rx="5" fill="#6C63FF"/>
  <text x="80" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">User</text>

  <rect x="210" y="50" width="110" height="35" rx="5" fill="#2196F3"/>
  <text x="265" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">SmartAssistant</text>

  <rect x="400" y="50" width="120" height="35" rx="5" fill="#4CAF50"/>
  <text x="460" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">AsstController</text>

  <rect x="600" y="50" width="120" height="35" rx="5" fill="#FF9800"/>
  <text x="660" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">AsstService</text>

  <rect x="800" y="50" width="120" height="35" rx="5" fill="#9C27B0"/>
  <text x="860" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">RuleEngine</text>

  <!-- Lifelines -->
  <line x1="80" y1="85" x2="80" y2="600" stroke="#6C63FF" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="265" y1="85" x2="265" y2="600" stroke="#2196F3" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="460" y1="85" x2="460" y2="600" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="660" y1="85" x2="660" y2="600" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="860" y1="85" x2="860" y2="600" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Messages -->
  <line x1="80" y1="110" x2="265" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="120" y="103" font-size="10" fill="#555">1.提问"如何预约场地"</text>

  <line x1="265" y1="135" x2="460" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="350" y="128" font-size="10" fill="#555">2.POST /ask {question}</text>

  <rect x="455" y="135" width="10" height="80" fill="#4CAF50" opacity="0.3"/>
  <rect x="455" y="270" width="10" height="20" fill="#4CAF50" opacity="0.3"/>

  <line x1="460" y1="155" x2="660" y2="155" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="540" y="148" font-size="10" fill="#555">3.answer(q,username,role)</text>

  <rect x="655" y="155" width="10" height="80" fill="#FF9800" opacity="0.3"/>
  <rect x="655" y="290" width="10" height="20" fill="#FF9800" opacity="0.3"/>

  <!-- checkDeepSeekAvailability → false -->
  <text x="670" y="175" font-size="9" fill="#F44336">checkDeepSeekAvailability()</text>
  <text x="670" y="190" font-size="9" fill="#F44336">→ false (KEY未配置/超时)</text>

  <!-- Route to RuleEngine -->
  <line x1="660" y1="200" x2="860" y2="200" stroke="#9C27B0" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="740" y="193" font-size="10" fill="#9C27B0">4.keywordMatch(q)</text>

  <rect x="855" y="200" width="10" height="50" fill="#9C27B0" opacity="0.3"/>

  <text x="870" y="218" font-size="9" fill="#9C27B0">匹配"预约"→</text>
  <text x="870" y="232" font-size="9" fill="#9C27B0">"预约操作指南"</text>

  <line x1="860" y1="255" x2="660" y2="255" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="740" y="248" font-size="10" fill="#555">5.staticFAQ text</text>

  <text x="670" y="273" font-size="9" fill="#555">buildFallbackAnswer()</text>

  <line x1="660" y1="280" x2="460" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="540" y="273" font-size="10" fill="#555">6.AssistantAnswerResponse</text>
  <text x="545" y="288" font-size="9" fill="#999">(provider="fallback")</text>

  <line x1="460" y1="300" x2="265" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="350" y="293" font-size="10" fill="#555">7.ApiResponse&lt;Answer&gt;</text>

  <rect x="260" y="300" width="10" height="40" fill="#2196F3" opacity="0.3"/>

  <line x1="265" y1="340" x2="80" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="160" y="333" font-size="10" fill="#555">8.渲染FAQ回答</text>

  <!-- UI updates -->
  <text x="80" y="365" font-size="10" fill="#F44336">前端状态指示器→黄色</text>
  <text x="80" y="380" font-size="10" fill="#555">"抱歉，AI助手暂时不可用。"</text>
  <text x="80" y="395" font-size="10" fill="#555">"预约流程：1.登录 2.选类型</text>
  <text x="80" y="410" font-size="10" fill="#555">3.查看空闲 4.确认预约"</text>
  <text x="80" y="425" font-size="10" fill="#555">"人工客服：010-12345678"</text>

  <!-- Response DTO -->
  <rect x="30" y="455" width="940" height="80" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="478" font-size="12" font-weight="bold" fill="#9C27B0">Fallback模式关键属性：</text>
  <text x="50" y="498" font-size="11" fill="#555">• DEEPSEEK_API_KEY 未配置 或 DeepSeek服务状态为 OFFLINE/DEGRADED → provider="fallback"</text>
  <text x="50" y="518" font-size="11" fill="#555">• keywordMatch() 基于关键词分类匹配：登录/注册FAQ、预约指南、评论规则、管理员操作、器材与定价</text>
  <text x="50" y="538" font-size="11" fill="#555">• 规则引擎无匹配时返回通用回答 + 人工客服联系电话，响应时间 <500ms</text>

  <!-- Comparison Box -->
  <rect x="30" y="550" width="940" height="80" rx="6" fill="#FFFDE7" stroke="#F9A825" stroke-width="1"/>
  <text x="50" y="573" font-size="12" font-weight="bold" fill="#F57F17">DeepSeek模式 vs Fallback模式对比：</text>
  <text x="50" y="595" font-size="11" fill="#555">DeepSeek: 答案动态生成、含deeplink、provider="deepseek"、token消耗可追踪 | Fallback: 答案静态预定义、无deeplink、provider="fallback"、零token消耗</text>
  <text x="50" y="615" font-size="11" fill="#555">前端状态指示器：DeepSeek→绿色圆点 | Fallback→黄色圆点 | 免责声明"仅供参考"两种模式均显示</text>
</svg>
