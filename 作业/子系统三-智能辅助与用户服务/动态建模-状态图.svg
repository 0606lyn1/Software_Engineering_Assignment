
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <marker id="az" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <style>text{font-family:"Microsoft YaHei","SimHei",sans-serif}</style>
  </defs>
  <rect width="1000" height="650" fill="#f8fbfe" rx="8"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">子系统三 - DeepSeek服务状态图 + 对话会话状态图</text>

  <!-- ==================== DeepSeek Service ==================== -->
  <text x="250" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#6C63FF">DeepSeek服务状态图</text>

  <!-- Initial -->
  <circle cx="60" cy="130" r="15" fill="#333"/>
  <text x="50" y="155" text-anchor="middle" font-size="10" fill="#555">启动</text>
  <line x1="75" y1="130" x2="150" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#az)"/>

  <!-- State: ONLINE -->
  <rect x="160" y="90" width="200" height="80" rx="40" fill="#C8E6C9" stroke="#4CAF50" stroke-width="3"/>
  <text x="260" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#2E7D32">ONLINE</text>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#555">正常响应 (延迟&lt;5s)</text>
  <text x="260" y="158" text-anchor="middle" font-size="10" fill="#888">entry / startHealthCheck</text>

  <!-- State: DEGRADED -->
  <rect x="160" y="230" width="220" height="90" rx="40" fill="#FFF3E0" stroke="#FF9800" stroke-width="3"/>
  <text x="270" y="260" text-anchor="middle" font-size="17" font-weight="bold" fill="#E65100">DEGRADED</text>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#555">部分超时，仍尝试调用</text>
  <text x="270" y="300" text-anchor="middle" font-size="10" fill="#888">do / monitorLatency</text>
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#888">exit / resetFailCounter</text>

  <!-- State: OFFLINE -->
  <rect x="500" y="90" width="220" height="80" rx="40" fill="#FFCDD2" stroke="#F44336" stroke-width="3"/>
  <text x="610" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#C62828">OFFLINE</text>
  <text x="610" y="140" text-anchor="middle" font-size="11" fill="#555">纯Fallback模式</text>
  <text x="610" y="158" text-anchor="middle" font-size="10" fill="#888">entry / enableFallbackMode</text>

  <!-- Transitions - DeepSeek -->
  <!-- ONLINE → DEGRADED -->
  <line x1="260" y1="170" x2="270" y2="230" stroke="#E65100" stroke-width="2" marker-end="url(#az)"/>
  <text x="280" y="205" font-size="10" fill="#E65100">连续3次超时(>25s)</text>

  <!-- DEGRADED → ONLINE -->
  <line x1="160" y1="250" x2="360" y2="170" stroke="#2E7D32" stroke-width="1.8"/>
  <line x1="360" y1="170" x2="355" y2="170" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#az)"/>
  <text x="220" y="200" font-size="10" fill="#2E7D32">任一请求成功(&lt;5s)</text>

  <!-- DEGRADED → OFFLINE -->
  <line x1="380" y1="275" x2="500" y2="120" stroke="#C62828" stroke-width="2" marker-end="url(#az)"/>
  <text x="430" y="190" font-size="10" fill="#C62828">5xx连续失败3次</text>

  <!-- OFFLINE → ONLINE -->
  <path d="M500 150 C420 150, 400 240, 360 200" fill="none" stroke="#2E7D32" stroke-width="1.8"/>
  <line x1="360" y1="200" x2="340" y2="175" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#az)"/>
  <text x="420" y="175" font-size="10" fill="#2E7D32">健康检查通过</text>

  <!-- ==================== Session State ==================== -->
  <line x1="30" y1="370" x2="970" y2="370" stroke="#ccc" stroke-width="1" stroke-dasharray="8,4"/>

  <text x="250" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#9C27B0">对话会话状态图</text>

  <!-- Session Initial -->
  <circle cx="60" cy="470" r="15" fill="#333"/>
  <line x1="75" y1="470" x2="140" y2="470" stroke="#333" stroke-width="1.5" marker-end="url(#az)"/>

  <!-- State: CREATED -->
  <rect x="150" y="440" width="180" height="60" rx="30" fill="#E3F2FD" stroke="#2196F3" stroke-width="2.5"/>
  <text x="240" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">CREATED</text>
  <text x="240" y="488" text-anchor="middle" font-size="10" fill="#555">entry/createSession</text>

  <!-- State: ACTIVE -->
  <rect x="420" y="440" width="180" height="60" rx="30" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="510" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D32">ACTIVE</text>
  <text x="510" y="488" text-anchor="middle" font-size="10" fill="#555">do/resetTimer</text>

  <!-- State: EXPIRED -->
  <rect x="280" y="550" width="200" height="60" rx="30" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2.5"/>
  <text x="380" y="578" text-anchor="middle" font-size="15" font-weight="bold" fill="#6A1B9A">EXPIRED</text>
  <text x="380" y="598" text-anchor="middle" font-size="10" fill="#555">30min无活动 → 过期</text>

  <!-- State: CLOSED -->
  <rect x="560" y="550" width="180" height="60" rx="30" fill="#ECEFF1" stroke="#78909C" stroke-width="2.5"/>
  <text x="650" y="578" text-anchor="middle" font-size="15" font-weight="bold" fill="#546E7A">CLOSED</text>
  <text x="650" y="598" text-anchor="middle" font-size="10" fill="#555">用户主动关闭</text>

  <!-- Transitions - Session -->
  <line x1="330" y1="470" x2="420" y2="470" stroke="#2E7D32" stroke-width="2" marker-end="url(#az)"/>
  <text x="365" y="462" font-size="10" fill="#2E7D32">发送首条消息</text>

  <line x1="510" y1="500" x2="400" y2="550" stroke="#6A1B9A" stroke-width="2" marker-end="url(#az)"/>
  <text x="435" y="530" font-size="10" fill="#6A1B9A">30min无交互</text>

  <line x1="380" y1="550" x2="450" y2="500" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#az)" stroke-dasharray="5,3"/>
  <text x="510" y="535" font-size="9" fill="#2E7D32">用户重新提问(重新激活)</text>

  <line x1="540" y1="470" x2="560" y2="520" stroke="#78909C" stroke-width="1.5" marker-end="url(#az)"/>
  <text x="570" y="500" font-size="10" fill="#78909C">关闭面板</text>

  <!-- Legend -->
  <rect x="30" y="15" width="500" height="22" rx="4" fill="#f0f0f0"/>
  <text x="50" y="31" font-size="10" fill="#555">状态图说明：entry=进入动作 do=持续执行活动 exit=退出动作 [条件]=迁移触发条件</text>
</svg>
