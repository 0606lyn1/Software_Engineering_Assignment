<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250">
<title>子系统二：活动图-用户发表评论</title>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FBFF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#EEF4FA" stroke-width="1"/></pattern>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#375A7F"/>
</marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#C56A1A"/>
</marker>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#94A3B8" flood-opacity=".28"/></filter>
</defs>
<rect x="0" y="0" width="1500" height="1250" fill="#FFFFFF"/>
<rect x="26" y="24" width="1448" height="1202" rx="16" fill="url(#paper)" stroke="#D9E2EC" stroke-width="2"/>
<rect x="42" y="124" width="1416" height="1074" fill="url(#grid)" opacity=".55"/>
<rect x="540" y="36" width="420" height="5" rx="3" fill="#2F80ED"/>
<text x="750" y="78" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="34" font-weight="700" fill="#173A5E">子系统二：活动图-用户发表评论</text>
<text x="750" y="112" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#64748B">UML活动图：业务流程、分支与结束点</text>
<rect x="80" y="120" width="410" height="1020" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="2"/>
<rect x="545" y="120" width="410" height="1020" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
<rect x="1010" y="120" width="410" height="1020" fill="#F8FBFF" stroke="#D9E2EC" stroke-width="2"/>
<text x="285" y="150" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#173A5E">用户操作</text>
<text x="750" y="150" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#173A5E">系统校验与处理</text>
<text x="1215" y="150" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="700" fill="#173A5E">结果反馈/异常路径</text>
<circle cx="750" cy="190" r="24" fill="#172033"/>
<text x="750" y="236" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#172033">开始</text>
<rect x="650" y="290" width="200" height="78" rx="10" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="668" y="322" font-size="16" font-weight="700" fill="#172033"><tspan x="668" dy="0">登录并选择场地</tspan></text>
<rect x="650" y="430" width="200" height="78" rx="10" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="668" y="462" font-size="16" font-weight="700" fill="#172033"><tspan x="668" dy="0">填写评分和评论</tspan></text>
<path d="M750,570 L870,630 L750,690 L630,630 Z" fill="#FFF8ED" stroke="#C56A1A" stroke-width="2" filter="url(#shadow)"/>
<text x="685" y="625" font-size="15" font-weight="700" fill="#172033"><tspan x="685" dy="0">内容是否合规</tspan></text>
<rect x="650" y="720" width="200" height="78" rx="10" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="668" y="752" font-size="16" font-weight="700" fill="#172033"><tspan x="668" dy="0">保存并展示评论</tspan></text>
<rect x="360" y="890" width="200" height="78" rx="10" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="378" y="922" font-size="16" font-weight="700" fill="#172033"><tspan x="378" dy="0">提示修改内容</tspan></text>
<rect x="930" y="890" width="200" height="78" rx="10" fill="#EAF4FF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="948" y="922" font-size="16" font-weight="700" fill="#172033"><tspan x="948" dy="0">负面反馈生成待办</tspan></text>
<circle cx="750" cy="1100" r="28" fill="none" stroke="#172033" stroke-width="3"/><circle cx="750" cy="1100" r="18" fill="#172033"/>
<text x="750" y="1150" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" fill="#172033">结束</text>
<line x1="750" y1="190" x2="750" y2="330" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="750" y1="330" x2="750" y2="470" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="750" y1="470" x2="750" y2="610" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="658" y="518" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="750" y="537" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">提交审核</text>
<line x1="750" y1="610" x2="750" y2="760" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="658" y="663" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="750" y="682" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">合规</text>
<line x1="750" y1="610" x2="460" y2="930" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="513" y="748" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="605" y="767" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">违规</text>
<line x1="460" y1="930" x2="750" y2="470" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="513" y="678" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="605" y="697" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">修改后重交</text>
<line x1="750" y1="760" x2="1030" y2="930" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="798" y="823" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="890" y="842" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">低分/负面</text>
<line x1="1030" y1="930" x2="750" y2="1100" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="750" y1="760" x2="750" y2="1100" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="658" y="908" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="750" y="927" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">普通评论</text>
<rect x="90" y="1010" width="330" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2" filter="url(#shadow)"/>
<text x="108" y="1042" font-size="15" font-weight="700" fill="#172033"><tspan x="108" dy="0">用户侧关注</tspan></text>
<text x="108" y="1074" font-size="14" font-weight="400" fill="#172033"><tspan x="108" dy="0">操作入口清晰；错误可返回修改；结果需要明确展示</tspan></text>
<rect x="1060" y="1010" width="320" height="95" rx="10" fill="#FFF8ED" stroke="#C56A1A" stroke-width="2" filter="url(#shadow)"/>
<text x="1078" y="1042" font-size="15" font-weight="700" fill="#172033"><tspan x="1078" dy="0">系统侧约束</tspan></text>
<text x="1078" y="1074" font-size="14" font-weight="400" fill="#172033"><tspan x="1078" dy="0">权限校验、状态判断、写入日志、通知联动均需闭环</tspan></text>
<text x="1446" y="1208" text-anchor="end" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#94A3B8">SVG / Visio style / latest system model</text>
</svg>