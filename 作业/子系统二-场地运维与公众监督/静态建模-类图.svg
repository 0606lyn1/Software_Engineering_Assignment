<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .class-title { font-size: 12px; font-weight: bold; }
      .attr { font-size: 10px; fill: #333; }
      .method { font-size: 10px; fill: #1565C0; font-style: italic; }
      .rel-label { font-size: 10px; fill: #555; }
    </style>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.1"/></filter>
    <marker id="arrowD" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1976D2"/></marker>
    <marker id="arrowT" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7B1FA2"/></marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#E65100"/></marker>
  </defs>
  <rect width="1000" height="650" fill="#FAFBFC" rx="8"/>

  <text x="500" y="28" text-anchor="middle" class="title">子系统二——场地运维与公众监督系统 类图 (UML Class Diagram)</text>
  <line x1="100" y1="40" x2="900" y2="40" stroke="#4A90D9" stroke-width="1.5"/>

  <!-- ========== VenueOps Entity ========== -->
  <rect x="30" y="55" width="220" height="280" rx="4" fill="#fff" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="55" width="220" height="28" rx="4" fill="#1976D2"/>
  <text x="140" y="73" text-anchor="middle" class="class-title" fill="#fff">«实体» VenueOps</text>
  <rect x="30" y="83" width="220" height="190" fill="#fff"/>
  <text x="42" y="100" class="attr">- id: Long (PK)</text>
  <text x="42" y="116" class="attr">- venueId: Long (FK)</text>
  <text x="42" y="132" class="attr">- maintenanceStatus: Enum</text>
  <text x="42" y="148" class="attr">- cleaningStatus: Enum</text>
  <text x="42" y="164" class="attr">- lightingStatus: Enum</text>
  <text x="42" y="180" class="attr">- reservationPolicy: Enum</text>
  <text x="42" y="196" class="attr">- responsibleName: String</text>
  <text x="42" y="212" class="attr">- responsibleRole: String</text>
  <text x="42" y="228" class="attr">- responsiblePhone: String</text>
  <text x="42" y="244" class="attr">- equipmentPolicy: String</text>
  <text x="42" y="260" class="attr">- selfEquipmentRequired: Boolean</text>
  <text x="42" y="276" class="attr">- selfEquipmentList: String</text>
  <rect x="30" y="273" width="220" height="62" fill="#E3F2FD"/>
  <text x="42" y="292" class="method">+ getId(): Long</text>
  <text x="42" y="308" class="method">+ getVenueId(): Long</text>
  <text x="42" y="324" class="method">+ getMaintenanceStatus(): Enum</text>

  <!-- ========== Comment Entity ========== -->
  <rect x="340" y="55" width="200" height="155" rx="4" fill="#fff" stroke="#F57C00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="55" width="200" height="28" rx="4" fill="#F57C00"/>
  <text x="440" y="73" text-anchor="middle" class="class-title" fill="#fff">«实体» Comment</text>
  <rect x="340" y="83" width="200" height="65" fill="#fff"/>
  <text x="352" y="100" class="attr">- id: Long (PK)</text>
  <text x="352" y="116" class="attr">- userId: Long (FK)</text>
  <text x="352" y="132" class="attr">- venueId: Long (FK)</text>
  <text x="352" y="148" class="attr">- rating: Integer (1-5)</text>
  <rect x="340" y="148" width="200" height="62" fill="#FFF3E0"/>
  <text x="352" y="167" class="method">+ getId(): Long</text>
  <text x="352" y="183" class="method">+ getRating(): Integer</text>
  <text x="352" y="199" class="method">+ getContent(): String</text>

  <!-- ========== VenueAvailabilityResponse DTO ========== -->
  <rect x="30" y="370" width="220" height="110" rx="4" fill="#fff" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="370" width="220" height="28" rx="4" fill="#388E3C"/>
  <text x="140" y="388" text-anchor="middle" class="class-title" fill="#fff">«DTO» VenueAvailabilityResponse</text>
  <rect x="30" y="398" width="220" height="42" fill="#fff"/>
  <text x="42" y="416" class="attr">- reservable: boolean</text>
  <text x="42" y="432" class="attr">- reasonCode: String</text>
  <rect x="30" y="440" width="220" height="40" fill="#E8F5E9"/>
  <text x="42" y="458" class="method">+ isReservable(): boolean</text>
  <text x="42" y="474" class="method">+ getDisplayMessage(): String</text>

  <!-- ========== VenueOpsUpdateRequest DTO ========== -->
  <rect x="340" y="250" width="200" height="95" rx="4" fill="#fff" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="250" width="200" height="28" rx="4" fill="#388E3C"/>
  <text x="440" y="268" text-anchor="middle" class="class-title" fill="#fff">«DTO» VenueOpsUpdateRequest</text>
  <rect x="340" y="278" width="200" height="25" fill="#fff"/>
  <text x="352" y="296" class="attr">- maintenanceStatus: Enum (opt)</text>
  <rect x="340" y="303" width="200" height="42" fill="#E8F5E9"/>
  <text x="352" y="322" class="method">+ (all fields optional, getter/setter)</text>

  <!-- ========== CommentCreateRequest DTO ========== -->
  <rect x="340" y="370" width="200" height="95" rx="4" fill="#fff" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="370" width="200" height="28" rx="4" fill="#388E3C"/>
  <text x="440" y="388" text-anchor="middle" class="class-title" fill="#fff">«DTO» CommentCreateRequest</text>
  <rect x="340" y="398" width="200" height="25" fill="#fff"/>
  <text x="352" y="416" class="attr">- venueId: Long (@NotNull)</text>
  <rect x="340" y="423" width="200" height="42" fill="#E8F5E9"/>
  <text x="352" y="442" class="method">+ (validated @Min @Max @Size)</text>

  <!-- ========== VenueOpsService Interface ========== -->
  <rect x="640" y="55" width="220" height="130" rx="4" fill="#FFF8E1" stroke="#FF8F00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="55" width="220" height="28" rx="4" fill="#FF8F00"/>
  <text x="750" y="73" text-anchor="middle" class="class-title" fill="#fff">«接口» VenueOpsService</text>
  <rect x="640" y="83" width="220" height="102" fill="#FFF8E1"/>
  <text x="652" y="102" class="method">+ getOrCreateByVenueId(id): VenueOps</text>
  <text x="652" y="118" class="method">+ updateByVenueId(req): void</text>
  <text x="652" y="134" class="method">+ evaluateAvailability(id):</text>
  <text x="660" y="148" class="method">  VenueAvailabilityResponse</text>
  <text x="652" y="164" class="method">+ getById(id): VenueOps</text>
  <text x="652" y="180" class="method">+ maskPhone(phone, role): String</text>

  <!-- ========== CommentService Interface ========== -->
  <rect x="640" y="230" width="220" height="130" rx="4" fill="#FFF8E1" stroke="#FF8F00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="230" width="220" height="28" rx="4" fill="#FF8F00"/>
  <text x="750" y="248" text-anchor="middle" class="class-title" fill="#fff">«接口» CommentService</text>
  <rect x="640" y="258" width="220" height="102" fill="#FFF8E1"/>
  <text x="652" y="278" class="method">+ listLatest(venueId, keyword): List</text>
  <text x="652" y="294" class="method">+ validateBeforeCreate(userId,</text>
  <text x="660" y="308" class="method">  venueId, content): void</text>
  <text x="652" y="324" class="method">+ create(req): Comment</text>
  <text x="652" y="340" class="method">+ deleteById(id, userId): void</text>
  <text x="652" y="356" class="method">+ filterSensitiveWords(text): boolean</text>

  <!-- ========== VenueOpsServiceImpl ========== -->
  <rect x="640" y="390" width="220" height="150" rx="4" fill="#fff" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="390" width="220" height="28" rx="4" fill="#1976D2"/>
  <text x="750" y="408" text-anchor="middle" class="class-title" fill="#fff">VenueOpsServiceImpl</text>
  <rect x="640" y="418" width="220" height="122" fill="#E3F2FD"/>
  <text x="652" y="438" class="method">+ getOrCreateByVenueId(id): VenueOps</text>
  <text x="652" y="454" class="method">+ updateByVenueId(req): void</text>
  <text x="652" y="470" class="method">+ evaluateAvailability(id): Response</text>
  <text x="652" y="486" class="method">+ maskPhone(phone, role): String</text>
  <text x="652" y="502" class="method">- checkSecurityContext(): String</text>
  <text x="652" y="518" class="method">+ getByVenueId(id): VenueOps</text>
  <text x="652" y="534" class="method">+ save(entity): boolean</text>

  <!-- ========== CommentServiceImpl ========== -->
  <rect x="340" y="480" width="220" height="130" rx="4" fill="#fff" stroke="#F57C00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="480" width="220" height="28" rx="4" fill="#F57C00"/>
  <text x="450" y="498" text-anchor="middle" class="class-title" fill="#fff">CommentServiceImpl</text>
  <rect x="340" y="508" width="220" height="102" fill="#FFF3E0"/>
  <text x="352" y="528" class="method">+ listLatest(venueId, keyword): List</text>
  <text x="352" y="544" class="method">+ validateBeforeCreate(userId,</text>
  <text x="360" y="558" class="method">  venueId, content): void</text>
  <text x="352" y="574" class="method">+ create(req): Comment</text>
  <text x="352" y="590" class="method">+ deleteById(id, userId): void</text>
  <text x="352" y="606" class="method">- checkSpam(uid, vid): boolean</text>

  <!-- ========== VenueOpsController ========== -->
  <rect x="30" y="500" width="220" height="120" rx="4" fill="#fff" stroke="#7B1FA2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="500" width="220" height="28" rx="4" fill="#7B1FA2"/>
  <text x="140" y="518" text-anchor="middle" class="class-title" fill="#fff">VenueOpsController</text>
  <rect x="30" y="528" width="220" height="92" fill="#F3E5F5"/>
  <text x="42" y="548" class="method">+ GET /api/venue-ops/{venueId}</text>
  <text x="42" y="564" class="method">+ PUT /api/venue-ops/{venueId}</text>
  <text x="42" y="580" class="method">+ GET /api/venue-ops/{venueId}/</text>
  <text x="46" y="594" class="method">  availability</text>
  <text x="42" y="612" class="method">- getCurrentUserRole(): String</text>

  <!-- ========== CommentController ========== -->
  <rect x="660" y="555" width="210" height="85" rx="4" fill="#fff" stroke="#7B1FA2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="555" width="210" height="28" rx="4" fill="#7B1FA2"/>
  <text x="765" y="573" text-anchor="middle" class="class-title" fill="#fff">CommentController</text>
  <rect x="660" y="583" width="210" height="57" fill="#F3E5F5"/>
  <text x="672" y="603" class="method">+ GET /api/comments</text>
  <text x="672" y="619" class="method">+ POST /api/comments</text>
  <text x="672" y="635" class="method">+ DELETE /api/comments/{id}</text>

  <!-- ========== Relationships ========== -->
  <line x1="250" y1="560" x2="638" y2="400" stroke="#1976D2" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <text x="430" y="490" class="rel-label" fill="#1976D2">依赖 (注入)</text>

  <line x1="560" y1="550" x2="658" y2="555" stroke="#F57C00" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <text x="600" y="545" class="rel-label" fill="#F57C00">依赖</text>

  <line x1="640" y1="220" x2="640" y2="390" stroke="#7B1FA2" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowT)"/>
  <text x="615" y="310" class="rel-label" fill="#7B1FA2">实现</text>

  <line x1="340" y1="305" x2="340" y2="480" stroke="#7B1FA2" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowT)"/>
  <text x="315" y="395" class="rel-label" fill="#7B1FA2">实现</text>

  <path d="M560,560 L510,560 L510,580" fill="none" stroke="#E65100" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="526" y="574" class="rel-label" fill="#E65100">extends</text>

  <!-- Service → DTO -->
  <line x1="640" y1="460" x2="250" y2="425" stroke="#388E3C" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="400" y="440" font-size="9" fill="#388E3C">返回</text>

  <line x1="640" y1="505" x2="540" y2="350" stroke="#388E3C" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="580" y="430" font-size="9" fill="#388E3C">接收</text>

  <rect x="30" y="632" width="500" height="18" rx="3" fill="#F5F7FA"/>
  <text x="280" y="645" text-anchor="middle" font-size="9" fill="#888">图例: —— 关联  ---- 依赖  ---- 实现  ---- 泛化</text>
</svg>