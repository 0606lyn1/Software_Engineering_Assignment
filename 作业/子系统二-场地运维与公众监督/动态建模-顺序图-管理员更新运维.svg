<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .lifeline { font-size: 11px; font-weight: bold; fill: #fff; }
      .msg-text { font-size: 10px; fill: #333; }
      .frag-text { font-size: 11px; font-weight: bold; fill: #2c3e50; }
    </style>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.08"/></filter>
    <marker id="arrowF" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#D32F2F"/></marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1B5E20"/></marker>
    <marker id="arrowO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#E65100"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#FAFBFC" rx="8"/>

  <text x="500" y="28" text-anchor="middle" class="title">子系统二——顺序图：管理员更新场地运维信息并触发可用性变化</text>
  <line x1="80" y1="40" x2="920" y2="40" stroke="#D32F2F" stroke-width="1.5"/>

  <!-- Lifelines -->
  <rect x="30" y="55" width="80" height="26" rx="3" fill="#D32F2F" filter="url(#shadow)"/>
  <text x="70" y="73" text-anchor="middle" class="lifeline" font-size="10">管理员</text>
  <line x1="70" y1="81" x2="70" y2="550" stroke="#D32F2F" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="170" y="55" width="110" height="26" rx="3" fill="#D32F2F" filter="url(#shadow)"/>
  <text x="225" y="73" text-anchor="middle" class="lifeline" font-size="10">AdminManage.vue</text>
  <line x1="225" y1="81" x2="225" y2="550" stroke="#D32F2F" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="350" y="55" width="130" height="26" rx="3" fill="#388E3C" filter="url(#shadow)"/>
  <text x="415" y="73" text-anchor="middle" class="lifeline" font-size="10">VenueOpsController</text>
  <line x1="415" y1="81" x2="415" y2="550" stroke="#388E3C" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="550" y="55" width="150" height="26" rx="3" fill="#388E3C" filter="url(#shadow)"/>
  <text x="625" y="73" text-anchor="middle" class="lifeline" font-size="10">VenueOpsService</text>
  <line x1="625" y1="81" x2="625" y2="550" stroke="#388E3C" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="770" y="55" width="100" height="26" rx="3" fill="#F57C00" filter="url(#shadow)"/>
  <text x="820" y="73" text-anchor="middle" class="lifeline" font-size="10">MySQL(DB)</text>
  <line x1="820" y1="81" x2="820" y2="550" stroke="#F57C00" stroke-width="1" stroke-dasharray="5,4"/>

  <rect x="900" y="55" width="80" height="26" rx="3" fill="#7B1FA2" filter="url(#shadow)"/>
  <text x="940" y="73" text-anchor="middle" class="lifeline" font-size="9">子系统一</text>
  <line x1="940" y1="81" x2="940" y2="550" stroke="#7B1FA2" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Messages -->

  <!-- 1. Admin opens ops modal -->
  <line x1="70" y1="110" x2="223" y2="110" stroke="#D32F2F" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <text x="130" y="103" class="msg-text">1. 进入管理员后台 (AdminManage)</text>

  <!-- 2. Click "运维" button -->
  <line x1="70" y1="135" x2="223" y2="135" stroke="#D32F2F" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <text x="130" y="128" class="msg-text">2. 在场地Tab点击"运维"按钮</text>

  <!-- 3. Load current ops data -->
  <line x1="225" y1="158" x2="413" y2="158" stroke="#D32F2F" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <text x="300" y="150" class="msg-text">3. GET /api/venue-ops/{venueId}</text>

  <!-- 4. Controller → Service -->
  <line x1="415" y1="180" x2="623" y2="180" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <text x="510" y="173" class="msg-text">4. getOrCreateByVenueId(venueId)</text>

  <!-- 5. Service → DB -->
  <line x1="625" y1="200" x2="818" y2="200" stroke="#E65100" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <text x="710" y="193" class="msg-text">5. SELECT * FROM t_venue_ops WHERE venue_id=?</text>

  <!-- 6. Return ops data -->
  <line x1="818" y1="222" x2="417" y2="222" stroke="#E65100" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="600" y="215" class="msg-text">6. 返回VenueOps(含脱敏电话)</text>

  <!-- 7. Frontend → admin (display modal) -->
  <line x1="223" y1="245" x2="72" y2="245" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="130" y="238" class="msg-text">7. 显示运维配置弹窗</text>

  <!-- ===== alt: Admin updates ops ===== -->
  <rect x="35" y="265" width="920" height="260" rx="6" fill="none" stroke="#E65100" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="35" y="265" width="120" height="20" rx="3" fill="#FFF3E0"/>
  <text x="95" y="279" class="frag-text" font-size="10" fill="#E65100">alt [更新运维信息]</text>

  <!-- 8. Admin fills form -->
  <line x1="70" y1="305" x2="223" y2="305" stroke="#D32F2F" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <text x="135" y="298" class="msg-text">8. 修改 maintenanceStatus="MAINTENANCE"</text>
  <text x="135" y="312" class="msg-text">    cleaningStatus="PENDING_RECTIFICATION"</text>

  <!-- 9. Submit update -->
  <line x1="225" y1="335" x2="413" y2="335" stroke="#D32F2F" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <text x="310" y="328" class="msg-text">9. PUT /api/venue-ops/{venueId}</text>
  <text x="310" y="342" class="msg-text">   Body: VenueOpsUpdateRequest</text>

  <!-- 10. Controller → Service -->
  <line x1="415" y1="362" x2="623" y2="362" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <text x="510" y="355" class="msg-text">10. updateByVenueId(updateReq)</text>

  <!-- 11. Service → DB (save) -->
  <line x1="625" y1="385" x2="818" y2="385" stroke="#E65100" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <text x="710" y="378" class="msg-text">11. UPDATE t_venue_ops SET maintenance_status=... WHERE venue_id=?</text>

  <!-- 12. Service self-call: evaluateAvailability -->
  <rect x="600" y="408" width="200" height="30" rx="4" fill="#E8F5E9" stroke="#388E3C" stroke-width="0.5"/>
  <text x="700" y="420" text-anchor="middle" class="msg-text" font-size="9">12. evaluateAvailability(venueId)</text>
  <text x="700" y="432" text-anchor="middle" class="msg-text" font-size="9">判断: maintenance=NORMAL?</text>

  <!-- 13. Return evaluation -->
  <rect x="600" y="450" width="230" height="50" rx="4" fill="#E3F2FD" stroke="#1976D2" stroke-width="0.5"/>
  <text x="715" y="468" text-anchor="middle" class="msg-text" font-size="9">13. VenueAvailabilityResponse:</text>
  <text x="715" y="482" text-anchor="middle" class="msg-text" font-size="9">reservable=false, reasonCode="MAINTENANCE"</text>
  <text x="715" y="496" text-anchor="middle" class="msg-text" font-size="9">displayMessage="场地维护中,暂不可预约"</text>

  <!-- 14. Return response to controller -->
  <line x1="623" y1="510" x2="417" y2="510" stroke="#388E3C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="510" y="503" class="msg-text">14. 返回更新结果+可用性报告</text>

  <!-- 15. Return to frontend -->
  <line x1="413" y1="530" x2="227" y2="530" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="310" y="523" class="msg-text">15. 200 OK + VenueAvailabilityResponse</text>

  <!-- After alt -->
  <!-- 16. Display to admin -->
  <line x1="223" y1="555" x2="72" y2="555" stroke="#D32F2F" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowF)"/>
  <text x="135" y="548" class="msg-text">16. 弹窗显示更新成功+场地不可预约状态</text>

  <!-- 17. Notify 子系统一 -->
  <line x1="625" y1="575" x2="938" y2="575" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="760" y="568" class="msg-text" fill="#7B1FA2">17. 推送可用性变更(异步/下次调用时感知)</text>

  <text x="500" y="595" text-anchor="middle" font-size="10" fill="#888">——→ 同步调用  ----→ 返回  alt [分支]  self-call 自调用</text>
</svg>