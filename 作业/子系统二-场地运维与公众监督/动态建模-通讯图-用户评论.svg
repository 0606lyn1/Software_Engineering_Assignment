<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040">
<title>子系统二：通讯图-用户评论监督</title>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FBFF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#EEF4FA" stroke-width="1"/></pattern>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#375A7F"/>
</marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#C56A1A"/>
</marker>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#94A3B8" flood-opacity=".28"/></filter>
</defs>
<rect x="0" y="0" width="1700" height="1040" fill="#FFFFFF"/>
<rect x="26" y="24" width="1648" height="992" rx="16" fill="url(#paper)" stroke="#D9E2EC" stroke-width="2"/>
<rect x="42" y="124" width="1616" height="864" fill="url(#grid)" opacity=".55"/>
<rect x="640" y="36" width="420" height="5" rx="3" fill="#2F80ED"/>
<text x="850" y="78" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="34" font-weight="700" fill="#173A5E">子系统二：通讯图-用户评论监督</text>
<text x="850" y="112" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" fill="#64748B">UML通讯图：对象协作网络与消息编号</text>
<rect x="120" y="180" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="138" y="212" font-size="16" font-weight="700" fill="#172033"><tspan x="138" dy="0">user:User</tspan></text>
<text x="138" y="244" font-size="14" font-weight="400" fill="#172033"><tspan x="138" dy="0">发表反馈</tspan></text>
<rect x="600" y="150" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="618" y="182" font-size="16" font-weight="700" fill="#172033"><tspan x="618" dy="0">page:CommentPage</tspan></text>
<text x="618" y="214" font-size="14" font-weight="400" fill="#172033"><tspan x="618" dy="0">收集评分内容</tspan></text>
<rect x="1080" y="180" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="1098" y="212" font-size="16" font-weight="700" fill="#172033"><tspan x="1098" dy="0">controller:CommentController</tspan></text>
<text x="1098" y="244" font-size="14" font-weight="400" fill="#172033"><tspan x="1098" dy="0">接收请求</tspan></text>
<rect x="250" y="570" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="268" y="602" font-size="16" font-weight="700" fill="#172033"><tspan x="268" dy="0">service:CommentService</tspan></text>
<text x="268" y="634" font-size="14" font-weight="400" fill="#172033"><tspan x="268" dy="0">评论业务</tspan></text>
<rect x="760" y="560" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="778" y="592" font-size="16" font-weight="700" fill="#172033"><tspan x="778" dy="0">mapper:CommentMapper</tspan></text>
<text x="778" y="624" font-size="14" font-weight="400" fill="#172033"><tspan x="778" dy="0">写入数据</tspan></text>
<rect x="1240" y="570" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#2F80ED" stroke-width="2" filter="url(#shadow)"/>
<text x="1258" y="602" font-size="16" font-weight="700" fill="#172033"><tspan x="1258" dy="0">todo:TodoService</tspan></text>
<text x="1258" y="634" font-size="14" font-weight="400" fill="#172033"><tspan x="1258" dy="0">负责人待办</tspan></text>
<line x1="265" y1="240" x2="745" y2="210" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="413" y="203" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="505" y="222" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">1: 填写</text>
<line x1="745" y1="210" x2="1225" y2="240" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="893" y="203" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="985" y="222" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">2: 提交</text>
<line x1="1225" y1="240" x2="395" y2="630" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="718" y="413" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="810" y="432" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">3: create</text>
<line x1="395" y1="630" x2="905" y2="620" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="558" y="603" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="650" y="622" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">4: insert</text>
<line x1="395" y1="630" x2="1385" y2="630" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="798" y="608" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="890" y="627" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">5: negative todo</text>
<line x1="395" y1="630" x2="1225" y2="240" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="718" y="413" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="810" y="432" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">6: result</text>
<line x1="1225" y1="240" x2="745" y2="210" stroke="#375A7F" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="893" y="203" width="184" height="28" rx="6" fill="#FFFFFF" stroke="#D9E2EC"/>
<text x="985" y="222" text-anchor="middle" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="14" fill="#172033">7: display</text>
<text x="1646" y="998" text-anchor="end" font-family="Microsoft YaHei,SimHei,Noto Sans CJK SC,Arial,sans-serif" font-size="13" fill="#94A3B8">SVG / Visio style / latest system model</text>
</svg>