<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="950" height="650">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .obj-text { font-size: 12px; font-weight: bold; fill: #fff; }
      .msg-text { font-size: 9px; fill: #333; }
      .num { font-size: 12px; font-weight: bold; fill: #D32F2F; }
    </style>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.1"/></filter>
    <marker id="arrowMsg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect width="950" height="650" fill="#FAFBFC" rx="8"/>

  <text x="475" y="28" text-anchor="middle" class="title">子系统二——通讯图：用户发表评论 (Communication Diagram)</text>
  <line x1="120" y1="40" x2="830" y2="40" stroke="#4A90D9" stroke-width="1.5"/>

  <!-- Object Boxes -->
  <rect x="30" y="80" width="160" height="55" rx="6" fill="#1976D2" stroke="#1565C0" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="103" text-anchor="middle" class="obj-text" font-size="11">用户 (User)</text>
  <text x="110" y="120" text-anchor="middle" class="obj-text" font-size="9" font-weight="normal">学生/教师</text>

  <rect x="280" y="80" width="160" height="55" rx="6" fill="#1976D2" stroke="#1565C0" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="103" text-anchor="middle" class="obj-text" font-size="11">VenueList/CommentList</text>
  <text x="360" y="120" text-anchor="middle" class="obj-text" font-size="9" font-weight="normal">Vue3 前端组件</text>

  <rect x="550" y="80" width="155" height="55" rx="6" fill="#388E3C" stroke="#2E7D32" stroke-width="2" filter="url(#shadow)"/>
  <text x="627" y="103" text-anchor="middle" class="obj-text" font-size="11">CommentController</text>
  <text x="627" y="120" text-anchor="middle" class="obj-text" font-size="9" font-weight="normal">Spring REST API</text>

  <rect x="760" y="80" width="155" height="55" rx="6" fill="#388E3C" stroke="#2E7D32" stroke-width="2" filter="url(#shadow)"/>
  <text x="837" y="103" text-anchor="middle" class="obj-text" font-size="11">CommentServiceImpl</text>
  <text x="837" y="120" text-anchor="middle" class="obj-text" font-size="9" font-weight="normal">Service + Filter</text>

  <rect x="550" y="240" width="200" height="55" rx="6" fill="#F57C00" stroke="#E65100" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="263" text-anchor="middle" class="obj-text" font-size="11">t_comment (MySQL)</text>
  <text x="650" y="280" text-anchor="middle" class="obj-text" font-size="9" font-weight="normal">评论数据表</text>

  <rect x="30" y="240" width="160" height="55" rx="6" fill="#7B1FA2" stroke="#6A1B9A" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="263" text-anchor="middle" class="obj-text" font-size="11">敏感词过滤器</text>
  <text x="110" y="280" text-anchor="middle" class="obj-text" font-size="9" font-weight="normal">sensitive-words list</text>

  <rect x="280" y="240" width="160" height="55" rx="6" fill="#E65100" stroke="#BF360C" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="263" text-anchor="middle" class="obj-text" font-size="11">反刷屏检测</text>
  <text x="360" y="280" text-anchor="middle" class="obj-text" font-size="9" font-weight="normal">60s cooldown</text>

  <!-- Links + Messages -->
  <!-- 1. User → Frontend -->
  <line x1="190" y1="107" x2="278" y2="107" stroke="#555" stroke-width="1.5" marker-end="url(#arrowMsg)"/>
  <circle cx="205" cy="107" r="8" fill="#fff" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="205" y="110" text-anchor="middle" class="num">1</text>
  <text x="235" y="98" class="msg-text">输入评论</text>

  <!-- 2. Frontend → Controller -->
  <line x1="440" y1="107" x2="548" y2="107" stroke="#555" stroke-width="1.5" marker-end="url(#arrowMsg)"/>
  <circle cx="470" cy="107" r="8" fill="#fff" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="470" y="110" text-anchor="middle" class="num">2</text>
  <text x="495" y="98" class="msg-text">POST /api/comments</text>

  <!-- 3. Controller → Service -->
  <line x1="705" y1="107" x2="758" y2="107" stroke="#555" stroke-width="1.5" marker-end="url(#arrowMsg)"/>
  <circle cx="725" cy="107" r="8" fill="#fff" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="725" y="110" text-anchor="middle" class="num">3</text>
  <text x="730" y="98" class="msg-text">validateBeforeCreate()</text>

  <!-- 4. Service → Sensitive filter -->
  <line x1="800" y1="135" x2="130" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrowMsg)"/>
  <circle cx="450" cy="175" r="8" fill="#fff" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="450" y="178" text-anchor="middle" class="num">4</text>
  <text x="465" y="168" class="msg-text">filterSensitiveWords(content)</text>

  <!-- 5. Service → Anti-spam -->
  <line x1="800" y1="135" x2="380" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#arrowMsg)"/>
  <circle cx="580" cy="175" r="8" fill="#fff" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="580" y="178" text-anchor="middle" class="num">5</text>
  <text x="600" y="168" class="msg-text">checkSpam(userId, venueId)</text>

  <!-- 6. Service → DB (save) -->
  <line x1="800" y1="135" x2="650" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#arrowMsg)"/>
  <circle cx="720" cy="200" r="8" fill="#fff" stroke="#D32F2F" stroke-width="1.5"/>
  <text x="720" y="203" text-anchor="middle" class="num">6</text>
  <text x="730" y="193" class="msg-text">INSERT INTO t_comment</text>

  <!-- 7. DB → Service return -->
  <line x1="550" y1="268" x2="760" y2="135" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="700" cy="235" r="8" fill="#fff" stroke="#388E3C" stroke-width="1.5"/>
  <text x="700" y="238" text-anchor="middle" class="num" fill="#388E3C">7</text>
  <text x="715" y="228" class="msg-text" fill="#388E3C">保存成功</text>

  <!-- 8. Service → Controller return -->
  <line x1="758" y1="135" x2="705" y2="135" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="740" cy="130" r="8" fill="#fff" stroke="#388E3C" stroke-width="1.5"/>
  <text x="740" y="133" text-anchor="middle" class="num" fill="#388E3C">8</text>
  <text x="748" y="123" class="msg-text" fill="#388E3C">返回Comment</text>

  <!-- 9. Controller → Frontend return -->
  <line x1="548" y1="135" x2="440" y2="135" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="505" cy="130" r="8" fill="#fff" stroke="#388E3C" stroke-width="1.5"/>
  <text x="505" y="133" text-anchor="middle" class="num" fill="#388E3C">9</text>
  <text x="515" y="123" class="msg-text" fill="#388E3C">201 Created</text>

  <!-- 10. Frontend → User display -->
  <line x1="278" y1="135" x2="190" y2="135" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="235" cy="130" r="8" fill="#fff" stroke="#388E3C" stroke-width="1.5"/>
  <text x="235" y="133" text-anchor="middle" class="num" fill="#388E3C">10</text>
  <text x="248" y="123" class="msg-text" fill="#388E3C">更新列表</text>

  <!-- Operations box -->
  <rect x="30" y="340" width="890" height="280" rx="8" fill="#F5F7FA" stroke="#ddd" stroke-width="1.5"/>
  <text x="475" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">消息序列说明</text>

  <text x="55" y="392" font-size="11" fill="#333">① 用户在前端VenueList组件中打开评论抽屉 → ② CommentList组件调用GET /api/comments获取已有评论</text>
  <text x="55" y="415" font-size="11" fill="#333">③ 用户填写评分(1-5)和评论内容(≤500字) → ④ 点击提交按钮 → ⑤ 前端发送POST /api/comments</text>
  <text x="55" y="438" font-size="11" fill="#333">⑥ CommentController接收请求 → ⑦ 调用CommentServiceImpl.validateBeforeCreate()</text>
  <text x="55" y="461" font-size="11" fill="#333">⑧ 反刷屏检测：检查该用户对该场地是否在60秒内发表过评论 → 如触发则返回429提示</text>
  <text x="55" y="484" font-size="11" fill="#333">⑨ 敏感词过滤：遍历comment.sensitive-words配置列表，匹配评论内容 → 如命中则返回提示"含敏感词"</text>
  <text x="55" y="507" font-size="11" fill="#333">⑩ 过滤通过 → INSERT INTO t_comment (user_id, venue_id, rating, content, created_at)</text>
  <text x="55" y="530" font-size="11" fill="#333">⑪ 数据库保存成功 → Service返回Comment对象 → Controller返回201 Created + JSON</text>
  <text x="55" y="553" font-size="11" fill="#333">⑫ 前端CommentList组件接收响应 → 重新调用GET /api/comments刷新列表 → 用户看到新评论</text>
  <text x="55" y="576" font-size="11" fill="#333">⑬ 如评论评分≤2(负面情感)，系统异步触发UC-O4：生成负责人待办提醒</text>
  <text x="55" y="605" font-size="11" fill="#666">通讯图关注对象间的消息传递和链接关系，与顺序图是语义等价的不同视图表达。</text>
</svg>