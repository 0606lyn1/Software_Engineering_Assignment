    <text x="820" y="419" text-anchor="middle" class="entity-title">t_cleaning_log (清洁日志)</text>
    <text x="736" y="448" class="pk">◆ id (PK)</text>
    <text x="736" y="466" class="fk"># venue_id (FK)</text>
    <text x="736" y="484" class="fk"># cleaner_id (FK)</text>
    <text x="736" y="502" class="attr">  clean_result 清洁结果</text>
