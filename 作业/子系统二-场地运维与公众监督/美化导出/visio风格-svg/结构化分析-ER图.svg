    <text x="746" y="108" class="pk">◆ id (PK)</text>
    <text x="746" y="126" class="fk"># user_id (FK)</text>
    <text x="746" y="144" class="fk"># venue_id (FK)</text>
    <text x="746" y="162" class="attr">  rating (1-5)</text>
