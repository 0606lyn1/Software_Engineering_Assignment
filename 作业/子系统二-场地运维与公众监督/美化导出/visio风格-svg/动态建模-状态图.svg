<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 836" width="1216" height="836">
  <defs id="codex-visio-style">
    <filter id="codexVisioShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#1f3b73" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="codexPageGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <pattern id="codexGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d9e3f0" stroke-width="0.8" opacity="0.38"/>
    </pattern>
    <style><![CDATA[
      svg {
        background: #edf2f8;
      }
      text {
        font-family: "Microsoft YaHei", "Microsoft JhengHei", "SimHei", "Segoe UI", Arial, sans-serif !important;
        paint-order: stroke fill;
        stroke: rgba(255,255,255,0.72);
        stroke-width: 1.2px;
        letter-spacing: 0.05px;
      }
      .codex-text-overlay text {
        filter: none !important;
        paint-order: stroke fill !important;
        stroke: #ffffff !important;
        stroke-width: 3.2px !important;
        stroke-linejoin: round !important;
      }
      .codex-text-overlay .swimlane,
      .codex-text-overlay .action,
      .codex-text-overlay .lifeline,
      .codex-text-overlay text[fill="#fff"],
      .codex-text-overlay text[fill="#ffffff"],
      .codex-text-overlay text[fill="white"] {
        stroke: rgba(18, 32, 54, 0.55) !important;
        stroke-width: 0.85px !important;
      }
      .title {
        fill: #17345d !important;
        font-weight: 700 !important;
      }
      rect:not(.codex-page-bg):not(.codex-grid-bg),
      ellipse,
      circle,
      polygon {
        filter: url(#codexVisioShadow);
        stroke-linejoin: round;
      }
      path,
      line,
      polyline {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      marker path {
        filter: none;
      }
    ]]></style>
  </defs>
  <rect class="codex-page-bg" x="0" y="0" width="1216" height="836" rx="14" fill="url(#codexPageGradient)"/>
  <rect class="codex-grid-bg" x="0" y="0" width="1216" height="836" fill="url(#codexGrid)" opacity="0.12"/>

  <g transform="translate(80 80)">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .state-text { font-size: 13px; font-weight: bold; fill: #fff; }
      .trans-text { font-size: 10px; fill: #555; }
    </style>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="arrowH" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="600" fill="#FAFBFC" rx="8"/>

  <text x="480" y="28" text-anchor="middle" class="title">子系统二——状态图：场地运维状态机 (State Machine Diagram)</text>
  <line x1="140" y1="40" x2="820" y2="40" stroke="#4A90D9" stroke-width="1.5"/>

  <!-- Initial state -->
  <circle cx="80" cy="160" r="8" fill="#333"/>
  <text x="80" y="150" font-size="10" fill="#555">初始</text>

  <!-- State: NORMAL -->
  <rect x="120" y="130" width="160" height="85" rx="12" fill="#50B86C" stroke="#3DA05A" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="162" text-anchor="middle" class="state-text" fill="#fff">NORMAL</text>
  <text x="200" y="180" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">正常使用</text>
  <text x="200" y="198" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">可预约 / 可评论</text>

  <!-- Initial → NORMAL -->
  <line x1="88" y1="160" x2="118" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <text x="95" y="148" font-size="9" fill="#555">创建</text>

  <!-- State: MAINTENANCE -->
  <rect x="420" y="130" width="160" height="85" rx="12" fill="#F5A623" stroke="#E0950F" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="162" text-anchor="middle" class="state-text" fill="#fff">MAINTENANCE</text>
  <text x="500" y="180" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">维护中</text>
  <text x="500" y="198" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">禁止预约</text>

  <!-- State: PENDING_RECTIFICATION -->
  <rect x="720" y="130" width="170" height="85" rx="12" fill="#E74C3C" stroke="#C0392B" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="155" text-anchor="middle" class="state-text" fill="#fff">PENDING_RECTIFICATION</text>
  <text x="805" y="178" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">待整改（清洁不达标）</text>
  <text x="805" y="198" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">视配置禁止预约</text>

  <!-- Transitions -->
  <!-- NORMAL → MAINTENANCE -->
  <line x1="280" y1="170" x2="418" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <text x="330" y="162" class="trans-text">PUT /venue-ops → maintenanceStatus=MAINTENANCE</text>
  <text x="330" y="178" class="trans-text">[管理员设置维护/报修触发]</text>

  <!-- MAINTENANCE → NORMAL -->
  <line x1="418" y1="185" x2="280" y2="185" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowH)"/>
  <text x="320" y="201" class="trans-text">maintenanceStatus=NORMAL</text>
  <text x="320" y="215" class="trans-text">[维修完成·管理员恢复]</text>

  <!-- NORMAL → PENDING_RECTIFICATION -->
  <path d="M200,215 Q200,270 500,270" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <text x="310" y="255" class="trans-text">cleaningStatus=PENDING_RECTIFICATION</text>
  <text x="310" y="271" class="trans-text">[保洁打卡结果=待整改]</text>

  <!-- PENDING_RECTIFICATION → NORMAL -->
  <path d="M720,200 Q500,330 280,215" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowH)"/>
  <text x="480" y="300" class="trans-text">cleaningStatus=QUALIFIED</text>
  <text x="480" y="316" class="trans-text">[重新清洁·检查通过]</text>

  <!-- Composite state: LIGHTING -->
  <rect x="180" y="330" width="600" height="160" rx="10" fill="none" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="200" y="352" font-size="12" font-weight="bold" fill="#9C27B0">灯光子系统 (lighting_status)</text>

  <!-- NORMAL_LIGHTING -->
  <rect x="210" y="368" width="150" height="55" rx="8" fill="#66BB6A" stroke="#43A047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="285" y="392" text-anchor="middle" class="state-text" fill="#fff" font-size="12">LIGHTING_NORMAL</text>
  <text x="285" y="410" text-anchor="middle" font-size="10" fill="#fff">灯光正常</text>

  <!-- PARTIAL_FAULT -->
  <rect x="410" y="368" width="150" height="55" rx="8" fill="#F5A623" stroke="#E0950F" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="485" y="392" text-anchor="middle" class="state-text" fill="#fff" font-size="12">PARTIAL_FAULT</text>
  <text x="485" y="410" text-anchor="middle" font-size="10" fill="#fff">部分灯具故障</text>

  <!-- FULL_FAULT -->
  <rect x="610" y="368" width="150" height="55" rx="8" fill="#E74C3C" stroke="#C0392B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="685" y="392" text-anchor="middle" class="state-text" fill="#fff" font-size="12">FULL_FAULT</text>
  <text x="685" y="410" text-anchor="middle" font-size="10" fill="#fff">全部故障</text>
  <text x="685" y="424" text-anchor="middle" font-size="9" fill="#fff">禁止夜间户外</text>

  <!-- Light transitions -->
  <line x1="360" y1="395" x2="408" y2="395" stroke="#555" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <text x="375" y="388" class="trans-text">部分故障</text>

  <line x1="560" y1="395" x2="608" y2="395" stroke="#555" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <text x="575" y="388" class="trans-text">全部故障</text>

  <line x1="560" y1="410" x2="408" y2="410" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowH)"/>
  <text x="475" y="425" class="trans-text">修复部分→恢复正常</text>

  <line x1="685" y1="435" x2="285" y2="435" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowH)"/>
  <text x="480" y="455" class="trans-text">更换全部灯具→恢复正常</text>

  <!-- Relationship: NORMAL → LIGHTING states -->
  <path d="M280,215 Q280,320 285,366" fill="none" stroke="#9C27B0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="260" y="290" font-size="9" fill="#9C27B0">灯光状态作为</text>
  <text x="260" y="302" font-size="9" fill="#9C27B0">场馆运维的子状态</text>

  <!-- Evaluation exit point -->
  <rect x="440" y="520" width="200" height="40" rx="8" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5"/>
  <text x="540" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#546E7A">evaluateAvailability()</text>
  <text x="540" y="555" text-anchor="middle" font-size="9" fill="#555">汇总→VenueAvailabilityResponse</text>

  <path d="M285,423 Q285,520 438,540" fill="none" stroke="#546E7A" stroke-width="1" marker-end="url(#arrowH)"/>
  <path d="M485,423 Q485,520 438,540" fill="none" stroke="#546E7A" stroke-width="1" marker-end="url(#arrowH)"/>
  <path d="M685,423 Q685,520 640,540" fill="none" stroke="#546E7A" stroke-width="1" marker-end="url(#arrowH)"/>

  <text x="480" y="590" text-anchor="middle" font-size="10" fill="#999">图例: ——→ 正常迁移  ----→ 返回迁移  ■ 初始状态  ==== 复合状态</text>

  </g>
  <g class="codex-text-overlay" transform="translate(80 80)">
    <text x="480" y="28" text-anchor="middle" class="title">子系统二——状态图：场地运维状态机 (State Machine Diagram)</text>
    <text x="80" y="150" font-size="10" fill="#555">初始</text>
    <text x="200" y="162" text-anchor="middle" class="state-text" fill="#fff">NORMAL</text>
    <text x="200" y="180" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">正常使用</text>
    <text x="200" y="198" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">可预约 / 可评论</text>
    <text x="95" y="148" font-size="9" fill="#555">创建</text>
    <text x="500" y="162" text-anchor="middle" class="state-text" fill="#fff">MAINTENANCE</text>
    <text x="500" y="180" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">维护中</text>
    <text x="500" y="198" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">禁止预约</text>
    <text x="805" y="155" text-anchor="middle" class="state-text" fill="#fff">PENDING_RECTIFICATION</text>
    <text x="805" y="178" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">待整改（清洁不达标）</text>
    <text x="805" y="198" text-anchor="middle" class="state-text" fill="#fff" font-size="10" font-weight="normal">视配置禁止预约</text>
    <text x="330" y="162" class="trans-text">PUT /venue-ops → maintenanceStatus=MAINTENANCE</text>
    <text x="330" y="178" class="trans-text">[管理员设置维护/报修触发]</text>
    <text x="320" y="201" class="trans-text">maintenanceStatus=NORMAL</text>
    <text x="320" y="215" class="trans-text">[维修完成·管理员恢复]</text>
    <text x="310" y="255" class="trans-text">cleaningStatus=PENDING_RECTIFICATION</text>
    <text x="310" y="271" class="trans-text">[保洁打卡结果=待整改]</text>
    <text x="480" y="300" class="trans-text">cleaningStatus=QUALIFIED</text>
    <text x="480" y="316" class="trans-text">[重新清洁·检查通过]</text>
    <text x="200" y="352" font-size="12" font-weight="bold" fill="#9C27B0">灯光子系统 (lighting_status)</text>
    <text x="285" y="392" text-anchor="middle" class="state-text" fill="#fff" font-size="12">LIGHTING_NORMAL</text>
    <text x="285" y="410" text-anchor="middle" font-size="10" fill="#fff">灯光正常</text>
    <text x="485" y="392" text-anchor="middle" class="state-text" fill="#fff" font-size="12">PARTIAL_FAULT</text>
    <text x="485" y="410" text-anchor="middle" font-size="10" fill="#fff">部分灯具故障</text>
    <text x="685" y="392" text-anchor="middle" class="state-text" fill="#fff" font-size="12">FULL_FAULT</text>
    <text x="685" y="410" text-anchor="middle" font-size="10" fill="#fff">全部故障</text>
    <text x="685" y="424" text-anchor="middle" font-size="9" fill="#fff">禁止夜间户外</text>
    <text x="375" y="388" class="trans-text">部分故障</text>
    <text x="575" y="388" class="trans-text">全部故障</text>
    <text x="475" y="425" class="trans-text">修复部分→恢复正常</text>
    <text x="480" y="455" class="trans-text">更换全部灯具→恢复正常</text>
    <text x="260" y="290" font-size="9" fill="#9C27B0">灯光状态作为</text>
    <text x="260" y="302" font-size="9" fill="#9C27B0">场馆运维的子状态</text>
    <text x="540" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#546E7A">evaluateAvailability()</text>
    <text x="540" y="555" text-anchor="middle" font-size="9" fill="#555">汇总→VenueAvailabilityResponse</text>
    <text x="480" y="590" text-anchor="middle" font-size="10" fill="#999">图例: ——→ 正常迁移  ----→ 返回迁移  ■ 初始状态  ==== 复合状态</text>
  </g>
</svg>