<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620" width="850" height="620">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a2e; }
      .pkg-text { font-size: 12px; font-weight: bold; fill: #2c3e50; }
      .sub-text { font-size: 10px; fill: #555; }
    </style>
    <filter id="shadow"><feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.08"/></filter>
    <marker id="arrowD" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#666"/></marker>
  </defs>
  <rect width="850" height="620" fill="#FAFBFC" rx="8"/>

  <text x="425" y="28" text-anchor="middle" class="title">子系统二——场地运维与公众监督系统 包图 (Package Diagram)</text>
  <line x1="100" y1="40" x2="750" y2="40" stroke="#4A90D9" stroke-width="1.5"/>

  <!-- Root package: com.example.tiyu -->
  <rect x="65" y="55" width="720" height="540" rx="8" fill="none" stroke="#1a1a2e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="65" y="55" width="220" height="24" rx="4" fill="#1a1a2e"/>
  <text x="175" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">com.example.tiyu</text>

  <!-- Controller package -->
  <rect x="90" y="95" width="320" height="170" rx="6" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="110" y="105" width="160" height="22" rx="3" fill="#1976D2"/>
  <text x="190" y="120" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">controller</text>
  <text x="110" y="148" class="sub-text">VenueOpsController</text>
  <text x="110" y="166" class="sub-text">CommentController</text>
  <text x="110" y="184" class="sub-text">AdminController</text>
  <text x="110" y="202" class="sub-text">VenueController</text>
  <text x="110" y="220" class="sub-text" fill="#999">(GET/POST/PUT/DELETE REST API)</text>
  <rect x="300" y="140" width="100" height="30" rx="3" fill="none" stroke="#1976D2" stroke-width="0.5"/>
  <text x="350" y="159" text-anchor="middle" font-size="9" fill="#1976D2">@RestController</text>

  <!-- Service package -->
  <rect x="480" y="95" width="290" height="170" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="500" y="105" width="160" height="22" rx="3" fill="#388E3C"/>
  <text x="580" y="120" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">service</text>
  <text x="500" y="148" class="sub-text">«接口» VenueOpsService</text>
  <text x="500" y="166" class="sub-text">«接口» CommentService</text>
  <text x="500" y="184" class="sub-text">VenueOpsServiceImpl</text>
  <text x="500" y="202" class="sub-text">CommentServiceImpl</text>
  <text x="500" y="220" class="sub-text" fill="#999">(业务逻辑 + 领域服务)</text>
  <rect x="660" y="140" width="100" height="30" rx="3" fill="none" stroke="#388E3C" stroke-width="0.5"/>
  <text x="710" y="159" text-anchor="middle" font-size="9" fill="#388E3C">@Service</text>

  <!-- Entity/Model package -->
  <rect x="90" y="300" width="320" height="120" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="110" y="310" width="160" height="22" rx="3" fill="#F57C00"/>
  <text x="190" y="325" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">entity / model</text>
  <text x="110" y="355" class="sub-text">VenueOps</text>
  <text x="110" y="373" class="sub-text">Comment</text>
  <text x="110" y="391" class="sub-text">Venue / User / CleaningLog</text>
  <text x="110" y="409" class="sub-text" fill="#999">(JPA/MyBatis-Plus 实体)</text>

  <!-- DTO package -->
  <rect x="90" y="455" width="320" height="110" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="110" y="465" width="160" height="22" rx="3" fill="#7B1FA2"/>
  <text x="190" y="480" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">dto</text>
  <text x="110" y="505" class="sub-text">VenueOpsUpdateRequest</text>
  <text x="110" y="523" class="sub-text">VenueAvailabilityResponse</text>
  <text x="110" y="541" class="sub-text">CommentCreateRequest</text>
  <text x="110" y="555" class="sub-text" fill="#999">(request/response DTO)</text>

  <!-- Mapper package -->
  <rect x="480" y="300" width="290" height="100" rx="6" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="500" y="310" width="160" height="22" rx="3" fill="#D32F2F"/>
  <text x="580" y="325" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">mapper</text>
  <text x="500" y="355" class="sub-text">VenueOpsMapper</text>
  <text x="500" y="373" class="sub-text">CommentMapper</text>
  <text x="500" y="391" class="sub-text" fill="#999">(MyBatis-Plus BaseMapper)</text>

  <!-- Config package -->
  <rect x="480" y="430" width="290" height="110" rx="6" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="500" y="440" width="160" height="22" rx="3" fill="#546E7A"/>
  <text x="580" y="455" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">config</text>
  <text x="500" y="485" class="sub-text">SecurityConfig</text>
  <text x="500" y="503" class="sub-text">JwtConfig</text>
  <text x="500" y="521" class="sub-text">MyBatisPlusConfig</text>
  <text x="500" y="535" class="sub-text" fill="#999">(@Configuration)</text>

  <!-- Dependency arrows -->
  <line x1="410" y1="180" x2="478" y2="180" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <text x="435" y="173" font-size="9" fill="#666">依赖</text>

  <line x1="250" y1="300" x2="250" y2="267" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <text x="258" y="287" font-size="9" fill="#666">引用</text>

  <line x1="300" y1="455" x2="520" y2="400" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <text x="380" y="430" font-size="9" fill="#666">数据传输</text>

  <line x1="570" y1="300" x2="570" y2="267" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <text x="578" y="287" font-size="9" fill="#666">调用</text>

  <line x1="650" y1="430" x2="580" y2="400" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <text x="630" y="418" font-size="9" fill="#666">注入配置</text>

  <text x="425" y="605" text-anchor="middle" font-size="10" fill="#999">Spring Boot分层架构: Controller → Service → Mapper → Entity | DTO横向贯穿各层</text>
</svg>